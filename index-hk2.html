<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Văn 7 cùng em</title>
<meta name="description" content="Ôn luyện Ngữ văn 7 (Kết nối tri thức) học kì II: đọc hiểu, viết văn, đấu cặp đôi và huy hiệu cùng Mực Nhí.">
<meta name="theme-color" content="#0b8f7a">
<meta property="og:title" content="Văn 7 cùng em">
<meta property="og:description" content="Học Văn vui hơn: thám tử văn bản, xưởng viết và đấu cặp đôi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 12C50 12 15 52 15 74a35 35 0 0 0 70 0C85 52 50 12 50 12z' fill='%231a73e8'/%3E%3Cpath d='M52 14C70 2 86 4 92 8 84 12 80 20 68 24 62 26 56 22 52 14z' fill='%23ffc933'/%3E%3C/svg%3E">
<style>
/* ✅ BẢN NHÁP — thầy/cô duyệt trước khi dùng. Một file, không cần mạng, không thư viện ngoài. */
:root{
  --nen1:#e3faf1;--nen2:#fff1da;--nen3:#e2eeff;
  --chu:#10283d;--chu2:#47607a;--mat:#fff;--vien:#d3e3ee;
  --muc:#0a756f;--muc2:#0f9a8d;--muc-d:#065753;
  --sky:#1a73e8;--tim:#6f42c1;--vang:#ffc933;--vang-d:#b87900;
  --dung:#1f9d55;--dung-n:#ddf7e8;--sai:#d6336c;--sai-n:#ffe3ee;
  --tg:#6f42c1;--tg-n:#ece5fd;--doc:#1a65c8;--doc-n:#dfeaff;--tv:#b45309;--tv-n:#ffefd2;--viet:#15803d;--viet-n:#dcf5e5;--noi:#be185d;--noi-n:#ffe2ee;
  --kt:#7c5cff;--r:22px;--bong:0 10px 28px rgba(11,95,120,.14),0 2px 6px rgba(16,40,61,.08);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--chu);font-size:17px;line-height:1.5;background:
  radial-gradient(700px 420px at 0% -4%,var(--nen1),transparent 62%),
  radial-gradient(700px 420px at 100% 6%,var(--nen2),transparent 62%),
  radial-gradient(900px 500px at 50% 110%,var(--nen3),transparent 60%),#fbfffe;background-attachment:fixed;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--vang);outline-offset:2px}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--vien)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;border:0;background:none;padding:0}
.logo span{white-space:nowrap;background:linear-gradient(90deg,#0a8f80,#1a73e8 60%,#6f42c1);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;background:#fff;border:1px solid var(--vien)}
.chip.xp{background:linear-gradient(90deg,#fff3bf,#ffe3b3);border-color:#ffd27a;color:#7a4a00}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--vien);background:#fff;display:grid;place-items:center}
main{max-width:780px;margin:0 auto;padding:16px}
.card{background:var(--mat);border:1px solid var(--vien);border-radius:var(--r);box-shadow:var(--bong);padding:18px;margin-bottom:16px}
h1,h2,h3{line-height:1.25;margin:0 0 8px}
h1{font-size:26px}h2{font-size:22px}h3{font-size:18px}
.mut{color:var(--chu2);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:16px;border:0;font-weight:800;color:#fff;background:linear-gradient(180deg,#0f9a8d,#0a756f);box-shadow:0 4px 0 var(--muc-d),0 8px 16px rgba(10,117,111,.25);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--muc-d)}
.btn.vang{background:linear-gradient(180deg,#ffe066,#ffc233);color:#4b3200;box-shadow:0 4px 0 var(--vang-d),0 8px 16px rgba(255,194,51,.35)}
.btn.xanh{background:linear-gradient(180deg,#2fbf71,#1f9d55);box-shadow:0 4px 0 #14703c,0 8px 16px rgba(31,157,85,.25)}
.btn.sky{background:linear-gradient(180deg,#4d9bff,#1a65c8);box-shadow:0 4px 0 #124b94,0 8px 16px rgba(26,101,200,.25)}
.btn.phu{background:#fff;color:var(--muc);border:2px solid var(--muc2);box-shadow:none}
.btn.nho{min-height:40px;padding:6px 14px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tagchip{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px}
.t-tg{background:var(--tg-n);color:var(--tg)}.t-doc{background:var(--doc-n);color:var(--doc)}.t-tv{background:var(--tv-n);color:var(--tv)}.t-viet{background:var(--viet-n);color:var(--viet)}.t-noi{background:var(--noi-n);color:var(--noi)}
.m-biet{background:#e8eef5;color:#385068}.m-hieu{background:#fff0c2;color:#7a5300}.m-vd{background:#ffd9e6;color:#9d1b50}
.draft{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:15;text-align:center;font-size:12.5px;color:#7a4a00;background:#fff3bf;border-top:1px solid #ffe066;padding:3px 8px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--vien)}
#nav button{flex:1;max-width:150px;min-height:54px;border:0;background:none;border-radius:14px;font-size:13px;font-weight:700;color:var(--chu2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#nav button.on{background:#d9f5ef;color:var(--muc)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;color:#fff;padding:22px 20px;margin-bottom:16px;background:linear-gradient(135deg,#0b8f7a 0%,#1a73e8 58%,#6f42c1 100%);box-shadow:0 14px 34px rgba(26,115,232,.28)}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%)}
.hero:after{content:"";position:absolute;left:-40px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,51,.35),transparent 68%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:30px;margin:0 0 4px}
.hero p{margin:0 0 12px;opacity:.95}
.hero .pil{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.hero .pil span{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.hero-row{display:flex;gap:14px;align-items:center}
.mapwrap{position:relative;margin:0 auto;max-width:470px;background:linear-gradient(180deg,#d9f1ff,#e6fbef 52%,#fff1da);overflow:hidden}
.mapwrap svg{width:100%;height:auto;display:block}
.node{cursor:pointer}.node:hover .nd{transform:translateY(-3px)}
.nd{transition:transform .15s}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.bubble{position:relative;background:#fff;border:2px solid var(--vien);border-radius:18px;padding:10px 14px;font-weight:600;box-shadow:var(--bong)}
.bubble:before{content:"";position:absolute;left:-10px;top:22px;border:8px solid transparent;border-right-color:var(--vien);border-left:0}
.hello{display:flex;gap:12px;align-items:center;margin-bottom:12px}
/* trạm */
.st{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;border-left-width:8px}
.st .ico{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px}
.st h3{margin:0 0 2px}.st p{margin:0}
.st.doc{border-left-color:var(--doc)}.st.doc .ico{background:var(--doc-n)}
.st.kt{border-left-color:var(--kt)}.st.kt .ico{background:var(--tg-n)}
.st.viet{border-left-color:#22b573}.st.viet .ico{background:var(--viet-n)}
.st.xv{border-left-color:#f59f00}.st.xv .ico{background:#fff0c2}
.pilrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pilbox{border-radius:16px;padding:8px;text-align:center;font-weight:800;font-size:13px;border:2px solid transparent}
.pilbox svg{width:34px;height:34px;display:block;margin:0 auto 2px}
details.bk{background:#f4fbf9;border:2px dashed #9fd9cf;border-radius:16px;padding:10px 14px;margin-bottom:10px}
details.bk summary{font-weight:800;cursor:pointer;min-height:32px}
details.bk ol,details.bk ul{margin:8px 0 0;padding-left:22px}
/* câu hỏi */
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:14px;height:14px;border-radius:50%;background:#dfe9f2;border:2px solid #fff;box-shadow:0 0 0 1px var(--vien)}
.dot.ok{background:var(--dung)}.dot.mid{background:#f59f00}.dot.bad{background:var(--sai)}.dot.cur{box-shadow:0 0 0 3px var(--muc2)}
.q{font-size:20px;font-weight:800;margin:6px 0 14px}
.passage{background:linear-gradient(180deg,#fffef6,#fff6d6);border:2px dashed #f0cf63;border-radius:16px;padding:12px 16px;margin-bottom:14px;font-size:18px;line-height:1.7;white-space:pre-line}
.passage.sgk{background:linear-gradient(180deg,#f0fbf9,#e0f5f2);border-color:#38b2a6}
.gchips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.gchips button.chip{cursor:pointer;white-space:normal;text-align:left;background:#eefaf8;border-color:#0f9a8d;color:#0a5a55;font-weight:600}
.gchips button.chip:hover{background:#d9f3ef}
.goi table{width:100%;border-collapse:collapse;font-size:15px}.goi td{border:1px solid var(--vien);padding:6px 8px;vertical-align:top}.goi td:first-child{width:28%;font-weight:700;background:#fff8dc}
.goi ol,.goi ul{margin:6px 0;padding-left:22px}
.passage small{display:block;color:var(--chu2);font-size:12.5px;margin-top:6px;white-space:normal}
.sent{display:inline;font:inherit;line-height:1.9;text-align:left;border:0;background:none;border-bottom:2px dotted #c9a73d;border-radius:4px;padding:2px 3px;margin:0 1px;cursor:pointer;color:inherit}
.sent:hover{background:#fff0a8}
.sent.on{background:#ffe066;border-bottom-color:#b87900;box-shadow:0 0 0 2px #ffd43b}
.sent.ok{background:var(--dung-n);border-bottom:2px solid var(--dung);box-shadow:none}
.sent.bad{background:var(--sai-n);border-bottom:2px solid var(--sai);box-shadow:none}
.sent.miss{background:#fff;border:2px dashed var(--dung)}
.opts{display:grid;gap:10px}
.opt{text-align:left;min-height:52px;padding:12px 16px;border-radius:16px;border:2px solid var(--vien);background:#fff;font-weight:600;transition:transform .08s,background .15s}
.opt:hover{border-color:var(--muc2);background:#effaf8}.opt:active{transform:scale(.99)}
.opt.ok{background:var(--dung-n);border-color:var(--dung)}.opt.bad{background:var(--sai-n);border-color:var(--sai)}
.opt[disabled]{cursor:default}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{min-height:48px;padding:10px 12px;border-radius:14px;border:2px solid var(--vien);background:#fff;text-align:left;font-weight:600;font-size:16px}
.pill.sel{border-color:var(--muc2);background:#dff6f2;box-shadow:0 0 0 3px #aee6dd}
.pill.ok{background:var(--dung-n);border-color:var(--dung);pointer-events:none}
.pill.bad{background:var(--sai-n);border-color:var(--sai)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.bin{border:3px dashed #8fd0c6;border-radius:16px;background:#f0fbf9;padding:8px;min-height:92px;text-align:center;cursor:pointer}
.bin h4{margin:0 0 6px;font-size:15px;color:var(--muc-d)}
.bin.hot{background:#dff6f2;border-color:var(--muc2)}
.bin.bad{background:var(--sai-n);border-color:var(--sai)}
.bin .chip2{display:block;margin:4px 0;padding:6px 8px;border-radius:10px;background:var(--dung-n);border:1px solid var(--dung);font-size:15px;font-weight:600;text-align:left}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.slots{display:grid;gap:6px;margin-bottom:12px}
.slot{display:flex;gap:10px;align-items:flex-start;min-height:44px;border:2px dashed #8fd0c6;border-radius:12px;padding:8px 10px;background:#f0fbf9}
.slot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--muc);color:#fff;display:grid;place-items:center;font-size:14px}
.slot.fill{border-style:solid;border-color:var(--dung);background:var(--dung-n)}
.fb{margin-top:14px;display:flex;gap:12px;align-items:flex-start}
.fb .bubble{flex:1}
.fb.good .bubble{border-color:var(--dung);background:var(--dung-n)}.fb.good .bubble:before{border-right-color:var(--dung)}
.fb.bad .bubble{border-color:var(--sai);background:var(--sai-n)}.fb.bad .bubble:before{border-right-color:var(--sai)}
.mau{background:#f3f8ff;border:2px solid #b9d4ff;border-radius:14px;padding:10px 14px;margin:10px 0}
.ychk label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:2px solid var(--vien);border-radius:12px;margin:6px 0;background:#fff;cursor:pointer}
.ychk input,.rub input{width:22px;height:22px;margin-top:2px;flex:none}
/* tổng kết */
.ring{width:150px;height:150px;margin:0 auto;display:block}
.stars{display:flex;justify-content:center;gap:8px}
.badge{display:flex;gap:10px;align-items:center;border:1px solid var(--vien);border-radius:16px;padding:10px;background:#fff}
.badge .ic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:linear-gradient(180deg,#ffe8a3,#ffc233)}
.badge.lock{filter:grayscale(1);opacity:.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.bar{height:16px;border-radius:999px;background:#e5eef5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .6s}
/* viết */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.steps button{border:2px solid var(--vien);background:#fff;border-radius:16px;padding:8px 4px;font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px}
.steps button b{width:26px;height:26px;border-radius:50%;background:#dfe9f2;display:grid;place-items:center;font-size:14px}
.steps button.on{border-color:var(--muc2);background:#dff6f2}.steps button.on b{background:var(--muc);color:#fff}
.steps button.done b{background:var(--dung);color:#fff}
.khung{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.khung div{flex:1 1 130px;border-radius:14px;padding:10px;font-weight:800;text-align:center;border:2px solid rgba(16,40,61,.12)}
.khung small{display:block;font-weight:600;color:var(--chu2)}
label.f{display:block;font-weight:800;margin:12px 0 4px}
input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--vien);background:#fff;color:var(--chu)}
textarea{min-height:130px;resize:vertical;line-height:1.6}
.hint{font-size:14px;color:var(--chu2);margin:2px 0 0}
.line{display:flex;gap:8px;align-items:center;margin:6px 0}
.cnt{flex:none;min-width:70px;text-align:center;border-radius:10px;padding:6px;font-weight:800;font-size:14px;background:#eee}
.cnt.ok{background:var(--dung-n);color:#14703c}.cnt.bad{background:var(--sai-n);color:var(--sai)}
.rub label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;border:2px solid var(--vien);margin:6px 0;background:#fff;cursor:pointer}
.paper{background:#fffef8;border:1px solid #e7dfc3;border-radius:6px;padding:20px 18px;font-family:"Times New Roman",serif;font-size:17px;line-height:1.6;white-space:pre-wrap;box-shadow:inset 0 0 0 4px #fffef8,inset 0 0 0 5px #efe6c4}
.soi{background:linear-gradient(180deg,#f2fbff,#fff);border:2px solid #b9e0f5}
.tip{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;margin:6px 0;font-weight:600}
.tip.ok{background:var(--dung-n)}.tip.warn{background:#fff3cf}.tip.i{background:#eef3f8}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.stat span{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(16,40,61,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;border-radius:24px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ribbon{position:fixed;top:64px;right:-40px;transform:rotate(35deg);background:#e03131;color:#fff;font-weight:800;font-size:12px;padding:4px 50px;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.3)}
canvas#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--vien);padding:6px 8px;text-align:center}
th{background:#e7f5f2}
.scroll{overflow-x:auto}
body.chup *{animation:none!important;transition:none!important}
@media (max-width:520px){.chip.xp{font-size:13px;padding:4px 9px}.q{font-size:19px}h1{font-size:23px}.hero h1{font-size:25px}.logo{font-size:16px}.steps button{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gMuc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ad1bd"/><stop offset="1" stop-color="#1a73e8"/></linearGradient>
  <linearGradient id="gVang" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffb800"/></linearGradient>
  <linearGradient id="gXam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce4ee"/><stop offset="1" stop-color="#aab6c8"/></linearGradient>
  <linearGradient id="gLa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7be495"/><stop offset="1" stop-color="#25a35a"/></linearGradient>
  <linearGradient id="gHong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ab8"/><stop offset="1" stop-color="#d6336c"/></linearGradient>
  <radialGradient id="gGiot" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#7fd6ff"/><stop offset="1" stop-color="#1a65c8"/></radialGradient>
</defs></svg>
<header id="top"></header>
<main id="app"></main>
<div class="draft">✅ BẢN NHÁP — thầy/cô duyệt trước khi dùng · đã đối chiếu SGK Ngữ văn 7 (KNTT) tập hai · nhờ giáo viên Ngữ văn soát lần cuối</div>
<nav id="nav"></nav>
<canvas id="cf"></canvas>
<div id="modal"></div>
<div id="ribbon"></div>

<script>
"use strict";
const D = {"meta":{"ten":"Văn 7 cùng em","sach":"Ngữ văn 7, tập hai — Kết nối tri thức với cuộc sống (NXB Giáo dục Việt Nam)","phamvi":"Học kì II (Bài 6–10)","hk":2,"nguon":"Tên bài, văn bản, tác giả, kiến thức Tri thức ngữ văn, nội dung Thực hành tiếng Việt, yêu cầu và quy trình phần Viết, Nói và nghe: đối chiếu với SGK Ngữ văn 7 tập hai do cô Phương nạp (bản PDF, đọc bằng OCR nên có thể còn sai sót nhỏ). Câu hỏi bám sách chỉ dẫn số trang và trích rất ngắn; em đọc văn bản trong sách. Các đoạn “Luyện” là đoạn trợ lý tự viết, không trích từ SGK. Số trang tính theo bản PDF; nếu lệch, báo để sửa."},"tags":{"tg":"Tác giả – tác phẩm","doc":"Đọc hiểu & thể loại","tv":"Tiếng Việt","viet":"Viết","noi":"Nói và nghe"},"bai":[{"n":1,"so":6,"ten":"Bài học cuộc sống","the":"Truyện ngụ ngôn, tục ngữ","tv":"Thành ngữ; biện pháp tu từ nói quá","viet":"Viết bài văn nghị luận về một vấn đề trong đời sống (trình bày ý kiến tán thành)","noi":"Kể lại một truyện ngụ ngôn","vb":["Đẽo cày giữa đường","Ếch ngồi đáy giếng","Con mối và con kiến","Một số câu tục ngữ Việt Nam","Con hổ có nghĩa"],"vbtr":["tr.6","tr.7","tr.8","tr.12","tr.14"],"trviet":"tr.16"},{"n":2,"so":7,"ten":"Thế giới viễn tưởng","the":"Truyện khoa học viễn tưởng","tv":"Mạch lạc và liên kết; dấu chấm lửng","viet":"Viết bài văn kể lại sự việc có thật liên quan đến một nhân vật lịch sử","noi":"Thảo luận về vai trò của công nghệ đối với đời sống con người","vb":["Cuộc chạm trán trên đại dương","Đường vào trung tâm vũ trụ","Dấu ấn Hồ Khanh","Chiếc đũa thần"],"vbtr":["tr.27","tr.35","tr.42","tr.51 (Thực hành đọc)"],"trviet":"tr.45"},{"n":3,"so":8,"ten":"Trải nghiệm để trưởng thành","the":"Văn bản nghị luận, thơ","tv":"Mạch lạc, liên kết (biện pháp liên kết); thuật ngữ","viet":"Viết bài văn nghị luận về một vấn đề trong đời sống (trình bày ý kiến phản đối)","noi":"Trình bày ý kiến về một vấn đề đời sống","vb":["Bản đồ dẫn đường","Hãy cầm lấy và đọc","Nói với con","Câu chuyện về con đường"],"vbtr":["tr.56","tr.61","tr.65","tr.74 (Thực hành đọc)"],"trviet":"tr.67"},{"n":4,"so":9,"ten":"Hoà điệu với tự nhiên","the":"Văn bản thông tin, tản văn","tv":"Cước chú và tài liệu tham khảo; nghĩa của yếu tố Hán Việt","viet":"Viết bài văn thuyết minh về quy tắc hoặc luật lệ trong trò chơi hay hoạt động","noi":"Giải thích quy tắc hoặc luật lệ trong một trò chơi hay hoạt động","vb":["Thuỷ tiên tháng Một","Lễ rửa làng của người Lô Lô","Bản tin về hoa anh đào","“Thân thiện với môi trường”"],"vbtr":["tr.78","tr.84","tr.87","tr.98 (Thực hành đọc)"],"trviet":"tr.91"},{"n":5,"so":10,"ten":"Trang sách và cuộc sống","the":"Nghị luận phân tích tác phẩm văn học; dự án đọc","tv":"Văn bản đa phương thức; phương tiện phi ngôn ngữ","viet":"Viết bài văn phân tích một nhân vật văn học yêu thích trong cuốn sách đã đọc","noi":"Ngày hội với sách (giới thiệu sản phẩm sáng tạo hoặc trình bày ý kiến về việc đọc sách)","vb":["Vẻ đẹp giản dị và chân thật của Quê nội (Trần Thanh Địch)","Hoàng tử bé: trò chuyện để thấu hiểu và yêu thương (bài viết tham khảo)"],"vbtr":["tr.104","tr.113"],"trviet":"tr.112"}],"doan":[{"id":"s6a","bai":1,"tieude":"Đẽo cày giữa đường (Ngụ ngôn Việt Nam)","sgk":true,"tr":"tr.6–7","s":[],"tho":false},{"id":"s6b","bai":1,"tieude":"Ếch ngồi đáy giếng (Trang Tử)","sgk":true,"tr":"tr.7–8","s":[],"tho":false},{"id":"s6c","bai":1,"tieude":"Con mối và con kiến (Nam Hương)","sgk":true,"tr":"tr.8–9","s":[],"tho":false},{"id":"s6d","bai":1,"tieude":"Một số câu tục ngữ Việt Nam","sgk":true,"tr":"tr.12","s":[],"tho":false},{"id":"s6e","bai":1,"tieude":"Con hổ có nghĩa (Vũ Trinh)","sgk":true,"tr":"tr.14–15","s":[],"tho":false},{"id":"d6","bai":1,"tieude":"Luyện: Cây tre và cây dương liễu","tho":false,"s":["Trong khu vườn nọ, cây dương liễu thường chê cây tre bên cạnh: “Anh cứng đơ, chẳng biết uốn mình theo gió như tôi.”","Cây tre chỉ mỉm cười, không đáp.","Một đêm, cơn bão lớn ập đến, gió quật mạnh đến mức cành dương liễu gãy rạp, ngọn trụi lá.","Cây tre vẫn đứng vững vì bộ rễ bám chặt vào lòng đất.","Sáng hôm sau, dương liễu mới nhận ra rằng dáng đẹp chưa chắc đã vững gốc."]},{"id":"s7a","bai":2,"tieude":"Cuộc chạm trán trên đại dương (trích Hai vạn dặm dưới biển, Giuyn Véc-nơ)","sgk":true,"tr":"tr.27–33","s":[],"tho":false},{"id":"s7b","bai":2,"tieude":"Đường vào trung tâm vũ trụ (trích Thiên Mã, Hà Thuỷ Nguyên)","sgk":true,"tr":"tr.35–40","s":[],"tho":false},{"id":"s7c","bai":2,"tieude":"Dấu ấn Hồ Khanh (Nhật Văn)","sgk":true,"tr":"tr.42–45","s":[],"tho":false},{"id":"d7","bai":2,"tieude":"Luyện: Trạm vũ trụ Hy Vọng","tho":false,"s":["Năm 2150, trạm vũ trụ Hy Vọng lặng lẽ quay quanh sao Hoả.","Phi hành gia Lam bật màn hình, và bản đồ ba chiều của hành tinh đỏ hiện lên trước mắt.","Robot trợ lí Mi-ni báo cáo: “Lượng ô-xi trong khoang số bốn đang giảm.”","Lam nhanh chóng dùng máy phân tích, tìm ra một vết nứt nhỏ trên ống dẫn khí.","Chỉ vài phút sau, cô hàn kín vết nứt bằng tia laser và cả trạm lại yên bình."]},{"id":"s8a","bai":3,"tieude":"Bản đồ dẫn đường (Đa-ni-en Gốt-li-ép)","sgk":true,"tr":"tr.56–58","s":[],"tho":false},{"id":"s8b","bai":3,"tieude":"Hãy cầm lấy và đọc (Huỳnh Như Phương)","sgk":true,"tr":"tr.61–63","s":[],"tho":false},{"id":"s8c","bai":3,"tieude":"Nói với con (Y Phương)","sgk":true,"tr":"tr.65–66","s":[],"tho":false},{"id":"d8","bai":3,"tieude":"Luyện: Có nên chép bài của bạn?","tho":false,"s":["Nhiều bạn cho rằng chép bài của bạn khi chưa làm kịp chỉ là chuyện nhỏ.","Tôi không đồng tình với ý kiến đó.","Trước hết, chép bài khiến ta không hiểu bài, đến lúc kiểm tra sẽ lúng túng.","Chẳng hạn, Lan từng chép bài toán của bạn, nhưng khi cô giáo gọi lên bảng, Lan không giải được.","Hơn nữa, chép bài là thiếu trung thực, làm mất lòng tin của thầy cô và bạn bè.","Vì vậy, mỗi chúng ta nên tự làm bài, chưa hiểu thì hỏi thầy cô."]},{"id":"s9a","bai":4,"tieude":"Thuỷ tiên tháng Một (Thô-mát L. Phrít-man)","sgk":true,"tr":"tr.78–82","s":[],"tho":false},{"id":"s9b","bai":4,"tieude":"Lễ rửa làng của người Lô Lô (Phạm Thuỳ Dung)","sgk":true,"tr":"tr.84–87","s":[],"tho":false},{"id":"s9c","bai":4,"tieude":"Bản tin về hoa anh đào (Nguyễn Vĩnh Nguyên)","sgk":true,"tr":"tr.87–89","s":[],"tho":false},{"id":"d9","bai":4,"tieude":"Luyện: Trò chơi Ném vòng","tho":false,"s":["Ném vòng thường được chơi ở sân trường, mỗi đội gồm từ năm đến sáu bạn.","Dụng cụ gồm một số chiếc vòng bằng nhựa và một hàng cọc đặt cách vạch xuất phát ba mét.","Mỗi bạn được ném ba lần, vòng lọt vào cọc nào thì đội ghi số điểm ghi trên cọc đó.","Bạn nào đứng chạm hoặc vượt vạch khi ném sẽ bị mất lượt.","Kết thúc trò chơi, đội có tổng điểm cao nhất sẽ thắng.","Trò chơi rèn sự khéo léo, tính chính xác và tinh thần đồng đội."]},{"id":"s10a","bai":5,"tieude":"Vẻ đẹp giản dị và chân thật của Quê nội (Võ Quảng) – Trần Thanh Địch","sgk":true,"tr":"tr.104–106","s":[],"tho":false},{"id":"s10b","bai":5,"tieude":"Hoàng tử bé: trò chuyện để thấu hiểu và yêu thương (bài viết tham khảo phần Viết)","sgk":true,"tr":"tr.113–114","s":[],"tho":false},{"id":"d10","bai":5,"tieude":"Luyện: Cô bé Mi và chiếc ô","tho":false,"s":["Nhân vật Mi trong truyện “Chiếc ô màu xanh” là một cô bé giàu lòng nhân ái.","Điều đó thể hiện qua hành động Mi nhường chiếc ô duy nhất cho cụ già bán rau giữa trời mưa.","Lời nói của em cũng rất chân thành: “Cụ cầm lấy đi ạ, cháu chạy về được mà.”","Nhà văn khắc hoạ Mi chủ yếu bằng những hành động nhỏ và lời thoại giản dị, gần gũi.","Nhờ vậy, hình ảnh cô bé hiện lên chân thực, khiến người đọc thêm tin yêu lòng tốt trong cuộc sống."]}],"cau":[{"id":"6a","bai":1,"tag":"tg","type":"match","q":"Ghép văn bản với tác giả hoặc nguồn.","pairs":[["Đẽo cày giữa đường","Ngụ ngôn Việt Nam"],["Ếch ngồi đáy giếng","Trang Tử"],["Con mối và con kiến","Nam Hương"],["Con hổ có nghĩa","Vũ Trinh"]],"why":"Đây là các văn bản đọc của Bài 6 – Bài học cuộc sống (SGK tập hai, tr.6–14)."},{"id":"6b","bai":1,"tag":"tg","type":"mc","q":"Văn bản “Con hổ có nghĩa” là một truyện trong tác phẩm nào?","opts":["Lan Trì kiến văn lục","Truyền kì mạn lục","Vũ trung tùy bút","Thánh Tông di thảo"],"a":0,"why":"Theo chú thích SGK (tr.14), Con hổ có nghĩa là truyện thứ 8 trong 45 truyện ngắn chữ Hán của Lan Trì kiến văn lục (Vũ Trinh).","wrong":[null,"Truyền kì mạn lục là tác phẩm của Nguyễn Dữ, không phải của Vũ Trinh.","Vũ trung tùy bút là của Phạm Đình Hổ.","Đây là tên một tập truyện khác, không phải nguồn của văn bản này."]},{"id":"6c","bai":1,"tag":"tg","type":"mc","q":"Trang Tử, tác giả truyện “Ếch ngồi đáy giếng”, là ai?","opts":["Một triết gia nổi tiếng của Trung Quốc","Một nhà thơ Việt Nam thời trung đại","Một vị vua trong truyền thuyết","Một nhà báo hiện đại"],"a":0,"why":"SGK (tr.7) giới thiệu Trang Tử (khoảng 389 – 286 trước Công nguyên) là triết gia nổi tiếng của Trung Quốc; truyện trích trong thiên Thu thuỷ của sách Trang Tử.","wrong":[null,"Trang Tử là người Trung Quốc, không phải người Việt Nam.","Vua Vũ, vua Thang chỉ được nhắc đến trong truyện.","Trang Tử sống từ thời cổ đại."]},{"id":"6d","bai":1,"tag":"tg","type":"mc","q":"Truyện “Ếch ngồi đáy giếng” được trích trong thiên nào của sách Trang Tử?","opts":["Thu thuỷ","Tiêu dao du","Tề vật luận","Xuân thu"],"a":0,"why":"Theo chú thích SGK (tr.7): truyện trích trong thiên Thu thuỷ (thiên thứ 17) của sách Trang Tử.","wrong":[null,"Tiêu dao du là một thiên khác của sách Trang Tử.","Tề vật luận là một thiên khác của sách Trang Tử.","Đây không phải tên thiên được SGK nhắc tới."]},{"id":"6e","bai":1,"tag":"tg","type":"mc","q":"Nam Hương, tác giả “Con mối và con kiến”, được biết đến nhiều với loại sáng tác nào?","opts":["Thơ ngụ ngôn","Tiểu thuyết lịch sử","Kịch nói","Phóng sự điều tra"],"a":0,"why":"Theo chú thích SGK (tr.8): Nam Hương (1899 – 1960) sáng tác nhiều thơ ngụ ngôn.","wrong":[null,"Chú thích SGK không nhắc tới tiểu thuyết lịch sử.","Chú thích SGK không nhắc tới kịch nói.","Chú thích SGK không nhắc tới phóng sự."]},{"id":"6f","bai":1,"tag":"tg","type":"mc","q":"Theo Tri thức ngữ văn, truyện ngụ ngôn là gì?","opts":["Hình thức tự sự cỡ nhỏ, nêu bài học đạo lí và kinh nghiệm sống, thường dùng lối nói ám chỉ, ngụ ý","Truyện dài kể về lịch sử dựng nước","Loại văn bản thông tin giới thiệu một sự vật","Bài thơ trữ tình bày tỏ nỗi nhớ"],"a":0,"why":"SGK (tr.5): truyện ngụ ngôn là hình thức tự sự cỡ nhỏ, trình bày bài học đạo lí và kinh nghiệm sống, thường dùng lối diễn đạt ám chỉ, ngụ ý, bóng gió.","wrong":[null,"Truyện ngụ ngôn ngắn gọn, không phải truyện dài lịch sử.","Ngụ ngôn là văn bản tự sự, không phải văn bản thông tin.","Ngụ ngôn không phải thơ trữ tình."]},{"id":"6g","bai":1,"tag":"tg","type":"mc","q":"Điểm nào KHÔNG đúng với nhân vật trong truyện ngụ ngôn?","opts":["Luôn là con người có thật ngoài đời","Có thể là con người","Có thể là con vật hay đồ vật được nhân hoá","Mang đặc điểm giống con người"],"a":0,"why":"SGK (tr.5): nhân vật ngụ ngôn có thể là con người, con vật, đồ vật được nhân hoá (có đặc điểm như con người).","wrong":[null,"Đúng với nhân vật ngụ ngôn.","Đúng với nhân vật ngụ ngôn.","Đúng với nhân vật ngụ ngôn."]},{"id":"6h","bai":1,"tag":"tg","type":"mc","q":"Tục ngữ là gì?","opts":["Sáng tác ngôn từ dân gian: câu nói ngắn gọn, nhịp nhàng, cân đối, thường có vần, đúc kết kinh nghiệm","Cụm từ cố định nhưng không đúc kết kinh nghiệm","Bài thơ dài kể chuyện dân gian","Câu chuyện có nhiều nhân vật và cốt truyện phức tạp"],"a":0,"why":"SGK (tr.5): tục ngữ là những câu nói ngắn gọn, nhịp nhàng, cân đối, thường có vần điệu, đúc kết nhận thức về tự nhiên, xã hội và kinh nghiệm đạo đức, ứng xử.","wrong":[null,"Đó là mô tả thành ngữ.","Tục ngữ ngắn gọn, không phải bài thơ dài.","Tục ngữ không phải truyện có cốt truyện."]},{"id":"6i","bai":1,"tag":"tg","type":"match","q":"Ghép câu tục ngữ với chủ đề phù hợp.","pairs":[["Gió heo may, chuồn chuồn bay thì bão.","Dự báo thời tiết, thiên nhiên"],["Làm ruộng ba năm không bằng chăn tằm một lứa.","Lao động sản xuất"],["Đói cho sạch, rách cho thơm.","Đạo đức, cách ứng xử"],["Không thầy đố mày làm nên.","Học tập, quan hệ thầy trò"]],"why":"Các câu tục ngữ trong bài (SGK tr.12) thuộc nhiều chủ đề: thiên nhiên, lao động sản xuất, con người và xã hội."},{"id":"6j","bai":1,"tag":"tv","type":"mc","q":"Thành ngữ là gì?","opts":["Loại cụm từ cố định, có nghĩa bóng bẩy","Câu nói đúc kết kinh nghiệm và có vần điệu","Bài thơ ngụ ngôn","Từ chỉ khái niệm của một ngành khoa học"],"a":0,"why":"SGK (tr.5): thành ngữ là loại cụm từ cố định, có nghĩa bóng bẩy; nghĩa toát ra từ cả cụm chứ không suy ra từ nghĩa từng thành tố.","wrong":[null,"Đó là mô tả tục ngữ.","Thành ngữ là cụm từ, không phải bài thơ.","Đó là mô tả thuật ngữ."]},{"id":"6k","bai":1,"tag":"tv","type":"sort","q":"Phân loại: thành ngữ hay tục ngữ?","bins":["Thành ngữ (cụm từ cố định)","Tục ngữ (câu đúc kết kinh nghiệm)"],"items":[["Đẽo cày giữa đường",0],["Chia ngọt sẻ bùi",0],["Mở cờ trong bụng",0],["Ăn quả nhớ kẻ trồng cây",1],["Đói cho sạch, rách cho thơm",1],["Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi cao",1]],"why":"Thành ngữ là cụm từ cố định, bóng bẩy; tục ngữ là câu diễn đạt trọn ý, đúc kết kinh nghiệm."},{"id":"6l","bai":1,"tag":"tv","type":"match","q":"Ghép thành ngữ với nghĩa của nó.","pairs":[["của ngon vật lạ","Thức ăn ngon, quý hiếm"],["chưa biết mèo nào cắn mỉu nào","Chưa biết ai thắng ai thua"],["đi đời nhà ma","Mất hết, tiêu tan"],["chia ngọt sẻ bùi","Cùng sẻ chia sướng khổ"]],"why":"Hai nghĩa đầu lấy từ SGK (tr.11); “đi đời nhà ma” có chú thích ở tr.7 là “mất, mất hết”."},{"id":"6m","bai":1,"tag":"tv","type":"mc","q":"Việc dùng thành ngữ có tác dụng gì trong câu?","opts":["Làm câu súc tích, bóng bẩy, gợi nhiều liên tưởng","Làm câu dài và rườm rà hơn","Làm câu mất nghĩa","Chỉ để trang trí, không có tác dụng"],"a":0,"why":"SGK (tr.11): việc dùng thành ngữ giúp câu trở nên súc tích, bóng bẩy, gợi nhiều liên tưởng.","wrong":[null,"Thành ngữ giúp câu ngắn gọn, súc tích.","Thành ngữ làm câu thêm nghĩa chứ không làm mất nghĩa.","Thành ngữ có tác dụng biểu đạt rõ rệt."]},{"id":"6n","bai":1,"tag":"tv","type":"mc","q":"Nói quá là biện pháp tu từ như thế nào?","opts":["Phóng đại tính chất, quy mô của đối tượng để nhấn mạnh, tăng sức biểu cảm hoặc gây cười","Nói giảm mức độ của sự vật","Gọi sự vật bằng tên của sự vật khác có quan hệ gần gũi","Lặp lại một từ ngữ nhiều lần"],"a":0,"why":"SGK (tr.5): nói quá là biện pháp tu từ phóng đại tính chất, quy mô của đối tượng để nhấn mạnh, tăng sức biểu cảm hoặc gây cười.","wrong":[null,"Nói giảm nói tránh làm nhẹ mức độ, khác với nói quá.","Đó là hoán dụ.","Đó là điệp ngữ."]},{"id":"6o","bai":1,"tag":"tv","type":"mc","q":"Câu nào dưới đây có dùng biện pháp nói quá?","opts":["Ngày vui ngắn chẳng tày gang.","Ăn quả nhớ kẻ trồng cây.","Học thầy chẳng tày học bạn.","Người sống hơn đồng vàng."],"a":0,"why":"“Ngày vui ngắn chẳng tày gang” phóng đại độ ngắn của ngày vui (SGK tr.13).","wrong":[null,"Câu này nói nghĩa đen về lòng biết ơn.","Câu này so sánh giá trị của việc học.","Câu này so sánh giá trị người với tiền của, chưa phóng đại như nói quá."]},{"id":"6p","bai":1,"tag":"tv","type":"mc","q":"Trong câu “Thuận vợ thuận chồng tát bể Đông cũng cạn”, nói quá có tác dụng gì?","opts":["Nhấn mạnh sức mạnh to lớn của sự đồng lòng","Chê bai việc tát nước","Tả cảnh biển cạn","Nói về nghề đánh cá"],"a":0,"why":"Tát cạn biển Đông là việc không thể xảy ra; nói quá để đề cao sức mạnh của sự đồng lòng, thuận hoà (SGK tr.13).","wrong":[null,"Câu không chê bai ai.","Câu không tả cảnh thật.","Câu không nói về nghề nghiệp."]},{"id":"6q","bai":1,"tag":"doc","type":"mc","q":"Trong “Đẽo cày giữa đường”, người thợ mộc xử sự thế nào trước mỗi lời khuyên của người qua đường?","opts":["Cho là phải và làm theo ngay","Bỏ ngoài tai tất cả","Cãi lại từng người","Hỏi ý kiến thợ mộc khác rồi mới làm"],"a":0,"why":"SGK (tr.6): anh ta nghe ai nói cũng “cho là phải” rồi đẽo cày to, nhỏ, rồi to gấp năm gấp bảy thứ thường, nên cuối cùng không bán được cái nào.","wrong":[null,"Anh ta nghe theo, không bỏ ngoài tai.","Anh ta không cãi lại ai.","Truyện không nói anh ta hỏi thợ khác."],"pid":"s6a","muc":"biet"},{"id":"6r","bai":1,"tag":"doc","type":"mc","q":"Thành ngữ “đẽo cày giữa đường” dùng để nói về những người như thế nào?","opts":["Hay nghe theo thiên hạ, làm theo người khác đến mất cả cơ nghiệp","Làm việc rất chăm chỉ","Rất cẩn thận khi chọn gỗ","Giỏi nghề mộc"],"a":0,"why":"Cuối truyện (tr.7) có lời giải thích: thành ngữ dùng để nói những người hay để tai nghe theo thiên hạ đến nỗi mất cả cơ nghiệp.","wrong":[null,"Thành ngữ không nói về sự chăm chỉ.","Truyện không nhấn mạnh việc chọn gỗ.","Người thợ mộc trong truyện thiếu chủ kiến, không phải giỏi nghề."],"pid":"s6a","muc":"hieu"},{"id":"6s","bai":1,"tag":"doc","type":"mc","q":"Điều gì khiến con ếch trong “Ếch ngồi đáy giếng” cảm thấy sung sướng?","opts":["Một mình chiếm cả giếng nước, tự do bơi lội, thấy không con vật nào sướng bằng mình","Được sống cùng đàn ếch đông đúc","Được ra biển lớn bơi lội","Được rùa kể chuyện hay"],"a":0,"why":"SGK (tr.7): ếch khoe mình có thể nhảy ra nhảy vào, bơi trong nước, lội bùn, “một mình chiếm một chỗ nước tụ, tự do bơi lội” nên thấy không con nào sướng bằng.","wrong":[null,"Ếch sống một mình trong giếng.","Ếch chưa từng ra biển.","Chính rùa mới là người kể chuyện về biển."],"pid":"s6b","muc":"biet"},{"id":"6t","bai":1,"tag":"doc","type":"mc","q":"Vì sao con ếch “ngạc nhiên, thu mình lại, hoảng hốt, bối rối”?","opts":["Vì nghe rùa tả biển Đông mênh mông, rộng lớn hơn cái giếng của mình rất nhiều","Vì rùa doạ sẽ ăn thịt ếch","Vì giếng bị cạn nước","Vì thấy nhiều ếch khác vào giếng"],"a":0,"why":"Rùa kể biển Đông mênh mông, không đổi thay dù lụt hay hạn (tr.8); ếch bàng hoàng nhận ra thế giới của mình quá nhỏ bé.","wrong":[null,"Rùa không hề doạ ếch.","Giếng cạn không phải lí do trong truyện.","Truyện không có chi tiết này."],"pid":"s6b","muc":"hieu"},{"id":"6u","bai":1,"tag":"doc","type":"mc","q":"Trong “Con mối và con kiến”, kiến phê phán lối sống nào của mối?","opts":["Không lao động mà chỉ đục phá chỗ ở của người khác để ăn","Làm việc quá chăm chỉ","Quá hào phóng với bạn bè","Ham học hỏi"],"a":0,"why":"Kiến nói “Hễ có làm thì mới có ăn”, trách mối cứ “đục vào chỗ ở mà xơi”, đục rỗng nhà thì nhà đổ cũng hại chính mối (tr.9).","wrong":[null,"Kiến mới là con vật chăm chỉ.","Truyện không nói mối hào phóng.","Truyện không nhắc tới việc học."],"pid":"s6c","muc":"hieu"},{"id":"6v","bai":1,"tag":"doc","type":"mc","q":"Chi tiết nào cho thấy hổ biết tri ân bà đỡ Trần?","opts":["Hổ đực đưa ra một khối bạc tặng bà và cùng bà ra khỏi rừng","Hổ cắn bà đỡ","Hổ bỏ chạy ngay sau khi hổ cái sinh con","Hổ đuổi bà ra khỏi rừng"],"a":0,"why":"SGK (tr.14–15): sau khi hổ cái sinh con, hổ đực quỳ trước bà, đưa ra một khối bạc; khi tiễn bà, hổ dừng lại quỳ, cúi đầu, vẫy đuôi tỏ ý tiễn biệt.","wrong":[null,"Hổ không làm hại bà.","Hổ không bỏ chạy.","Hổ tiễn bà ra khỏi rừng."],"pid":"s6e","muc":"biet"},{"id":"6w","bai":1,"tag":"doc","type":"mc","q":"Việc ghép hai câu chuyện (bà đỡ Trần và bác tiều phu) trong “Con hổ có nghĩa” giúp ích gì?","opts":["Cho thấy việc hổ biết ơn có ở nhiều trường hợp, làm bài học về nghĩa tình thêm sâu sắc","Làm truyện dài hơn thôi","Để so sánh hai nghề nghiệp","Để nói rằng hổ rất hung dữ"],"a":0,"why":"Cả hai chuyện đều kể hổ đền đáp người cứu giúp: một lần tặng bạc, một lần để hươu, lợn trước cửa mỗi dịp giỗ suốt nhiều năm (tr.15). Hai chuyện bổ sung nhau để nhấn mạnh bài học nghĩa tình.","wrong":[null,"Mục đích không phải để kéo dài truyện.","Truyện không so sánh nghề nghiệp.","Truyện ca ngợi nghĩa tình của hổ."],"pid":"s6e","muc":"vd"},{"id":"6x","bai":1,"tag":"doc","type":"short","q":"Mượn hình tượng con hổ có nghĩa, tác phẩm gửi gắm bài học gì cho con người? (1–2 câu)","goi":"Gợi ý: Con người cần sống … Vì …","mau":"Con người cần sống có nghĩa tình, biết ơn người đã giúp mình. Ngay cả loài hổ dữ còn biết đền đáp ơn cứu giúp, huống chi con người.","y":["Nêu được bài học: biết ơn, sống có nghĩa tình","Liên hệ chi tiết hổ tặng bạc hoặc mang hươu, lợn đến","Câu văn rõ ràng, đủ ý"],"pid":"s6e","muc":"vd"},{"id":"6y","bai":1,"tag":"doc","type":"mc","q":"Câu tục ngữ “Muốn lành nghề, chớ nề học hỏi” khuyên điều gì?","opts":["Muốn giỏi nghề thì đừng ngại học hỏi người khác","Chỉ nên học thầy","Không cần học nghề","Nên học một mình, không nhờ ai"],"a":0,"why":"Câu tục ngữ số 13 (tr.12): “nề” là ngại; muốn giỏi nghề thì không ngại học hỏi.","wrong":[null,"Câu khuyên học hỏi nhiều người.","Câu không bảo bỏ việc học.","Câu khuyên học hỏi chứ không học một mình."],"pid":"s6d","muc":"hieu"},{"id":"6z1","bai":1,"tag":"doc","type":"mc","q":"Trong đoạn “Cây tre và cây dương liễu”, nhân vật là ai?","opts":["Hai loài cây được nhân hoá","Hai bạn học sinh","Hai người nông dân","Hai con vật sống trong rừng"],"a":0,"why":"Cây tre và cây dương liễu biết nói, biết nhận ra điều đúng: đó là nhân vật ngụ ngôn (cây cối được nhân hoá).","wrong":[null,"Không có học sinh trong đoạn.","Không có người nông dân.","Không có con vật nào."],"pid":"d6","muc":"biet"},{"id":"6z2","bai":1,"tag":"doc","type":"evid","pid":"d6","muc":"hieu","q":"Gạch chân (chạm vào) những câu cho thấy KẾT QUẢ của trận bão với hai loài cây.","ans":[2,3],"why":"Câu 3: dương liễu gãy rạp, trụi lá. Câu 4: tre vẫn đứng vững nhờ rễ bám chặt vào đất."},{"id":"6z3","bai":1,"tag":"doc","type":"mc","q":"Bài học rút ra từ đoạn truyện là gì?","opts":["Vẻ ngoài đẹp, mềm mại chưa chắc đã vững vàng; cần có nền tảng chắc chắn","Cây nào cũng nên uốn theo gió","Đừng bao giờ chê người khác","Bão luôn có hại cho cây"],"a":0,"why":"Dương liễu chê tre cứng nhưng bão đến thì tre mới đứng vững nhờ rễ sâu. Bài học: cần nền tảng vững chắc, đừng chỉ chú ý vẻ ngoài.","wrong":[null,"Đoạn truyện không khuyên uốn theo gió.","Đây chỉ là một phần nhỏ của bài học.","Đoạn truyện không bàn về tác hại của bão."],"pid":"d6","muc":"hieu"},{"id":"6z4","bai":1,"tag":"doc","type":"short","q":"Em hãy liên hệ: bài học của truyện áp dụng vào việc học của em như thế nào? (1–2 câu)","goi":"Gợi ý: Trong học tập, em cần … vì …","mau":"Trong học tập, em cần chăm chỉ học chắc kiến thức nền như rễ cây, chứ không chỉ cố làm bài cho đẹp mắt. Có nền tảng vững thì khi gặp bài khó em mới không bị “gãy”.","y":["Liên hệ đúng với bài học của truyện","Có ví dụ cụ thể từ việc học","Câu văn rõ ràng, đủ ý"],"pid":"d6","muc":"vd"},{"id":"6v1","bai":1,"tag":"viet","type":"order","q":"Sắp xếp các bước làm bài văn nghị luận (ý kiến tán thành) theo đúng thứ tự.","items":["Chọn vấn đề, ý kiến đáng quan tâm để bàn luận","Tìm ý: vì sao tán thành, lí lẽ và bằng chứng nào","Lập dàn ý Mở bài – Thân bài – Kết bài","Viết bài theo dàn ý","Đọc lại, chỉnh sửa theo bảng tiêu chí"],"why":"SGK (tr.18–21): Trước khi viết (chọn đề tài, tìm ý, lập dàn ý) → Viết bài → Chỉnh sửa bài viết."},{"id":"6v2","bai":1,"tag":"viet","type":"mc","q":"Yêu cầu nào KHÔNG thuộc bài văn nghị luận trình bày ý kiến tán thành?","opts":["Kể lại một câu chuyện dài, không nêu ý kiến","Nêu được vấn đề và ý kiến cần bàn luận","Trình bày rõ sự tán thành","Đưa ra lí lẽ rõ ràng và bằng chứng đa dạng"],"a":0,"why":"SGK (tr.16): bài viết cần nêu vấn đề và ý kiến, trình bày sự tán thành, đưa lí lẽ rõ ràng và bằng chứng đa dạng.","wrong":[null,"Đây là yêu cầu đúng.","Đây là yêu cầu đúng.","Đây là yêu cầu đúng."]},{"id":"6v3","bai":1,"tag":"viet","type":"mc","q":"Trong bài viết tham khảo “Trường học đầu tiên”, người viết tán thành ý kiến nào?","opts":["“Gia đình cũng là một trường học.”","“Nhà trường là nơi duy nhất để học.”","“Chỉ cần học bạn, không cần học thầy.”","“Trò chơi điện tử rất bổ ích.”"],"a":0,"why":"Người viết tán thành ý kiến của bạn Hồng Minh: gia đình cũng là một trường học (SGK tr.16–19).","wrong":[null,"Bài viết không nói vậy.","Đây là chủ đề khác trong gợi ý đề tài.","Đây là chủ đề khác trong gợi ý đề tài."]},{"id":"6v4","bai":1,"tag":"viet","type":"sort","q":"Đây là LÍ LẼ hay BẰNG CHỨNG? (đề tài: Đọc sách có ích)","bins":["Lí lẽ","Bằng chứng"],"items":[["Sách giúp con người mở rộng hiểu biết và nuôi dưỡng tâm hồn",0],["Bạn Nam đọc truyện về loài vật nên kể được nhiều điều thú vị cho cả lớp nghe",1],["Đọc sách là cách học không lệ thuộc vào thời gian, nơi chốn",0],["Em đọc cuốn sách về lịch sử và nhớ được các mốc thời gian dễ hơn",1]],"why":"Lí lẽ là ý nêu lên để giải thích, bằng chứng là ví dụ cụ thể, xác thực làm rõ lí lẽ."},{"id":"6v5","bai":1,"tag":"viet","type":"mc","q":"Phần Kết bài của bài văn nghị luận tán thành cần làm gì?","opts":["Khẳng định lại tính xác đáng của ý kiến và nêu sự cần thiết của việc tán thành","Kể thêm một câu chuyện mới","Nêu một ý kiến hoàn toàn khác","Chỉ ghi “Hết”"],"a":0,"why":"SGK (tr.20): Kết bài khẳng định lại sự tán thành, nêu tác dụng của ý kiến đó đối với cuộc sống, viết trọn vẹn trong một đoạn.","wrong":[null,"Kết bài không đưa thêm chuyện mới.","Không nên nêu ý khác lạc đề.","Kết bài cần có nội dung."]},{"id":"6v6","bai":1,"tag":"viet","type":"short","q":"Viết 2 câu Mở bài nêu vấn đề và ý kiến tán thành với câu “Học thầy chẳng tày học bạn”.","goi":"Gợi ý: Câu 1 giới thiệu vấn đề (nhắc tới câu tục ngữ). Câu 2 nêu rõ em tán thành vì sao.","mau":"Trong cuộc sống, ông cha ta để lại câu tục ngữ “Học thầy chẳng tày học bạn”. Em hoàn toàn tán thành ý kiến này vì ngoài việc học từ thầy cô, ta còn học được rất nhiều điều bổ ích từ bạn bè.","y":["Nhắc đúng vấn đề, ý kiến","Nói rõ thái độ tán thành","Hai câu rõ ràng, đúng chính tả"]},{"id":"6n1","bai":1,"tag":"noi","type":"mc","q":"Khi kể lại một truyện ngụ ngôn, em cần chú ý điều gì?","opts":["Kể đúng cốt truyện gốc, có thể kể sinh động nhưng không làm sai lệch yếu tố cơ bản","Thay đổi hoàn toàn nội dung truyện","Đọc thuộc lòng từng chữ","Bỏ qua bài học"],"a":0,"why":"SGK (tr.21–22): được sáng tạo cách kể nhưng không làm sai lệch yếu tố cơ bản của cốt truyện gốc; không phải đọc thuộc lòng.","wrong":[null,"Làm vậy sẽ sai cốt truyện gốc.","Không cần đọc thuộc từng chữ.","Phần kết nên nêu ý nghĩa, bài học."]},{"id":"6n2","bai":1,"tag":"noi","type":"mc","q":"Phần kết luận của bài nói kể truyện ngụ ngôn cần có gì?","opts":["Nêu ý nghĩa của câu chuyện","Xin lỗi vì kể dài","Kể lại từ đầu","Hỏi bạn có ai đang buồn ngủ không"],"a":0,"why":"SGK (tr.22): Kết luận – nêu ý nghĩa của câu chuyện.","wrong":[null,"Không cần xin lỗi.","Không cần kể lại.","Không phù hợp với mục đích kể."]},{"id":"7a","bai":2,"tag":"tg","type":"match","q":"Ghép văn bản với tác giả.","pairs":[["Cuộc chạm trán trên đại dương","Giuyn Véc-nơ"],["Đường vào trung tâm vũ trụ","Hà Thuỷ Nguyên"],["Dấu ấn Hồ Khanh","Nhật Văn"],["Chiếc đũa thần (Thực hành đọc)","I. A. E-phơ-rê-mốp"]],"why":"Đây là các văn bản của Bài 7 – Thế giới viễn tưởng (SGK tập hai, tr.27, 35, 42, 51)."},{"id":"7b","bai":2,"tag":"tg","type":"mc","q":"“Cuộc chạm trán trên đại dương” trích từ tác phẩm nào?","opts":["Hai vạn dặm dưới biển","Thiên Mã","Đất rừng phương Nam","Tốt-tô-chan bên cửa sổ"],"a":0,"why":"Theo chú thích SGK (tr.27): Hai vạn dặm dưới biển là tiểu thuyết khoa học viễn tưởng của Giuyn Véc-nơ gồm 47 chương.","wrong":[null,"Thiên Mã là tác phẩm của Hà Thuỷ Nguyên (văn bản thứ hai).","Đất rừng phương Nam học ở Bài 1 (tập một).","Tốt-tô-chan bên cửa sổ học ở Bài 1 (tập một)."]},{"id":"7c","bai":2,"tag":"tg","type":"mc","q":"“Thiên Mã”, tác phẩm có đoạn trích “Đường vào trung tâm vũ trụ”, thuộc thể loại nào?","opts":["Tiểu thuyết khoa học viễn tưởng","Truyện ngụ ngôn","Thơ năm chữ","Văn bản nghị luận"],"a":0,"why":"Theo chú thích SGK (tr.35): Thiên Mã là cuốn tiểu thuyết khoa học viễn tưởng gồm 10 chương.","wrong":[null,"Thiên Mã không phải ngụ ngôn.","Thiên Mã không phải thơ.","Thiên Mã là truyện, không phải văn bản nghị luận."]},{"id":"7d","bai":2,"tag":"tg","type":"mc","q":"Hồ Khanh trong văn bản “Dấu ấn Hồ Khanh” là người phát hiện ra hang động nổi tiếng nào?","opts":["Hang Sơn Đoòng","Hang Én","Hang Va","Động Phong Nha"],"a":0,"why":"Đoạn đầu văn bản (tr.42): Hồ Khanh là người phát hiện ra hang Sơn Đoòng và rất nhiều hang động ấn tượng khác ở Quảng Bình.","wrong":[null,"Văn bản nêu Sơn Đoòng chứ không phải hang Én.","Văn bản nêu Sơn Đoòng chứ không phải hang Va.","Văn bản nêu Sơn Đoòng, thuộc Vườn quốc gia Phong Nha – Kẻ Bàng."]},{"id":"7e","bai":2,"tag":"tg","type":"mc","q":"Theo Tri thức ngữ văn, truyện khoa học viễn tưởng là loại tác phẩm như thế nào?","opts":["Viết về thế giới tương lai dựa trên sự phát triển của khoa học, thường li kì","Kể chuyện loài vật để nêu bài học đạo lí","Ghi chép sự việc đã xảy ra theo trình tự thời gian","Giới thiệu luật chơi của một trò chơi"],"a":0,"why":"SGK (tr.26): truyện khoa học viễn tưởng viết về thế giới tương lai dựa trên sự phát triển của khoa học dự đoán, thường có tính chất li kì.","wrong":[null,"Đó là truyện ngụ ngôn.","Đó là tường thuật, không phải khoa học viễn tưởng.","Đó là văn bản thông tin."]},{"id":"7f","bai":2,"tag":"tg","type":"sort","q":"Xếp mỗi đặc điểm của truyện khoa học viễn tưởng vào đúng yếu tố.","bins":["Đề tài","Không gian","Thời gian","Nhân vật"],"items":[["Thám hiểm vũ trụ, du hành xuyên thời gian",0],["Trên Trái Đất hoặc các hành tinh, thiên hà xa xôi",1],["Thường là tương lai xa so với lúc tác phẩm ra đời",2],["Có trí thông minh kiệt xuất hoặc khả năng kì lạ",3]],"why":"SGK (tr.26) nêu bốn yếu tố của truyện khoa học viễn tưởng: đề tài, không gian, thời gian và nhân vật chính."},{"id":"7g","bai":2,"tag":"tg","type":"mc","q":"Cốt truyện trong truyện khoa học viễn tưởng thường gồm gì?","opts":["Chuỗi tình huống, sự kiện tưởng tượng dựa trên giả thuyết, dự báo, quan niệm khoa học","Chỉ những sự việc có thật đã xảy ra","Chỉ lời kể về một ngày đi học","Một câu tục ngữ"],"a":0,"why":"SGK (tr.26): cốt truyện gồm một chuỗi tình huống, sự kiện hoàn toàn tưởng tượng, dựa trên các giả thuyết, dự báo và quan niệm khoa học.","wrong":[null,"Truyện viễn tưởng dựa trên tưởng tượng khoa học, không chỉ gồm sự việc có thật.","Đây không phải nội dung của truyện viễn tưởng.","Tục ngữ không phải cốt truyện."]},{"id":"7h","bai":2,"tag":"doc","type":"mc","q":"Trong “Cuộc chạm trán trên đại dương”, ai là người kể chuyện (xưng “tôi”)?","opts":["Giáo sư Pi-e A-rôn-nác, một nhà khoa học","Nét Len, người săn cá voi","Thuyền trưởng Nê-mô","Công-xây"],"a":0,"why":"Theo chú thích SGK (tr.27), giáo sư Pi-e A-rôn-nác kể lại chuyến phiêu lưu; nhà văn để một nhà khoa học vào vai người kể chuyện ngôi thứ nhất.","wrong":[null,"Nét Len là nhân vật khác, mài sắc mũi lao chuẩn bị chiến đấu.","Nê-mô là thuyền trưởng tàu ngầm, không phải người kể.","Công-xây là cộng sự của giáo sư."],"pid":"s7a","muc":"biet"},{"id":"7i","bai":2,"tag":"doc","type":"mc","q":"Giuyn Véc-nơ có “dự đoán thiên tài” gì về kĩ thuật trong “Hai vạn dặm dưới biển”?","opts":["Con tàu ngầm được thắp sáng và điều khiển bằng điện","Con tàu ngầm chạy bằng sức người chèo","Con tàu ngầm bay lên trời","Con tàu ngầm chạy bằng buồm"],"a":0,"why":"Chú thích SGK (tr.27): nhà văn dự đoán con tàu ngầm Nau-ti-luýt được thắp sáng và điều khiển bằng điện, với tính năng mà kĩ thuật thời đó chưa đạt được.","wrong":[null,"Tàu ngầm trong truyện chạy bằng điện.","Tàu ngầm đi dưới biển, không bay.","Tàu ngầm không chạy bằng buồm."],"pid":"s7a","muc":"hieu"},{"id":"7j","bai":2,"tag":"doc","type":"mc","q":"Việc nhà văn để một nhà khoa học kể chuyện ở ngôi thứ nhất có tác dụng gì?","opts":["Làm câu chuyện đáng tin hơn, các phán đoán mang tính khoa học, lô-gíc","Làm truyện bớt hấp dẫn","Để nhân vật nói nhiều hơn về mình","Để bỏ qua các chi tiết khoa học"],"a":0,"why":"Người kể là nhà khoa học nên lời kể nghiêm túc, giàu phán đoán lô-gíc, tạo độ tin cậy cho điều tưởng tượng (gợi ý theo câu hỏi 5–6, tr.33).","wrong":[null,"Truyện hấp dẫn nhờ cách kể này.","Ngôi thứ nhất không nhằm để nói nhiều về bản thân.","Chi tiết khoa học là phần quan trọng."],"pid":"s7a","muc":"vd"},{"id":"7k","bai":2,"tag":"doc","type":"mc","q":"Trong “Đường vào trung tâm vũ trụ”, những nhân vật nào cùng đi trên con ngựa có cánh?","opts":["Nhân vật “tôi” (một cô bé), Thần Đồng và ngựa Thần Thoại","Hoàng tử bé và con cáo","Pi-e A-rôn-nác và Nét Len","Thuỷ Tinh và Sơn Tinh"],"a":0,"why":"SGK (tr.35–36): nhân vật “tôi”, cậu bé Thần Đồng và con ngựa có cánh Thần Thoại.","wrong":[null,"Hoàng tử bé thuộc truyện khác (Bài 10).","Đó là nhân vật của Hai vạn dặm dưới biển.","Đó là nhân vật truyền thuyết."],"pid":"s7b","muc":"biet"},{"id":"7l","bai":2,"tag":"doc","type":"mc","q":"Trong đoạn trích “Đường vào trung tâm vũ trụ”, các nhân vật đã gặp sinh vật kì lạ nào?","opts":["Người cá","Rồng lửa","Người khổng lồ","Chim phượng hoàng"],"a":0,"why":"Văn bản kể họ gặp người cá có khuôn mặt loài người và đuôi cá, giống miêu tả của An-đéc-xen trong truyện cổ (tr.40).","wrong":[null,"Văn bản không nhắc tới rồng lửa.","Văn bản không nhắc tới người khổng lồ.","Văn bản không nhắc tới chim phượng hoàng."],"pid":"s7b","muc":"biet"},{"id":"7m","bai":2,"tag":"doc","type":"mc","q":"Vì sao các văn bản “Cuộc chạm trán trên đại dương” và “Đường vào trung tâm vũ trụ” được coi là truyện khoa học viễn tưởng?","opts":["Kể về chuyến phiêu lưu tưởng tượng dựa trên các ý tưởng, giả thuyết khoa học","Vì có nhiều nhân vật con vật","Vì kể chuyện đời thường ở làng quê","Vì viết bằng thơ"],"a":0,"why":"Cả hai kể về những cuộc phiêu lưu tưởng tượng (dưới đáy biển, vào Tâm Trái Đất, Tâm Vũ Trụ) dựa trên ý tưởng, giả thuyết khoa học (SGK tr.50, Củng cố mở rộng).","wrong":[null,"Nhân vật con vật là đặc điểm ngụ ngôn.","Truyện không kể chuyện đời thường ở làng quê.","Hai văn bản là văn xuôi."],"pid":"s7b","muc":"vd"},{"id":"7n","bai":2,"tag":"doc","type":"mc","q":"Năm 2009, Hồ Khanh đã làm gì để hang Sơn Đoòng được biết đến?","opts":["Dẫn đoàn thám hiểm hang động của Hoàng gia Anh đến khám phá hang","Chụp ảnh quảng cáo","Xây một khu du lịch","Viết sách giới thiệu hang"],"a":0,"why":"SGK (tr.44): năm 2009 anh dẫn đoàn thám hiểm của Hoàng gia Anh đến khám phá hang rất lớn và lạ; sau đó hang được đặt tên là Sơn Đoòng.","wrong":[null,"Văn bản không nói tới việc chụp ảnh quảng cáo.","Văn bản không nói tới việc xây khu du lịch.","Văn bản không nói tới việc viết sách."],"pid":"s7c","muc":"hieu"},{"id":"7o","bai":2,"tag":"doc","type":"short","q":"Theo em, phẩm chất quan trọng nhất của một nhà thám hiểm là gì? Vì sao? (1–2 câu)","goi":"Gợi ý: Theo em, phẩm chất quan trọng nhất là … vì …","mau":"Theo em, đó là lòng dũng cảm đi đôi với sự kiên trì. Có dũng cảm thì mới dám đến nơi chưa ai biết; có kiên trì thì mới vượt được vất vả như Hồ Khanh nhiều ngày một mình vào rừng tìm lối vào hang.","y":["Nêu được một phẩm chất rõ ràng","Giải thích hoặc dẫn chi tiết trong văn bản","Câu văn đủ ý, rõ ràng"],"pid":"s7c","muc":"vd"},{"id":"7p","bai":2,"tag":"doc","type":"mc","q":"Đoạn “Trạm vũ trụ Hy Vọng” diễn ra ở không gian và thời gian nào?","opts":["Trạm vũ trụ quanh sao Hoả, vào năm 2150","Một làng quê ngày xưa","Một lớp học ở hiện tại","Một khu rừng cổ"],"a":0,"why":"Câu 1 nêu rõ: năm 2150, trạm vũ trụ Hy Vọng quay quanh sao Hoả.","wrong":[null,"Đoạn không nói về làng quê.","Đoạn không nói về lớp học.","Đoạn không nói về khu rừng."],"pid":"d7","muc":"biet"},{"id":"7q","bai":2,"tag":"doc","type":"evid","pid":"d7","muc":"hieu","q":"Gạch chân (chạm vào) những câu thể hiện CÔNG NGHỆ của tương lai.","ans":[1,2,4],"why":"Bản đồ ba chiều hiện trên màn hình, robot trợ lí Mi-ni và hàn kín vết nứt bằng tia laser là những chi tiết công nghệ tương lai."},{"id":"7r","bai":2,"tag":"doc","type":"mc","q":"Vì sao có thể xem đoạn trên là một đoạn truyện khoa học viễn tưởng?","opts":["Có không gian vũ trụ, thời gian tương lai và công nghệ giả tưởng dựa trên khoa học","Vì có nhân vật con vật biết nói","Vì kể chuyện thần tiên","Vì kể chuyện đời thường"],"a":0,"why":"Đoạn có đủ các yếu tố: không gian ngoài Trái Đất, thời gian tương lai (2150), robot và công nghệ hiện đại.","wrong":[null,"Nhân vật con vật là đặc điểm của ngụ ngôn.","Truyện thần tiên không dựa trên khoa học.","Đoạn không kể chuyện đời thường."],"pid":"d7","muc":"hieu"},{"id":"7s","bai":2,"tag":"doc","type":"short","q":"Hãy viết tiếp 1–2 câu về điều xảy ra sau khi vết nứt được hàn kín.","goi":"Gợi ý: Sau đó, Lam … và … (dùng một chi tiết khoa học tưởng tượng).","mau":"Sau đó, Lam kiểm tra lại lượng ô-xi trên màn hình và thấy mọi chỉ số đã trở lại bình thường. Mi-ni vui vẻ phát nhạc để chúc mừng cả t ói bỏ dở, ngập ngừng, ngắt quãng"],["Chỗ giống nhau nhất của mọi người là… không ai giống ai cả.","Làm giãn nhịp điệu, chuẩn bị cho từ ngữ bất ngờ, hài hước"]],"why":"SGK (tr.41–42) nêu ba công dụng chính của dấu chấm lửng với các ví dụ tương ứng."},{"id":"7x","bai":2,"tag":"tv","type":"mc","q":"Câu nào dùng dấu chấm lửng để thể hiện lời nói ngập ngừng?","opts":["– Hay là… hay là mình quay lại thử một lần nữa?","Trên bàn có sách, vở, bút,…","Mẹ mua cam, xoài, ổi…","Cô dặn: học bài, làm bài, soạn bài…"],"a":0,"why":"Dấu chấm lửng ở “Hay là… hay là…” thể hiện sự ngập ngừng của người nói.","wrong":[null,"Ở câu này, dấu chấm lửng cho biết liệt kê chưa hết.","Ở câu này, dấu chấm lửng cho biết liệt kê chưa hết.","Ở câu này, dấu chấm lửng cũng cho biết liệt kê chưa hết, không phải ngập ngừng."]},{"id":"7y","bai":2,"tag":"viet","type":"mc","q":"Bài văn kể lại sự việc có thật liên quan đến nhân vật lịch sử cần LƯU Ý điều gì?","opts":["Bảo đảm tính xác thực của các chi tiết liên quan đến sự việc","Bịa thêm chi tiết cho hấp dẫn","Chỉ kể đời tư không liên quan","Không cần nêu ý nghĩa"],"a":0,"why":"SGK (tr.48): cần lưu ý tính xác thực của các chi tiết; bài viết cũng phải nêu ý nghĩa sự việc và suy nghĩ, ấn tượng của người viết (tr.45).","wrong":[null,"Sự việc phải có thật, không bịa thêm.","Phải bám sự việc liên quan đến nhân vật.","Cần nêu ý nghĩa sự việc."]},{"id":"7z","bai":2,"tag":"viet","type":"order","q":"Sắp xếp dàn ý bài văn kể lại sự việc có thật liên quan đến nhân vật lịch sử.","items":["Mở bài: giới thiệu đôi nét về nhân vật và sự việc liên quan","Thân bài: kể diễn biến sự việc, có yếu tố miêu tả","Thân bài: nêu ý nghĩa của sự việc","Kết bài: nêu suy nghĩ, ấn tượng của người viết"],"why":"Dàn ý theo SGK (tr.47)."},{"id":"7za","bai":2,"tag":"viet","type":"mc","q":"Sự kiện nào được kể trong bài viết tham khảo về Ê-đi-xơn?","opts":["Buổi “trình diễn” bóng đèn điện ngoài trời ngày 31 tháng 12 năm 1879","Ông phát minh ra điện thoại","Ông sang Việt Nam giảng bài","Ông lập thư viện"],"a":0,"why":"SGK (tr.45–47): Ê-đi-xơn tạo “sân khấu” ngoài trời, treo hàng trăm bóng đèn ở Men-lô Pác; hơn ba nghìn người đi tàu hoả đến xem.","wrong":[null,"Bài không nói tới điện thoại.","Bài không nói tới chuyến sang Việt Nam.","Bài không nói tới thư viện."]},{"id":"7zb","bai":2,"tag":"viet","type":"mc","q":"Ý nghĩa của sự việc “trình diễn” ánh sáng được nêu trong bài tham khảo là gì?","opts":["Ghi dấu mốc quan trọng của phát minh đèn điện, mở ra kỉ nguyên ánh sáng mới","Chỉ là trò vui giải trí","Làm người ta sợ điện","Làm mất việc của thợ thắp đèn"],"a":0,"why":"SGK (tr.46–47): màn trình diễn ghi dấu mốc quan trọng trong việc phát minh ra đèn điện và hệ thống phân phối điện; con đường được thắp sáng mở ra một kỉ nguyên ánh sáng mới.","wrong":[null,"Bài nhấn mạnh ý nghĩa lịch sử, không phải trò vui.","Bài nói công chúng hết nghi ngờ khi tận mắt chứng kiến.","Bài không nói tới chuyện mất việc."]},{"id":"7zc","bai":2,"tag":"viet","type":"mc","q":"Câu nào có YẾU TỐ MIÊU TẢ khi kể?","opts":["Hàng trăm bóng đèn toả ánh sáng vàng dịu, sáng rực cả con đường tối.","Ông treo hàng trăm bóng đèn.","Sự kiện diễn ra vào cuối năm.","Có nhiều người đến xem."],"a":0,"why":"Câu đầu có từ ngữ gợi hình ảnh (ánh sáng vàng dịu, sáng rực), tạo yếu tố miêu tả; các câu còn lại chỉ nêu sự việc.","wrong":[null,"Câu này chỉ kể sự việc.","Câu này chỉ nêu thời gian.","Câu này chỉ nêu số lượng chung."]},{"id":"7zd","bai":2,"tag":"viet","type":"short","q":"Viết 2 câu Mở bài giới thiệu một nhân vật lịch sử (hoặc nhà khoa học) và sự việc em định kể.","goi":"Gợi ý: Câu 1 giới thiệu nhân vật. Câu 2 nêu sự việc em chọn kể.","mau":"Thô-mát Ê-đi-xơn (1847 – 1931) là nhà phát minh vĩ đại người Mỹ, nổi tiếng với bóng đèn dây tóc. Một trong những câu chuyện thú vị về ông là buổi “trình diễn” bóng đèn điện ngoài trời ngày 31 tháng 12 năm 1879.","y":["Giới thiệu đúng nhân vật","Nêu rõ sự việc có thật sẽ kể","Hai câu rõ ràng, đúng chính tả"]},{"id":"7n1","bai":2,"tag":"noi","type":"mc","q":"Thảo
