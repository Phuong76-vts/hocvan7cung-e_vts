o Bằng; Nói với con in trong tập thơ cùng tên (1980).","wrong":[null,"Chú thích nêu quê ở Cao Bằng.","Chú thích nêu quê ở Cao Bằng.","Chú thích nêu quê ở Cao Bằng."]},{"id":"8d","bai":3,"tag":"tg","type":"mc","q":"Theo Tri thức ngữ văn, sức thuyết phục của văn bản nghị luận phụ thuộc chủ yếu vào điều gì?","opts":["Việc dùng lí lẽ và bằng chứng","Việc dùng nhiều từ khó","Độ dài của văn bản","Số lượng nhân vật"],"a":0,"why":"SGK (tr.55): sức thuyết phục của ý kiến phụ thuộc vào việc dùng lí lẽ và bằng chứng.","wrong":[null,"Từ khó không làm bài thuyết phục hơn.","Dài không có nghĩa là thuyết phục.","Văn nghị luận không cần nhiều nhân vật."]},{"id":"8e","bai":3,"tag":"tg","type":"mc","q":"Mối quan hệ giữa ý kiến, lí lẽ, bằng chứng trong văn bản nghị luận là:","opts":["Mỗi ý kiến được làm rõ bằng lí lẽ, mỗi lí lẽ được củng cố bằng bằng chứng","Chỉ cần có ý kiến, không cần lí lẽ","Bằng chứng nêu trước, ý kiến không cần thiết","Ba yếu tố tách rời nhau"],"a":0,"why":"SGK (tr.55): mỗi ý kiến thường được làm rõ bằng một số lí lẽ, mỗi lí lẽ được củng cố bởi một số bằng chứng, tạo thành hệ thống chặt chẽ.","wrong":[null,"Không có lí lẽ thì ý kiến không thuyết phục.","Ý kiến là trung tâm của bài nghị luận.","Các yếu tố phải liên hệ chặt chẽ với nhau."]},{"id":"8f","bai":3,"tag":"doc","type":"mc","q":"Trong “Bản đồ dẫn đường”, tác giả mở đầu bằng cách nào?","opts":["Kể lại câu chuyện có tính chất ngụ ngôn về người đàn ông đi tìm chìa khoá","Tả cảnh thiên nhiên","Nêu số liệu thống kê","Đọc một bài thơ"],"a":0,"why":"SGK (tr.58) hỏi về tác dụng của cách mở đầu bằng câu chuyện có tính chất ngụ ngôn; từ cách tìm chìa khoá kì khôi của người đàn ông, ông liên hệ tới vấn đề tìm “tấm bản đồ” cho đời mình.","wrong":[null,"Văn bản không bắt đầu bằng tả cảnh.","Văn bản không bắt đầu bằng số liệu.","Văn bản không bắt đầu bằng thơ."],"pid":"s8a","muc":"biet"},{"id":"8g","bai":3,"tag":"doc","type":"mc","q":"Hình ảnh “tấm bản đồ” trong văn bản có nghĩa ẩn dụ là gì?","opts":["Định hướng, con đường và lẽ sống của mỗi người trong cuộc đời","Một tờ giấy vẽ đường đi thật","Tên một thành phố","Một món quà"],"a":0,"why":"SGK (tr.58–59) hỏi về hai khía cạnh của hình ảnh ẩn dụ “tấm bản đồ”: đó là những chỉ dẫn, định hướng cho con đường đi tới tương lai của mỗi người.","wrong":[null,"Đây là ẩn dụ, không phải bản đồ thật.","Không phải tên thành phố.","Không phải món quà."],"pid":"s8a","muc":"hieu"},{"id":"8h","bai":3,"tag":"doc","type":"mc","q":"Lời khuyên của “ông” dành cho “cháu” ở cuối văn bản “Bản đồ dẫn đường” là gì?","opts":["Hãy tự tìm và vẽ tấm bản đồ cho riêng mình bằng chính kinh nghiệm của mình","Hãy giống hệt bố mẹ","Hãy chỉ đi theo con đường có sẵn","Đừng bao giờ tìm kiếm"],"a":0,"why":"SGK (tr.58): cháu cần tìm kiếm bản đồ cho chính mình; không nhất thiết là bản đồ được trao sẵn hay giống hệt bố mẹ, mà là bản đồ tự vẽ bằng kinh nghiệm của mình.","wrong":[null,"Ông khuyên không cần giống hệt bố mẹ.","Ông không khuyên đi theo con đường có sẵn.","Ông khuyên cháu sẵn sàng tìm kiếm."],"pid":"s8a","muc":"hieu"},{"id":"8i","bai":3,"tag":"doc","type":"mc","q":"Văn bản “Hãy cầm lấy và đọc” tập trung bàn về vấn đề gì?","opts":["Ý nghĩa của việc đọc sách và văn hoá đọc","Cách trồng cây ăn quả","Luật lệ của một trò chơi","Công nghệ vũ trụ"],"a":0,"why":"Văn bản bàn về đọc sách, văn hoá đọc: thông điệp “Hãy cầm lấy và đọc” (Tolle, lege) và tình trạng sa sút văn hoá đọc (SGK tr.61–63).","wrong":[null,"Văn bản không nói về trồng cây.","Luật chơi thuộc Bài 9.","Công nghệ vũ trụ thuộc Bài 7."],"pid":"s8b","muc":"biet"},{"id":"8j","bai":3,"tag":"doc","type":"mc","q":"Theo tác giả, muốn giải quyết sự sa sút của văn hoá đọc cần tính đến những phương diện nào?","opts":["Cả chủ thể đọc và đối tượng đọc: có người ham đọc và có sách hay để đọc","Chỉ cần in thật nhiều sách","Chỉ cần cấm xem tivi","Chỉ cần mua sách đắt tiền"],"a":0,"why":"SGK (tr.63): phải tính cả hai phương diện, chủ thể đọc và đối tượng đọc, hai điều này tác động qua lại với nhau.","wrong":[null,"Chưa đủ: nếu sách dở người đọc vẫn hờ hững.","Văn bản không đề nghị cấm xem tivi.","Văn bản không nói tới sách đắt tiền."],"pid":"s8b","muc":"hieu"},{"id":"8k","bai":3,"tag":"doc","type":"mc","q":"Theo tác giả, sách sinh ra để làm gì?","opts":["Để được đọc, “lần giở trước đèn”, không phải để trưng bày, khoe của hay làm dáng","Để trưng bày trong tủ kính","Để khoe với bạn bè","Để làm đồ cổ"],"a":0,"why":"SGK (tr.63): Sách sinh ra không phải để được trưng bày, khoe của hay làm dáng, cũng không nên trở thành cổ vật rêu phong; sách là để “lần giở trước đèn”.","wrong":[null,"Tác giả phê phán việc chỉ trưng bày sách.","Tác giả phê phán việc khoe của.","Tác giả không muốn sách thành cổ vật."],"pid":"s8b","muc":"biet"},{"id":"8l","bai":3,"tag":"doc","type":"mc","q":"Trong bài thơ “Nói với con”, “người đồng mình” có nghĩa là gì?","opts":["Người cùng vùng, cùng quê hương mình","Người cùng tuổi","Người cùng lớp","Người nước ngoài"],"a":0,"why":"Chú thích SGK (tr.65): người đồng mình là người vùng mình, người quê mình.","wrong":[null,"Chú thích không nói là cùng tuổi.","Không phải là cùng lớp.","Không phải người nước ngoài."],"pid":"s8c","muc":"biet"},{"id":"8m","bai":3,"tag":"doc","type":"mc","q":"Hai câu “Sống trên đá không chê đá gập ghềnh / Sống trong thung không chê thung nghèo đói” gửi gắm điều gì?","opts":["Hãy gắn bó, yêu quê hương dù còn gian khó, không chê bai","Hãy bỏ quê hương mà đi","Hãy than phiền về cuộc sống","Hãy sống xa người thân"],"a":0,"why":"Người cha dặn con sống gắn bó, yêu thương quê hương dù còn gập ghềnh, nghèo đói; sống mạnh mẽ như sông như suối (tr.66).","wrong":[null,"Bài thơ khuyên gắn bó với quê hương.","Bài thơ không khuyên than phiền.","Bài thơ ca ngợi tình cảm gia đình, quê hương."],"pid":"s8c","muc":"hieu"},{"id":"8n","bai":3,"tag":"doc","type":"short","q":"Em hiểu thế nào về câu thơ “Người đồng mình thô sơ da thịt / Chẳng mấy ai nhỏ bé đâu con”? (1–2 câu)","goi":"Gợi ý: Câu thơ cho thấy người đồng mình bề ngoài … nhưng …","mau":"Câu thơ cho thấy người đồng mình bề ngoài giản dị, mộc mạc nhưng có ý chí và nghị lực lớn lao, không hề nhỏ bé. Người cha muốn con tự hào về quê hương và sống mạnh mẽ.","y":["Nêu được vẻ ngoài mộc mạc, giản dị","Nêu được sức sống, ý chí, tầm vóc tinh thần","Câu văn rõ ràng, đủ ý"],"pid":"s8c","muc":"vd"},{"id":"8o","bai":3,"tag":"doc","type":"evid","pid":"d8","muc":"biet","q":"Gạch chân (chạm vào) câu nêu rõ Ý KIẾN CỦA NGƯỜI VIẾT (phản đối quan niệm).","ans":[1],"why":"Câu 2: “Tôi không đồng tình với ý kiến đó.” Đây là câu bày tỏ thái độ phản đối của người viết."},{"id":"8p","bai":3,"tag":"doc","type":"mc","q":"Trong đoạn trên, câu “Chẳng hạn, Lan từng chép bài toán của bạn, nhưng khi cô giáo gọi lên bảng, Lan không giải được.” là:","opts":["Bằng chứng cụ thể cho lí lẽ ở câu trước","Lí lẽ chính của cả đoạn","Ý kiến cần phản đối","Câu kết bài"],"a":0,"why":"Câu này nêu một ví dụ cụ thể (Lan chép bài rồi không giải được) để làm rõ lí lẽ: chép bài khiến ta không hiểu bài.","wrong":[null,"Lí lẽ chính là câu 3.","Ý kiến cần phản đối là câu 1.","Câu kết bài là câu cuối."],"pid":"d8","muc":"hieu"},{"id":"8q","bai":3,"tag":"doc","type":"evid","pid":"d8","muc":"hieu","q":"Gạch chân (chạm vào) những câu nêu LÍ LẼ để phản đối việc chép bài.","ans":[2,4],"why":"Câu 3: chép bài khiến ta không hiểu bài. Câu 5: chép bài là thiếu trung thực, làm mất lòng tin. Hai câu đều giải thích vì sao không nên chép bài."},{"id":"8r","bai":3,"tag":"doc","type":"short","q":"Em hãy nêu thêm MỘT lí lẽ khác để phản đối việc chép bài của bạn. (1–2 câu)","goi":"Gợi ý: Ngoài ra, chép bài còn … vì …","mau":"Ngoài ra, chép bài còn làm ta mất thói quen tự suy nghĩ vì cứ dựa vào người khác, lâu dần sẽ càng khó tự học và khó tiến bộ.","y":["Nêu một lí lẽ mới, khác các lí lẽ đã có","Giải thích được vì sao","Câu văn rõ ràng, đủ ý"],"pid":"d8","muc":"vd"},{"id":"8s","bai":3,"tag":"tv","type":"mc","q":"Thuật ngữ là gì?","opts":["Từ ngữ dùng để chỉ các khái niệm của một số lĩnh vực chuyên môn hoặc ngành khoa học","Câu đúc kết kinh nghiệm dân gian","Cụm từ có nghĩa bóng bẩy","Từ chỉ cảm xúc"],"a":0,"why":"SGK (tr.55): thuật ngữ là từ ngữ dùng để chỉ các khái niệm của một số lĩnh vực chuyên môn hoặc ngành khoa học.","wrong":[null,"Đó là tục ngữ.","Đó là thành ngữ.","Đó là thán từ."]},{"id":"8t","bai":3,"tag":"tv","type":"mc","q":"Nghĩa của thuật ngữ có đặc điểm gì?","opts":["Là nghĩa quy ước trong phạm vi hẹp của lĩnh vực chuyên môn hoặc khoa học","Là nghĩa thay đổi tuỳ người nói","Là nghĩa bóng bẩy","Là nghĩa dùng để gây cười"],"a":0,"why":"SGK (tr.55): nghĩa của thuật ngữ là nghĩa quy ước trong phạm vi hẹp của lĩnh vực chuyên môn hoặc khoa học chuyên ngành.","wrong":[null,"Thuật ngữ cần chính xác, không thay đổi tuỳ người.","Nghĩa bóng bẩy là của thành ngữ.","Gây cười là tác dụng của nói quá."]},{"id":"8u","bai":3,"tag":"tv","type":"sort","q":"Từ in đậm là THUẬT NGỮ hay từ ngữ THÔNG THƯỜNG?","bins":["Thuật ngữ","Từ ngữ thông thường"],"items":[["Muối là hợp chất mà phân tử gồm nguyên tử kim loại liên kết với gốc acid.",0],["Canh còn hơi nhạt, con thêm tí muối nữa đi.",1],["Ẩn số của phương trình này là một số thập phân.",0],["Liệu con vi-rút này có biến thể khác hay không vẫn còn là một ẩn số.",1]],"why":"SGK (tr.64–65): muốn biết một từ có phải thuật ngữ hay không phải dựa vào ngữ cảnh. Trong hoá học, “muối” là thuật ngữ; trong nấu ăn, “muối” là từ thông thường. Tương tự với “ẩn số”."},{"id":"8v","bai":3,"tag":"tv","type":"mc","q":"Muốn hiểu nghĩa của một thuật ngữ, cách làm nào đáng tin cậy nhất?","opts":["Tra Bảng thuật ngữ sau sách hoặc từ điển chuyên ngành","Đoán nghĩa theo cảm giác","Ghép nghĩa từng yếu tố tạo thành","Hỏi bất kì người nào"],"a":0,"why":"SGK (tr.64): suy đoán nghĩa dựa vào ngữ cảnh hay ghép nghĩa từng yếu tố rất dễ sai; nên tìm đến Bảng tra cứu thuật ngữ hoặc từ điển chuyên ngành.","wrong":[null,"Đoán theo cảm giác dễ sai.","Ghép nghĩa từng yếu tố dễ dẫn tới hiểu sai.","Cần nguồn đáng tin cậy."]},{"id":"8w","bai":3,"tag":"tv","type":"match","q":"Ghép phép liên kết với cách thực hiện.","pairs":[["Phép nối","Dùng từ ngữ nối như nhưng, vì vậy, tuy nhiên"],["Phép thế","Dùng đại từ hoặc từ ngữ đồng nghĩa thay cho từ ngữ ở câu trước"],["Phép lặp","Lặp lại từ ngữ đã có ở câu trước hoặc đoạn trước"]],"why":"SGK (tr.55): các biện pháp liên kết gồm phép nối, phép thế, phép lặp,… gắn với những phương tiện (từ ngữ) liên kết cụ thể."},{"id":"8x","bai":3,"tag":"viet","type":"mc","q":"Bài văn nghị luận trình bày ý kiến phản đối cần có yêu cầu nào?","opts":["Nêu vấn đề, làm rõ thực chất, trình bày rõ ý kiến phản đối, có lí lẽ và bằng chứng","Chỉ chê bai người khác","Chỉ kể một câu chuyện","Chỉ liệt kê tên các bạn"],"a":0,"why":"SGK (tr.67): nêu được vấn đề và làm rõ thực chất; trình bày rõ ý kiến phản đối; đưa lí lẽ và bằng chứng để chứng tỏ sự phản đối có cơ sở.","wrong":[null,"Phản đối phải có lí lẽ, không phải chê bai.","Bài nghị luận không chỉ kể chuyện.","Không có yêu cầu này."]},{"id":"8y","bai":3,"tag":"viet","type":"order","q":"Sắp xếp dàn ý bài văn nghị luận phản đối cho đúng trật tự.","items":["Mở bài: nêu vấn đề nghị luận và bày tỏ ý kiến phản đối","Thân bài: trình bày thực chất của ý kiến, quan niệm cần bàn","Thân bài: phản đối các khía cạnh của quan niệm (lí lẽ, bằng chứng)","Thân bài: nhận xét tác động tiêu cực của quan niệm đối với đời sống","Kết bài: nêu ý nghĩa của việc thể hiện ý kiến phản đối"],"why":"Dàn ý theo SGK (tr.70)."},{"id":"8z","bai":3,"tag":"viet","type":"mc","q":"Trong bài “Việc lớn, việc nhỏ”, quan niệm nào bị phản đối?","opts":["“Tôi chỉ làm việc lớn, việc nhỏ là việc vô nghĩa, tôi không thích làm.”","“Mọi việc, dù nhỏ, đều đáng làm.”","“Học tập là việc lớn nhất của học sinh.”","“Phải biết quý trọng thời gian.”"],"a":0,"why":"SGK (tr.67–69): người viết phản đối quan niệm chỉ làm việc lớn, coi việc nhỏ là vô nghĩa.","wrong":[null,"Đây là quan điểm của người viết, không bị phản đối.","Đây là ý trong bài nhưng không phải quan niệm bị phản đối.","Bài không bàn về vấn đề này."]},{"id":"8za","bai":3,"tag":"viet","type":"mc","q":"Trong bài “Việc lớn, việc nhỏ”, người viết dùng chuyện nào làm bằng chứng cho việc nhỏ cũng có ý nghĩa lớn?","opts":["Chuyện ông Ni-nô-mi-gia, doanh nhân Nhật Bản, sáng Chủ nhật nhặt rác làm sạch Hồ Gươm","Chuyện Sơn Tinh, Thuỷ Tinh","Chuyện Ê-đi-xơn phát minh bóng đèn","Chuyện người thợ mộc đẽo cày"],"a":0,"why":"SGK (tr.68): việc làm của ông Ni-nô-mi-gia có sức lan toả; từ một người, sau có thêm hơn chục người nước ngoài cùng nhặt rác.","wrong":[null,"Đó là truyền thuyết, không có trong bài này.","Đó là bằng chứng của bài Bài 7.","Đó là truyện ngụ ngôn ở Bài 6."]},{"id":"8zb","bai":3,"tag":"viet","type":"mc","q":"Ở phần Thân bài, người viết cần TRÁNH điều gì?","opts":["Viết kể lể, rườm rà","Triển khai mỗi ý thành một đoạn riêng","Dùng bằng chứng cụ thể","Liên kết chặt chẽ các câu, các đoạn"],"a":0,"why":"SGK (tr.71): các ý chính trình bày rành mạch, mỗi ý một đoạn; chú ý mạch văn trôi chảy, liên kết chặt chẽ; tránh cách viết kể lể, rườm rà.","wrong":[null,"Nên làm như vậy.","Nên làm như vậy.","Nên làm như vậy."]},{"id":"8zc","bai":3,"tag":"viet","type":"short","q":"Viết 2 câu Mở bài nêu vấn đề và bày tỏ ý kiến PHẢN ĐỐI với quan niệm: “Có thể bỏ qua một số môn, chỉ nên học những môn mình yêu thích.”","goi":"Gợi ý: Câu 1 nêu quan niệm cần bàn. Câu 2 cho biết em không đồng tình và nói ngắn gọn lí do.","mau":"Có bạn cho rằng chỉ nên học những môn mình yêu thích, còn môn khác có thể bỏ qua. Em hoàn toàn không đồng tình với quan niệm này vì mỗi môn học đều góp phần làm nên hiểu biết toàn diện của chúng ta.","y":["Nêu đúng vấn đề, quan niệm cần bàn","Nói rõ thái độ phản đối","Hai câu rõ ràng, đúng chính tả"]},{"id":"8n1","bai":3,"tag":"noi","type":"mc","q":"Khi người nghe phản bác ý kiến của em, em nên làm gì?","opts":["Tóm tắt ý kiến phản bác, giải thích lại chỗ chưa hiểu và dùng lí lẽ, bằng chứng để bảo vệ ý kiến","Im lặng bỏ đi","Tranh cãi to tiếng","Đổi ý kiến ngay không cần suy nghĩ"],"a":0,"why":"SGK (tr.72): người nói tóm tắt ý kiến trao đổi, giải thích lại chỗ người nghe chưa hiểu, dùng lí lẽ và bằng chứng làm rõ tính đúng đắn của ý kiến.","wrong":[null,"Cần trả lời ý kiến của người nghe.","Tranh cãi to tiếng không giúp thuyết phục.","Cần xem lại, bảo vệ nếu thấy xác đáng."]},{"id":"8n2","bai":3,"tag":"noi","type":"mc","q":"Người nghe nên nêu ý kiến trao đổi như thế nào?","opts":["Ngắn gọn, rõ ràng, bằng câu khẳng định hoặc câu hỏi","Dài dòng, vòng vo","Chỉ cười, không nói","Nói về chuyện khác"],"a":0,"why":"SGK (tr.72): ý kiến cần trình bày ngắn gọn, rõ ràng, bằng câu khẳng định hoặc câu hỏi.","wrong":[null,"Dài dòng làm loãng vấn đề.","Cần nêu ý kiến rõ.","Cần bám sát vấn đề đang bàn."]},{"id":"9a","bai":4,"tag":"tg","type":"match","q":"Ghép văn bản với tác giả.","pairs":[["Thuỷ tiên tháng Một","Thô-mát L. Phrít-man"],["Lễ rửa làng của người Lô Lô","Phạm Thuỳ Dung"],["Bản tin về hoa anh đào","Nguyễn Vĩnh Nguyên"],["“Thân thiện với môi trường” (Thực hành đọc)","Nguyễn Hữu Quỳnh Hương"]],"why":"Đây là các văn bản của Bài 9 – Hoà điệu với tự nhiên (SGK tập hai, tr.78, 84, 87, 98)."},{"id":"9b","bai":4,"tag":"tg","type":"mc","q":"“Thuỷ tiên tháng Một” là một bài trong cuốn sách nào của Thô-mát L. Phrít-man?","opts":["Nóng, Phẳng, Chật","Chiếc Lếch-xót và cây ô-liu","Những bức thư gửi cháu Sam","Hai vạn dặm dưới biển"],"a":0,"why":"Chú thích SGK (tr.82): Thuỷ tiên tháng Một nằm trong mục 5 (Sự bất thường của Trái Đất) của cuốn Nóng, Phẳng, Chật.","wrong":[null,"Đây là sách khác của cùng tác giả, không chứa văn bản này.","Đây là sách của Đa-ni-en Gốt-li-ép (Bài 8).","Đây là tiểu thuyết của Giuyn Véc-nơ (Bài 7)."]},{"id":"9c","bai":4,"tag":"tg","type":"mc","q":"Thô-mát L. Phrít-man là ai?","opts":["Nhà báo người Mỹ, ba lần được trao giải Pu-lít-dơ","Nhà thơ Việt Nam","Nhà khoa học vũ trụ người Nga","Nhà thám hiểm hang động"],"a":0,"why":"Theo chú thích SGK (tr.82): Thô-mát L. Phrít-man sinh năm 1953, nhà báo người Mỹ, ba lần được trao giải Pu-lít-dơ.","wrong":[null,"Ông là người Mỹ.","Ông là nhà báo, không phải nhà khoa học vũ trụ.","Nhà thám hiểm hang động trong Bài 7 là Hồ Khanh."]},{"id":"9d","bai":4,"tag":"tg","type":"mc","q":"Văn bản “Bản tin về hoa anh đào” thuộc thể loại nào?","opts":["Tản văn","Truyện ngụ ngôn","Thơ năm chữ","Bản tường trình"],"a":0,"why":"SGK (tr.89) gọi văn bản là “bài tản văn”; tác phẩm trích từ cuốn Với Đà Lạt ai cũng là lữ khách.","wrong":[null,"Truyện ngụ ngôn học ở Bài 6.","Văn bản viết văn xuôi, không phải thơ.","Tường trình là văn bản hành chính."]},{"id":"9e","bai":4,"tag":"tg","type":"mc","q":"Theo Tri thức ngữ văn, văn bản giới thiệu quy tắc hoặc luật lệ trong trò chơi, hoạt động thuộc loại nào?","opts":["Văn bản thuyết minh, giúp người đọc tham gia hoặc đánh giá trò chơi, hoạt động ấy","Văn bản tự sự","Văn bản biểu cảm","Văn bản nghị luận"],"a":0,"why":"SGK (tr.77): đây là loại văn bản thuyết minh nói về đặc điểm của một trò chơi hay hoạt động, giúp người đọc tham gia, thưởng thức hay đánh giá trò chơi, hoạt động ấy một cách thuận lợi.","wrong":[null,"Văn bản này không chủ yếu kể chuyện.","Văn bản này không chủ yếu bộc lộ cảm xúc.","Văn bản này không chủ yếu bàn luận ý kiến."]},{"id":"9f","bai":4,"tag":"tg","type":"mc","q":"Văn bản giới thiệu quy tắc, luật lệ của trò chơi thường trình bày như thế nào?","opts":["Chi tiết về cách chơi, cách tổ chức, bằng câu ngắn gọn, dễ hiểu, có thể kèm hình minh hoạ","Bằng thơ lục bát","Bằng lời kể dài dòng","Chỉ bằng ảnh, không có chữ"],"a":0,"why":"SGK (tr.77): văn bản trình bày chi tiết cách chơi, cách tổ chức (thời gian, địa điểm, số lượng người, điều kiện…) bằng câu ngắn gọn, dễ hiểu, có thể kèm hình vẽ hoặc ảnh minh hoạ.","wrong":[null,"Loại văn bản này không dùng thơ lục bát.","Câu cần ngắn gọn, dễ hiểu.","Có chữ là phương tiện chính."]},{"id":"9g","bai":4,"tag":"tg","type":"mc","q":"Có những cách triển khai ý tưởng và thông tin nào trong văn bản thông tin?","opts":["Theo trật tự thời gian, theo quan hệ nhân quả, nêu nhiều góc nhìn, trình bày từng bộ phận","Chỉ một cách duy nhất","Chỉ kể ngẫu nhiên","Chỉ liệt kê tên riêng"],"a":0,"why":"SGK (tr.77): có nhiều cách triển khai, như theo thời gian, nhân quả, đưa nhiều góc nhìn, hoặc lần lượt từng bộ phận rồi nêu nhận định bao trùm.","wrong":[null,"SGK nêu nhiều cách.","Triển khai cần có trật tự.","Không chỉ liệt kê tên riêng."]},{"id":"9h","bai":4,"tag":"doc","type":"mc","q":"Nhan đề “Thuỷ tiên tháng Một” gợi điều gì về nội dung văn bản?","opts":["Hoa thuỷ tiên nở vào tháng Một là biểu hiện của sự bất thường của thời tiết, khí hậu","Một loài hoa đẹp ở Tết","Công thức trồng hoa","Một lễ hội mùa xuân"],"a":0,"why":"Văn bản thuộc mục “Sự bất thường của Trái Đất”; hoa nở sớm giữa mùa đông là chi tiết gợi sự biến đổi của thời tiết (SGK tr.82, câu hỏi 2–3).","wrong":[null,"Văn bản không nói về Tết.","Văn bản không hướng dẫn trồng hoa.","Văn bản không nói về lễ hội."],"pid":"s9a","muc":"hieu"},{"id":"9i","bai":4,"tag":"doc","type":"mc","q":"Việc tác giả đưa nhiều số liệu và ghi tài liệu tham khảo trong “Thuỷ tiên tháng Một” có tác dụng gì?","opts":["Tăng độ tin cậy, tính xác thực và sức thuyết phục của thông tin","Làm văn bản khó đọc hơn","Chỉ để trang trí","Để người đọc sao chép"],"a":0,"why":"SGK (tr.77, 82): tài liệu tham khảo giúp người đọc nhận định bước đầu về độ tin cậy của thông tin; số liệu làm vấn đề thêm rõ ràng, thuyết phục.","wrong":[null,"Mục đích là làm rõ, không phải gây khó.","Số liệu có vai trò chứng minh.","Mục đích không phải để sao chép."],"pid":"s9a","muc":"vd"},{"id":"9j","bai":4,"tag":"doc","type":"mc","q":"Lễ rửa làng của người Lô Lô thường được tổ chức vào lúc nào?","opts":["Khi xong xuôi mùa vụ, vào một ngày đẹp trời","Giữa mùa lũ","Vào đêm giao thừa","Chỉ vào ngày mưa"],"a":0,"why":"Đoạn đầu văn bản (tr.84): khi xong xuôi mùa vụ, người Lô Lô nghĩ tới việc tổ chức lễ rửa làng vào một ngày đẹp trời, với ước vọng tốt lành cho cuộc sống ấm no.","wrong":[null,"Văn bản không nói giữa mùa lũ.","Văn bản không nói tới đêm giao thừa.","Văn bản nói ngày đẹp trời."],"pid":"s9b","muc":"biet"},{"id":"9k","bai":4,"tag":"doc","type":"mc","q":"Văn bản “Lễ rửa làng của người Lô Lô” có mục đích gì?","opts":["Giới thiệu thông tin về lễ hội và những quy tắc, hoạt động trong ngày lễ","Kể một truyện cổ tích","Bàn luận ý kiến phản đối","Quảng cáo một sản phẩm"],"a":0,"why":"SGK (tr.87) hỏi về mục đích của tác giả: văn bản giới thiệu lễ rửa làng, nêu các hoạt động, luật lệ và ý nghĩa của lễ hội.","wrong":[null,"Văn bản không phải truyện cổ tích.","Văn bản không phản đối ý kiến nào.","Văn bản không quảng cáo."],"pid":"s9b","muc":"hieu"},{"id":"9l","bai":4,"tag":"doc","type":"mc","q":"Qua “Lễ rửa làng”, em thấy giá trị sống nào của người Lô Lô được thể hiện?","opts":["Gắn bó cộng đồng, ước vọng bình yên, ấm no và sống hài hoà với thiên nhiên","Đề cao sự giàu có","Tránh gặp gỡ người khác","Chỉ làm việc một mình"],"a":0,"why":"Lễ hội diễn ra khi xong mùa vụ với ước vọng tốt lành, no ấm; các hoạt động nhấn mạnh tính cộng đồng (SGK tr.87, câu hỏi 4).","wrong":[null,"Văn bản không nhấn mạnh sự giàu có.","Lễ hội là dịp tụ họp cộng đồng.","Hoạt động mang tính cộng đồng."],"pid":"s9b","muc":"vd"},{"id":"9m","bai":4,"tag":"doc","type":"mc","q":"Trong “Bản tin về hoa anh đào”, người bạn nhà báo của tác giả đã viết điều gì đều đặn hằng năm?","opts":["Những bản tin nhỏ về hoa anh đào khi Đà Lạt giao mùa đông – xuân","Phóng sự điều tra về giá cả","Bài thơ về mùa thu","Tin thể thao"],"a":0,"why":"Đoạn đầu văn bản (tr.87): bên cạnh phóng sự, kí sự, anh còn viết những bản tin nhỏ về hoa anh đào đều đặn mỗi năm khi Đà Lạt giao mùa đông – xuân.","wrong":[null,"Văn bản nhắc phóng sự nhưng điều đáng nể phục là bản tin hoa.","Văn bản không nhắc tới thơ mùa thu.","Văn bản không nhắc tới tin thể thao."],"pid":"s9c","muc":"biet"},{"id":"9n","bai":4,"tag":"doc","type":"short","q":"Theo em, tác giả muốn gửi gắm thông điệp gì qua “Bản tin về hoa anh đào”? (1–2 câu)","goi":"Gợi ý: Tác giả muốn nhắc chúng ta … vì …","mau":"Tác giả muốn nhắc mỗi người biết trân trọng, nâng niu thiên nhiên, hoa cỏ như những “nhân vật” lặng lẽ làm nên vẻ đẹp cuộc sống; việc đưa tin về hoa cũng là cách làm cho con người sống hài hoà hơn với thiên nhiên.","y":["Nêu được thông điệp về trân trọng, nâng niu thiên nhiên","Gắn với chi tiết bản tin về hoa anh đào","Câu văn rõ ràng, đủ ý"],"pid":"s9c","muc":"vd"},{"id":"9o","bai":4,"tag":"doc","type":"mc","q":"Mỗi đội chơi “Ném vòng” gồm bao nhiêu bạn?","opts":["Từ năm đến sáu bạn","Hai bạn","Mười bạn","Cả lớp"],"a":0,"why":"Câu 1: “mỗi đội gồm từ năm đến sáu bạn”.","wrong":[null,"Không phải hai bạn.","Không phải mười bạn.","Không phải cả lớp."],"pid":"d9","muc":"biet"},{"id":"9p","bai":4,"tag":"doc","type":"evid","pid":"d9","muc":"hieu","q":"Gạch chân (chạm vào) những câu nêu LUẬT PHẠT và cách TÍNH THẮNG THUA.","ans":[3,4],"why":"Câu 4: đứng chạm hoặc vượt vạch khi ném sẽ bị mất lượt (luật phạt). Câu 5: đội có tổng điểm cao nhất thắng (cách tính thắng thua)."},{"id":"9q","bai":4,"tag":"doc","type":"mc","q":"Câu cuối của đoạn có vai trò gì?","opts":["Nêu tác dụng của trò chơi","Nêu luật phạt","Giới thiệu dụng cụ","Nêu số người chơi"],"a":0,"why":"Câu cuối nói trò chơi rèn sự khéo léo, tính chính xác và tinh thần đồng đội: đó là tác dụng của trò chơi.","wrong":[null,"Luật phạt ở câu 4.","Dụng cụ ở câu 2.","Số người ở câu 1."],"pid":"d9","muc":"hieu"},{"id":"9r","bai":4,"tag":"doc","type":"short","q":"Em hãy đề xuất thêm MỘT quy tắc cho trò chơi “Ném vòng” (1–2 câu).","goi":"Gợi ý: Ngoài ra, … (nêu điều mà người chơi phải làm hoặc không được làm).","mau":"Ngoài ra, các bạn trong đội phải ném theo thứ tự đã thống nhất từ đầu; bạn nào ném sai thứ tự thì lượt ném đó không được tính điểm.","y":["Quy tắc rõ ràng, hợp lí, không mâu thuẫn với luật đã có","Có điều kiện hoặc hệ quả cụ thể","Câu văn rõ ràng, đủ ý"],"pid":"d9","muc":"vd"},{"id":"9s","bai":4,"tag":"tv","type":"mc","q":"Cước chú là gì?","opts":["Chú thích đặt ở chân trang hoặc cuối văn bản về từ ngữ khó hiểu hoặc nguồn của nội dung","Phần tóm tắt đặt ở đầu văn bản","Tên tác giả","Nhan đề của văn bản"],"a":0,"why":"SGK (tr.77): cước chú là chú thích đặt ở chân trang hoặc cuối văn bản về một từ ngữ khó hiểu hay nội dung chưa quen, hoặc cho biết nguồn của văn bản, của yếu tố trong văn bản.","wrong":[null,"Cước chú không phải phần tóm tắt.","Tên tác giả không phải cước chú.","Nhan đề không phải cước chú."]},{"id":"9t","bai":4,"tag":"tv","type":"mc","q":"Một cước chú hoàn chỉnh gồm các thành phần nào?","opts":["Kí hiệu đánh dấu đối tượng; tên đối tượng; dấu hai chấm; nội dung giải thích","Chỉ có nội dung giải thích","Chỉ có số thứ tự","Tên người viết và ngày viết"],"a":0,"why":"SGK (tr.83): cước chú gồm kí hiệu đánh dấu đối tượng, tên đối tượng được chú thích, dấu hai chấm, nội dung giải thích; thường đặt ở chân trang, ngắn gọn.","wrong":[null,"Thiếu kí hiệu và tên đối tượng.","Chỉ số thứ tự chưa đủ.","Đó không phải thành phần của cước chú."]},{"id":"9u","bai":4,"tag":"tv","type":"mc","q":"Danh mục tài liệu tham khảo thường được ghi ở đâu và giúp ích gì?","opts":["Ghi sau phần kết thúc văn bản; giúp người đọc đánh giá độ tin cậy của thông tin","Ghi ở đầu văn bản; để trang trí","Ghi giữa các câu; để ngắt ý","Không bao giờ ghi"],"a":0,"why":"SGK (tr.77): tài liệu tham khảo thường ghi sau phần kết thúc văn bản, được đánh số, sắp xếp thống nhất; giúp người đọc nhận định bước đầu về độ tin cậy và giá trị chuyên môn của văn bản.","wrong":[null,"Thường ghi ở cuối, không phải đầu.","Không ghi xen giữa các câu.","Văn bản khoa học thường có danh mục tài liệu tham khảo."]},{"id":"9v","bai":4,"tag":"tv","type":"mc","q":"Từ “thuyết minh” gồm hai yếu tố Hán Việt nào, nghĩa của cả từ là gì?","opts":["thuyết (nói) + minh (rõ ràng, sáng sủa) → nói rõ ràng ra","thuyết (viết) + minh (đêm)","thuyết (nghe) + minh (tối)","thuyết (đi) + minh (xa)"],"a":0,"why":"SGK (tr.90): thuyết liên quan tới hành động nói; minh liên quan tới sự rõ ràng, sáng sủa; thuyết minh là nói rõ ràng ra về một vấn đề nào đó.","wrong":[null,"“Thuyết” liên quan đến nói, không phải viết.","“Minh” liên quan đến sáng, rõ, không phải tối.","“Thuyết” không có nghĩa đi."]},{"id":"9w","bai":4,"tag":"tv","type":"match","q":"Ghép yếu tố Hán Việt với nghĩa thường gặp.","pairs":[["bản (trong bản sắc)","gốc, vốn có"],["ưu (trong ưu tư)","lo lắng, buồn lo"],["tư (trong ưu tư)","suy nghĩ"],["thông (trong truyền thông)","suốt, thông suốt"]],"why":"Gợi ý cách làm của SGK (tr.90): tập hợp các từ có cùng yếu tố để suy ra nghĩa của từng yếu tố. Ví dụ: bản chất, bản lĩnh, bản quán… cho thấy “bản” là gốc."},{"id":"9x","bai":4,"tag":"tv","type":"mc","q":"Cách suy đoán nhanh nghĩa của từ có yếu tố Hán Việt theo SGK là:","opts":["Tách từ thành các yếu tố, gom các từ đã biết có cùng yếu tố rồi suy ra nghĩa từng yếu tố","Chỉ đoán theo âm đọc","Bỏ qua yếu tố thứ hai","Luôn tra từ điển nước ngoài"],"a":0,"why":"SGK (tr.90): tách từ thành các yếu tố; tập hợp những từ đã biết có chứa yếu tố đó và xếp nhóm; dựa vào nghĩa chung của từng nhóm để suy ra nghĩa yếu tố rồi nghĩa cả từ.","wrong":[null,"Đoán theo âm dễ sai.","Cần xét cả hai yếu tố.","SGK không yêu cầu như vậy."]},{"id":"9y","bai":4,"tag":"viet","type":"mc","q":"Yêu cầu của bài văn thuyết minh về quy tắc hoặc luật lệ trong trò chơi, hoạt động là gì?","opts":["Giới thiệu thông tin cần thiết, miêu tả quy tắc hoặc luật lệ, nêu vai trò, tác dụng và ý nghĩa","Kể chuyện cá nhân","Phản đối một ý kiến","Phân tích nhân vật"],"a":0,"why":"SGK (tr.91): giới thiệu thông tin cần thiết (hoàn cảnh diễn ra, đối tượng tham gia); miêu tả quy tắc, luật lệ; nêu vai trò, tác dụng; nêu ý nghĩa.","wrong":[null,"Đây không phải mục đích bài thuyết minh.","Đó là bài nghị luận phản đối.","Đó là bài phân tích nhân vật."]},{"id":"9z","bai":4,"tag":"viet","type":"order","q":"Sắp xếp dàn ý bài văn thuyết minh quy tắc, luật lệ trò chơi.","items":["Mở bài: giới thiệu trò chơi (tên gọi, hoàn cảnh diễn ra, đối tượng tham gia)","Thân bài: miêu tả quy tắc hoặc luật lệ của trò chơi","Thân bài: nêu tác dụng của trò chơi","Kết bài: nêu ý nghĩa của trò chơi đối với cuộc sống"],"why":"Dàn ý theo SGK (tr.94)."},{"id":"9za","bai":4,"tag":"viet","type":"mc","q":"Trong bài tham khảo “Chơi chuyền”, bộ đồ chơi gồm những gì và số người tham gia thường là bao nhiêu?","opts":["10 que chuyền và một quả; thường từ 2 đến 6 người","20 quân cờ; 2 người","1 sợi dây; cả lớp","5 viên bi; 10 người"],"a":0,"why":"SGK (tr.91): đồ chơi gồm 10 que nhỏ gọi là que chuyền và một quả tròn nặng; tham gia thường từ 2 đến 6 người.","wrong":[null,"Không phải bộ đồ chơi của chơi chuyền.","Không phải bộ đồ chơi của chơi chuyền.","Không phải bộ đồ chơi của chơi chuyền."]},{"id":"9zb","bai":4,"tag":"viet","type":"mc","q":"Theo bài “Chơi chuyền”, trò chơi này có tác dụng gì?","opts":["Luyện sự khéo léo, nhanh tay nhanh mắt, tính toán trong phạm vi 10 và gắn kết người chơi","Rèn sức mạnh chạy đua","Chỉ để thắng thua","Chỉ để giải trí một mình"],"a":0,"why":"SGK (tr.93): chơi chuyền luyện sự khéo léo, nhanh tay, nhanh mắt, khả năng tính toán trong phạm vi 10; gắn kết người chơi, củng cố tinh thần đồng đội.","wrong":[null,"Bài không nói đến chạy đua.","Bài nhấn mạnh sự gắn kết và hoà đồng.","Đây là trò chơi cùng nhau."]},{"id":"9zc","bai":4,"tag":"viet","type":"mc","q":"Khi viết bài thuyết minh luật chơi, mỗi ý thuyết minh nên được trình bày thế nào?","opts":["Thành một đoạn văn riêng, miêu tả chi tiết, rõ ràng","Gộp tất cả vào một câu","Chỉ ghi tên trò chơi","Bỏ qua các bước chơi"],"a":0,"why":"SGK (tr.94): miêu tả quy tắc, luật lệ của trò chơi, hoạt động một cách chi tiết, rõ ràng; mỗi ý thuyết minh trình bày thành một đoạn văn.","wrong":[null,"Gộp vào một câu sẽ khó hiểu.","Cần miêu tả quy tắc cụ thể.","Các bước chơi là nội dung chính."]},{"id":"9zd","bai":4,"tag":"viet","type":"short","q":"Viết 3–4 câu miêu tả luật chơi của MỘT trò chơi em biết (ví dụ: bịt mắt bắt dê, nhảy bao bố, kéo co).","goi":"Gợi ý: Nêu số người chơi → cách chơi chính → khi nào thắng hoặc bị phạt.","mau":"Trò chơi nhảy bao bố thường có từ năm đến sáu bạn tham gia. Mỗi bạn đứng trong một chiếc bao bố, hai tay giữ mép bao rồi nhảy về đích. Bạn nào ngã hoặc bước ra khỏi bao phải quay lại vạch xuất phát. Người về đích đầu tiên là người thắng cuộc.","y":["Nêu số người hoặc dụng cụ","Miêu tả đúng trình tự cách chơi","Có luật phạt hoặc cách tính thắng thua"]},{"id":"9n1","bai":4,"tag":"noi","type":"mc","q":"Khi giải thích quy tắc của trò chơi, em nên mở đầu bài nói thế nào?","opts":["Thu hút người nghe bằng thái độ hào hứng, có thể đặt câu hỏi như “Các bạn đã bao giờ chơi trò… chưa?”","Đọc to nguyên văn bài viết","Xin lỗi vì nói chưa hay","Nói rất nhỏ để không ai nghe"],"a":0,"why":"SGK (tr.96): mở đầu nên thu hút người nghe bằng thái độ hào hứng với trò chơi, có thể đặt câu hỏi cho người nghe.","wrong":[null,"Không nên chỉ đọc nguyên văn.","Không cần xin lỗi.","Nói quá nhỏ khiến người nghe không hiểu."]},{"id":"9n2","bai":4,"tag":"noi","type":"mc","q":"Khi trình bày quy tắc trò chơi, em có thể làm gì để người nghe dễ hiểu hơn?","opts":["Dùng cử chỉ, điệu bộ mô phỏng động tác, kèm tranh ảnh, sơ đồ hoặc dụng cụ","Nói thật nhanh","Chỉ đứng im","Tránh nhìn người nghe"],"a":0,"why":"SGK (tr.96): có thể dùng cử chỉ, điệu bộ để mô phỏng động tác; chuẩn bị tranh ảnh, hình vẽ, sơ đồ, dụng cụ hoặc bản trình chiếu.","wrong":[null,"Nói nhanh khiến người nghe khó theo dõi.","Đứng im làm bài nói kém sinh động.","Cần tương tác với người nghe."]},{"id":"10a","bai":5,"tag":"tg","type":"mc","q":"“Quê nội” và “Tảng sáng” là hai phần của bộ truyện nào, của nhà văn nào?","opts":["Quê nội, của Võ Quảng","Quê hương, của Tế Hanh","Đất rừng phương Nam, của Đoàn Giỏi","Hoàng tử bé, của Ê-xu-pe-ri"],"a":0,"why":"SGK (tr.104): Võ Quảng, tác giả bài thơ Ngàn sao làm việc ở Bài 1, còn là tác giả bộ truyện Quê nội (gồm hai phần: Quê nội và Tảng sáng).","wrong":[null,"Tế Hanh là tác giả bài thơ Quê hương ở Bài 3 (tập một).","Đất rừng phương Nam là tác phẩm của Đoàn Giỏi ở Bài 1 (tập một).","Hoàng tử bé là tác phẩm của Ê-xu-pe-ri, dùng làm bài viết tham khảo."]},{"id":"10b","bai":5,"tag":"tg","type":"match","q":"Ghép cuốn sách với tác giả (các sách có đoạn trích đã học, SGK gợi ý đọc trọn vẹn).","pairs":[["Đất rừng phương Nam","Đoàn Giỏi"],["Vừa nhắm mắt vừa mở cửa sổ","Nguyễn Ngọc Thuần"],["Người thầy đầu tiên","Ai-tơ-ma-tốp"],["Nóng, Phẳng, Chật","Thô-mát L. Phrít-man"]],"why":"SGK (tr.103) gợi ý đọc trọn vẹn một số cuốn sách có đoạn trích đã học trong chương trình."},{"id":"10c","bai":5,"tag":"tg","type":"mc","q":"Văn bản “Vẻ đẹp giản dị và chân thật của Quê nội” thuộc loại nào?","opts":["Văn bản nghị luận phân tích một tác phẩm văn học (phê bình)","Truyện ngụ ngôn","Bản tường trình","Thơ bốn chữ"],"a":0,"why":"Bài của Trần Thanh Địch bàn luận, đánh giá giá trị nội dung và nghệ thuật của bộ truyện Quê nội: đó là nghị luận phân tích một tác phẩm văn học (SGK tr.104–106).","wrong":[null,"Đây không phải truyện ngụ ngôn.","Đây không phải văn bản hành chính.","Đây là văn xuôi nghị luận."]},{"id":"10d","bai":5,"tag":"tg","type":"mc","q":"Theo Tri thức ngữ văn, văn bản nghị luận phân tích một tác phẩm văn học làm gì?","opts":["Làm rõ và bàn luận về đặc điểm nội dung, hình thức của tác phẩm, khái quát giá trị chung","Kể lại toàn bộ cốt truyện không nhận xét","Giới thiệu luật chơi của trò chơi","Ghi lại một sự việc đã xảy ra"],"a":0,"why":"SGK (tr.102): người viết làm rõ và bàn luận về đặc điểm của tác phẩm trên các phương diện nội dung, hình thức trong mối quan hệ với tác giả, hoàn cảnh sáng tác, thời đại…, và khái quát giá trị chung của tác phẩm.","wrong":[null,"Chỉ kể lại cốt truyện thì chưa phải nghị luận phân tích.","Đó là văn bản thuyết minh.","Đó là văn bản tường trình."]},{"id":"10e","bai":5,"tag":"tg","type":"mc","q":"Trong văn bản nghị luận phân tích tác phẩm văn học, LÍ LẼ và BẰNG CHỨNG là gì?","opts":["Lí lẽ là ý kiến về đặc điểm nội dung, hình thức; bằng chứng là câu, đoạn, chi tiết dẫn từ tác phẩm","Lí lẽ là chi tiết trích; bằng chứng là ý kiến","Cả hai đều là tên tác giả","Cả hai đều là số liệu"],"a":0,"why":"SGK (tr.102): lí lẽ là ý kiến của người viết về đặc điểm nội dung, hình thức; bằng chứng là câu, đoạn, chi tiết dẫn từ văn bản (trích nguyên văn hoặc lược thuật, tóm tắt).","wrong":[null,"Hai khái niệm bị đảo ngược.","Không phải tên tác giả.","Không phải số liệu."]},{"id":"10f","bai":5,"tag":"tg","type":"mc","q":"Nhân vật văn học có đồng nhất với con người có thật ngoài đời không?","opts":["Không: nhân vật là sản phẩm sáng tạo, hư cấu của nhà văn, dù gợi từ con người thật","Có: luôn giống hệt người thật","Có: chỉ là bản sao","Không có liên hệ gì với đời thực"],"a":0,"why":"SGK (tr.102): nhân vật văn học là sản phẩm của sự sáng tạo, hư cấu; không đồng nhất với con người thực, nhưng con người trong đời thực là chất liệu cho nhà văn sáng tạo.","wrong":[null,"Nhân vật có hư cấu, không phải bản sao.","Không chỉ là bản sao.","Nhân vật vẫn có mối liên hệ với đời thực."]},{"id":"10g","bai":5,"tag":"tg","type":"mc","q":"Văn bản đa phương thức khác văn bản chỉ dùng ngôn ngữ ở điểm nào?","opts":["Kết hợp ngôn ngữ với phương tiện phi ngôn ngữ như hình ảnh, sơ đồ, màu sắc, hình khối","Chỉ dùng chữ","Chỉ dùng âm thanh","Chỉ có tiêu đề"],"a":0,"why":"SGK (tr.102): văn bản đa phương thức kết hợp phương tiện ngôn ngữ và phương tiện phi ngôn ngữ (hình vẽ, sơ đồ, mảng màu, hình khối…) để tăng lượng thông tin và hiệu quả tiếp nhận.","wrong":[null,"Chỉ dùng chữ là văn bản thuần ngôn ngữ.","Không chỉ có âm thanh.","Không chỉ có tiêu đề."]},{"id":"10h","bai":5,"tag":"tv","type":"sort","q":"Văn bản nào dưới đây là văn bản ĐA PHƯƠNG THỨC?","bins":["Đa phương thức (ngôn ngữ + phi ngôn ngữ)","Chỉ dùng ngôn ngữ"],"items":[["Truyện tranh có tranh vẽ và lời thoại",0],["Áp phích giới thiệu sách có hình minh hoạ và dòng chữ",0],["Sơ đồ tư duy tóm tắt bài đọc",0],["Bài văn nghị luận chỉ có chữ",1],["Bức thư tay chỉ gồm chữ",1]],"why":"Văn bản đa phương thức kết hợp chữ với hình ảnh, sơ đồ, màu sắc… (SGK tr.102)."},{"id":"10i","bai":5,"tag":"tv","type":"mc","q":"Phương tiện nào sau đây là phương tiện PHI ngôn ngữ trong văn bản?","opts":["Hình vẽ, sơ đồ, màu sắc","Từ ngữ","Câu văn","Đoạn văn"],"a":0,"why":"SGK (tr.102): phương tiện phi ngôn ngữ gồm hình vẽ, sơ đồ, các mảng màu sắc, hình khối…","wrong":[null,"Từ ngữ là phương tiện ngôn ngữ.","Câu văn là phương tiện ngôn ngữ.","Đoạn văn là phương tiện ngôn ngữ."]},{"id":"10j","bai":5,"tag":"tv","type":"mc","q":"Trong văn bản đa phương thức, vai trò của hình ảnh và ngôn ngữ thường là:","opts":["Hình ảnh là phần trọng tâm truyền đạt thông tin; ngôn ngữ hỗ trợ thêm bằng ghi chú, dẫn giải","Ngôn ngữ luôn là phần chính","Hình ảnh chỉ để trang trí","Hai phương tiện không liên quan"],"a":0,"why":"SGK (tr.102): phần trọng tâm là các kiểu hình ảnh sắp xếp để truyền đạt thông tin; ngôn ngữ là phương tiện hỗ trợ thêm như ghi chú, dẫn giải.","wrong":[null,"SGK nêu hình ảnh là trọng tâm.","Hình ảnh có vai trò truyền thông tin.","Hai phương tiện phối hợp với nhau."]},{"id":"10k","bai":5,"tag":"tg","type":"mc","q":"Khi đọc một cuốn sách để trao đổi với bạn, em cần chú ý ghi lại những vấn đề nào?","opts":["Đề tài, bố cục và nội dung chính, nhân vật – sự kiện – bối cảnh nổi bật, chi tiết quan trọng, chủ đề và bài học","Chỉ ghi giá tiền","Chỉ ghi màu bìa","Không cần ghi gì"],"a":0,"why":"SGK (tr.104): ngoài tên sách, tác giả, nhà xuất bản, năm xuất bản, cần xác định đề tài; bố cục và nội dung chính; nhân vật, sự kiện, bối cảnh; chi tiết quan trọng; chủ đề, ý nghĩa, bài học.","wrong":[null,"Giá tiền không phải nội dung chính.","Màu bìa không phải nội dung chính.","Ghi chép giúp trao đổi hiệu quả."]},{"id":"10l","bai":5,"tag":"doc","type":"mc","q":"Bối cảnh của bộ truyện “Quê nội” – “Tảng sáng” theo bài phê bình của Trần Thanh Địch là gì?","opts":["Một nông thôn miền Trung, thôn Hoà Phước bên sông Thu Bồn, những ngày mới sau Cách mạng tháng Tám","Một thành phố lớn ngày nay","Một ngôi trường ở nước ngoài","Một con tàu ngoài vũ trụ"],"a":0,"why":"SGK (tr.105): nội dung xảy ra ở một nông thôn miền Trung, thôn Hoà Phước, bên con sông Thu Bồn, vào những ngày mới sau Cách mạng tháng Tám thành công.","wrong":[null,"Truyện nói về làng quê, không phải thành phố.","Truyện không diễn ra ở nước ngoài.","Đó là bối cảnh viễn tưởng, không phải của Quê nội."],"pid":"s10a","muc":"biet"},{"id":"10m","bai":5,"tag":"doc","type":"mc","q":"Trong bài phê bình, nhân vật nào được nhắc là “nổi đình nổi đám” vì thuộc ca dao, tục ngữ dù đang học chữ?","opts":["Bà Kiến","Anh Trâu Bĩnh","Thầy Lê Tảo","Ông Hai Dĩ"],"a":0,"why":"SGK (tr.105): Cục và Cù Lao được phân công dạy chữ cho bà Kiến, hoá ra bà thạo tiếng Tây, tiếng Tàu, ca dao tục ngữ, đọc vanh vách.","wrong":[null,"Trâu Bĩnh là nhân vật thuộc tuyến nhân vật thứ ba (con vật).","Thầy Lê Tảo là một nhân vật khác trong truyện.","Ông Hai Dĩ bị chó rượt trong một chi tiết."],"pid":"s10a","muc":"biet"},{"id":"10n","bai":5,"tag":"doc","type":"mc","q":"Theo Trần Thanh Địch, truyện kể ở ngôi “tôi” có nhược điểm lớn nhất là gì?","opts":["Không nhìn được xa, không nói được nội tâm, suy nghĩ của các nhân vật khác một cách trực diện","Không có nhân vật chính","Quá nhiều nhân vật con vật","Không có cảnh vật"],"a":0,"why":"SGK (tr.105–106): vai “tôi” có thế mạnh là dẫn dắt vào suy nghĩ thầm kín, nhưng nhược điểm lớn nhất là không nhìn được xa, không nói được nội tâm, suy nghĩ của các nhân vật trực diện khác.","wrong":[null,"Nhân vật “tôi” vẫn là nhân vật chính.","Nhược điểm không phải là con vật.","Truyện có nhiều cảnh vật."],"pid":"s10a","muc":"hieu"},{"id":"10o","bai":5,"tag":"doc","type":"short","q":"Nêu MỘT chi tiết hoặc hình ảnh trong bài phê bình khiến em hiểu vì sao “Quê nội” hấp dẫn. (1–2 câu)","goi":"Gợi ý: Em ấn tượng với … vì nó cho thấy …","mau":"Em ấn tượng với cảnh đồng bào gọi nhau đi học ban đêm qua những ngọn đèn bồng bềnh từ nhà này trôi sang nhà khác, vì nó cho thấy không khí sôi động, ấm áp của làng quê những ngày mới.","y":["Nêu đúng một chi tiết có trong bài phê bình","Giải thích vì sao chi tiết đó hấp dẫn","Câu văn rõ ràng, đủ ý"],"pid":"s10a","muc":"vd"},{"id":"10p","bai":5,"tag":"doc","type":"mc","q":"Trong bài tham khảo về Hoàng tử bé, người phi công gặp cậu bé ở đâu và cậu nói câu đầu tiên là gì?","opts":["Giữa sa mạc; cậu nhờ “vẽ hộ tôi một con cừu”","Trong thành phố; cậu hỏi đường","Trên biển; cậu xin nước","Ở trường; cậu mượn sách"],"a":0,"why":"SGK (tr.113): người phi công ngủ trên cát giữa sa mạc, rồi nghe giọng nói “Xin vui lòng… vẽ hộ tôi một con cừu”.","wrong":[null,"Không phải ở thành phố.","Không phải trên biển.","Không phải ở trường."],"pid":"s10b","muc":"biet"},{"id":"10q","bai":5,"tag":"doc","type":"mc","q":"Đặc điểm nổi bật của hoàng tử bé mà người viết phân tích là gì?","opts":["Luôn cố gắng trò chuyện với tất cả để lắng nghe, thấu hiểu, chia sẻ và yêu thương","Chỉ thích ở một mình","Luôn tức giận","Sợ mọi thứ"],"a":0,"why":"SGK (tr.113–114): nhan đề bài viết là “trò chuyện để thấu hiểu và yêu thương”; hoàng tử bé không ngừng tìm những cuộc trò chuyện để lắng nghe, thì thầm, chia sẻ.","wrong":[null,"Bài viết nói cậu luôn trò chuyện.","Cậu không tức giận.","Cậu không sợ hãi."],"pid":"s10b","muc":"hieu"},{"id":"10r","bai":5,"tag":"doc","type":"mc","q":"Thái độ của hoàng tử bé với con rắn cho thấy phẩm chất gì?","opts":["Bao dung, vị tha: vẫn nói đỡ cho con rắn dù bị nọc độc","Hung hăng","Sợ hãi","Thờ ơ"],"a":0,"why":"SGK (tr.114): hoàng tử bé không chống lại nọc độc của con rắn nhưng vẫn dành cho nó những lời bào chữa bao dung nhất.","wrong":[null,"Cậu không hung hăng.","Cậu không sợ hãi.","Cậu vẫn quan tâm tới người khác."],"pid":"s10b","muc":"hieu"},{"id":"10s","bai":5,"tag":"doc","type":"mc","q":"Ý nghĩa hình tượng hoàng tử bé theo bài viết tham khảo là gì?","opts":["Nhắn nhủ về tình yêu thương, lòng vị tha và khao khát được sẻ chia, thấu hiểu","Ca ngợi sự giàu có","Khuyên con người sống một mình","Nói về cách làm phi công"],"a":0,"why":"SGK (tr.114): giọng nói của hoàng tử bé như vẫn ngân lên, thì thầm với chúng ta về tình yêu thương, lòng vị tha và niềm khao khát được sẻ chia, thấu hiểu.","wrong":[null,"Bài viết không ca ngợi của cải.","Bài viết ca ngợi sự sẻ chia.","Bài viết không bàn về nghề phi công."],"pid":"s10b","muc":"vd"},{"id":"10t","bai":5,"tag":"doc","type":"mc","q":"Đoạn văn trên phân tích đặc điểm gì của nhân vật Mi?","opts":["Giàu lòng nhân ái","Hay giận dỗi","Lười biếng","Rất giàu có"],"a":0,"why":"Câu 1 nêu nhận định: Mi là một cô bé giàu lòng nhân ái; các câu sau dẫn hành động, lời nói làm bằng chứng.","wrong":[null,"Đoạn không nhắc tới giận dỗi.","Đoạn không nói Mi lười biếng.","Đoạn không nói Mi giàu có."],"pid":"d10","muc":"biet"},{"id":"10u","bai":5,"tag":"doc","type":"evid","pid":"d10","muc":"hieu","q":"Gạch chân (chạm vào) những câu dẫn BẰNG CHỨNG từ tác phẩm (hành động, lời nói của nhân vật).","ans":[1,2],"why":"Câu 2 nêu hành động (nhường ô cho cụ già); câu 3 dẫn lời nói chân thành của Mi. Đây là bằng chứng làm rõ nhận định ở câu 1."},{"id":"10v","bai":5,"tag":"doc","type":"evid","pid":"d10","muc":"vd","q":"Gạch chân (chạm vào) câu nhận xét về NGHỆ THUẬT xây dựng nhân vật của nhà văn.","ans":[3],"why":"Câu 4 nêu cách nhà văn khắc hoạ nhân vật: bằng hành động nhỏ và lời thoại giản dị, gần gũi."},{"id":"10w","bai":5,"tag":"doc","type":"short","q":"Em hãy viết thêm MỘT câu nêu ý nghĩa của hình tượng nhân vật Mi.","goi":"Gợi ý: Qua nhân vật Mi, nhà văn muốn nhắn nhủ rằng …","mau":"Qua nhân vật Mi, nhà văn muốn nhắn nhủ rằng những việc làm nhỏ xuất phát từ tấm lòng nhân ái cũng có thể sưởi ấm cuộc sống.","y":["Nêu được ý nghĩa, thông điệp","Gắn với phẩm chất của nhân vật","Câu văn rõ ràng, đủ ý"],"pid":"d10","muc":"vd"},{"id":"10x","bai":5,"tag":"viet","type":"mc","q":"Yêu cầu của bài văn phân tích một nhân vật văn học trong cuốn sách đã đọc gồm những gì?","opts":["Giới thiệu nhân vật; chỉ ra đặc điểm qua bằng chứng; nhận xét nghệ thuật xây dựng nhân vật; nêu ý nghĩa hình tượng","Chỉ kể lại cốt truyện","Chỉ viết cảm nghĩ chung chung","Chỉ tả hình dáng bên ngoài"],"a":0,"why":"SGK (tr.112): giới thiệu nhân vật; chỉ ra đặc điểm, tính cách qua bằng chứng (ngoại hình, hành động, ngôn ngữ, tâm trạng); nhận xét nghệ thuật xây dựng nhân vật; nêu ý nghĩa của hình tượng nhân vật.","wrong":[null,"Kể lại cốt truyện chưa phải phân tích.","Cần có bằng chứng cụ thể.","Không chỉ tả hình dáng."]},{"id":"10y","bai":5,"tag":"viet","type":"order","q":"Sắp xếp dàn ý bài văn phân tích nhân vật yêu thích.","items":["Mở bài: giới thiệu nhân vật, nêu ấn tượng ban đầu","Thân bài: bối cảnh và các mối quan hệ làm nổi bật nhân vật","Thân bài: đặc điểm nổi bật qua bằng chứng (ngoại hình, ngôn ngữ, hành động, suy nghĩ)","Thân bài: nghệ thuật xây dựng nhân vật","Thân bài: ý nghĩa của hình tượng nhân vật","Kết bài: bài học, suy nghĩ, ấn tượng sâu sắc"],"why":"Dàn ý theo SGK (tr.115)."},{"id":"10z","bai":5,"tag":"viet","type":"sort","q":"Chi tiết sau thuộc phương diện nào của nhân vật Mi? (ví dụ tự đặt để luyện)","bins":["Ngoại hình","Hành động","Ngôn ngữ","Suy nghĩ, tâm trạng"],"items":[["Cô bé nhỏ nhắn, tóc buộc hai bên, đôi mắt sáng",0],["Mi chạy đến, đặt chiếc ô vào tay cụ già",1],["“Cụ cầm lấy đi ạ, cháu chạy về được mà.”",2],["Mi nghĩ thầm: “Cụ lớn tuổi, ướt mưa dễ ốm lắm.”",3]],"why":"Khi phân tích nhân vật, cần dựa vào bằng chứng thuộc nhiều phương diện: ngoại hình, hành động, ngôn ngữ, suy nghĩ (SGK tr.112)."},{"id":"10za","bai":5,"tag":"viet","type":"mc","q":"Có hai cách đưa bằng chứng vào bài phân tích nhân vật. Đó là:","opts":["Tóm tắt hoặc trích nguyên văn","Chỉ vẽ tranh","Chỉ liệt kê tên","Chỉ kể chuyện khác"],"a":0,"why":"SGK (tr.115): sử dụng các chi tiết, bằng chứng làm rõ đặc điểm nhân vật theo hai cách: tóm tắt hoặc trích nguyên văn.","wrong":[null,"Không phải cách đưa bằng chứng.","Không đủ để chứng minh.","Phải bám sát tác phẩm."]},{"id":"10zb","bai":5,"tag":"viet","type":"mc","q":"Khi chỉnh sửa bài phân tích nhân vật, em cần kiểm tra điều gì đầu tiên về thông tin?","opts":["Tên nhân vật, tên sách, tác giả và các chi tiết liên quan có chính xác không","Màu mực viết","Kiểu chữ trang trí","Số trang giấy"],"a":0,"why":"SGK (tr.115): tự kiểm tra tên nhân vật, tên sách, tác giả và các chi tiết liên quan; bằng chứng đã đủ, phù hợp chưa; lỗi chính tả, dùng từ, đặt câu, tổ chức đoạn.","wrong":[null,"Không phải trọng tâm.","Không phải trọng tâm.","Không phải trọng tâm."]},{"id":"10zc","bai":5,"tag":"viet","type":"short","q":"Viết 2–3 câu Mở bài phân tích một nhân vật em yêu thích (trong sách em đã đọc).","goi":"Gợi ý: Giới thiệu tên nhân vật, cuốn sách, tác giả → nêu ấn tượng ban đầu.","mau":"Trong cuốn “Hoàng tử bé” của nhà văn Ăng-toan đơ Xanh-tơ Ê-xu-pe-ri, nhân vật hoàng tử bé để lại trong em ấn tượng sâu sắc. Cậu bé nhỏ nhắn đến từ một tiểu hành tinh xa xôi ấy luôn trò chuyện chân thành với mọi người để thấu hiểu và yêu thương.","y":["Nêu đúng tên nhân vật, sách, tác giả","Có ấn tượng ban đầu về nhân vật","Câu văn rõ ràng, đúng chính tả"]},{"id":"10n1","bai":5,"tag":"noi","type":"mc","q":"Trong hoạt động Nói và nghe của Bài 10 (Ngày hội với sách), em có thể chọn hoạt động nào?","opts":["Giới thiệu sản phẩm sáng tạo từ sách, hoặc trình bày ý kiến về tác dụng, ý nghĩa của việc đọc sách","Chỉ ngồi nghe","Chỉ làm bài kiểm tra","Chỉ vẽ tranh không nói"],"a":0,"why":"SGK (tr.115–116): chọn một trong hai hoạt động: giới thiệu sản phẩm sáng tạo từ sách; trình bày ý kiến về tác dụng, ý nghĩa của việc đọc sách.","wrong":[null,"Cần tham gia trình bày.","Không phải hoạt động của bài.","Cần giới thiệu bằng lời."]},{"id":"10n2","bai":5,"tag":"noi","type":"mc","q":"Khi giới thiệu sản phẩm sáng tạo từ sách (truyện tranh, pô-xtơ nhân vật…), em nên làm gì?","opts":["Dùng phương tiện phi ngôn ngữ kết hợp lời giới thiệu ngắn để giải thích sinh động, hấp dẫn","Chỉ đưa sản phẩm ra, không nói","Đọc nguyên văn một đoạn dài","Nói rất nhanh"],"a":0,"why":"SGK (tr.116): có thể sử dụng phương tiện phi ngôn ngữ kết hợp lời giới thiệu, thuyết trình ngắn để giải thích về sản phẩm sao cho sinh động, hấp dẫn với người nghe.","wrong":[null,"Cần giới thiệu bằng lời.","Đọc quá dài làm nhàm chán.","Nói quá nhanh khó nghe."]}]};

let AC=null;
function beep(kind){
  if(!S.tamam||CHUP) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime; const seq = kind==='ok'?[[660,0],[880,.11],[1175,.22]]: kind==='bad'?[[220,0],[170,.12]] : [[784,0],[988,.12],[1319,.24],[1568,.36]];
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='bad'?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.2);o.connect(g).connect(AC.destination);o.start(t+d);o.stop(t+d+.22)});
  }catch(e){}
}
let CF=[];
function confetti(n=90){
  if(CHUP||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#cf'); c.width=innerWidth; c.height=innerHeight; const x=c.getContext('2d');
  const cols=['#ffc933','#d6336c','#1a73e8','#1f9d55','#7c5cff','#2ad1bd'];
  for(let i=0;i<n;i++) CF.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.4,vx:(Math.random()-.5)*9,vy:-Math.random()*10-3,r:Math.random()*6+3,c:pick(cols),a:Math.random()*6,life:0});
  (function step(){ x.clearRect(0,0,c.width,c.height); CF.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.life++;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    CF=CF.filter(p=>p.life<110&&p.y<innerHeight+20); if(CF.length) requestAnimationFrame(step); else x.clearRect(0,0,c.width,c.height); })();
}

  <button class="card st viet" data-go="luyen&bai=${n}&mode=kn"><span class="ico">🧱</span><div><h3>Xây đoạn văn</h3><p class="mut">Sắp xếp, nâng cấp câu, chọn câu hay để rèn kĩ năng viết. ${nKN} câu · ${best('viet')}</p></div></button>
  <button class="card st xv" data-go="viet&bai=${n}"><span class="ico">✍️</span><div><h3>Xưởng viết 4 trạm</h3><p class="mut">Lập dàn ý, viết bài, “máy soi” gợi ý chỉnh sửa, tự chấm.${S.vietDone[n]?' · ✅ đã hoàn thành':''}</p></div></button>`;
}

/* ---------- phiên luyện ---------- */
const RANK={biet:0,hieu:1,vd:2};
function vLuyen(q){
  const mode=q.mode||'kt', n=+q.bai||0; let items=[], title='';
  if(mode==='tong'){ items=shuf(D.cau).slice(0,15); title='Tổng ôn học kì II'; }
  else if(mode==='tag'){ items=shuf(D.cau.filter(c=>c.tag===q.tag)).slice(0,10); title='Luyện: '+TAGN[q.tag]; }
  else if(mode==='doc'){ items=D.cau.filter(c=>c.bai===n&&isDoc(c)).sort((a,b)=>(RANK[a.muc]-RANK[b.muc])||((a.type==='mc'?0:1)-(b.type==='mc'?0:1))); title='Thám tử văn bản · Bài '+n; }
  else if(mode==='kn'){ items=shuf(D.cau.filter(c=>c.bai===n&&isViet(c))); title='Xây đoạn văn · Bài '+BS(n); }
  else { items=shuf(D.cau.filter(c=>c.bai===n&&isKT(c))).slice(0,10); title='Phòng kiến thức · Bài '+BS(n); }
  sess={mode,bai:n,tag:q.tag,items,idx:0,fr:[],run:0,title};
  if(q.i!==undefined) sess.idx=Math.min(+q.i,items.length-1);
  if(q.end) { sess.fr=items.map((_,i)=>i%4===3?.5:1); sess.idx=items.length; }
  drawQ();
}
function dotsHtml(){ return '<div class="dots">'+sess.items.map((_,i)=>{const f=sess.fr[i];return `<span class="dot ${f===undefined?(i===sess.idx?'cur':''):f>=.999?'ok':f>0?'mid':'bad'}"></span>`}).join('')+'</div>'; }
function doanOf(it){return D.doan.find(x=>x.id===it.pid)}
function pBox(d,note){ if(d.sgk) return `<div class="passage sgk"><b>📖 Mở sách Ngữ văn 7, tập hai, ${esc(d.tr)}</b>\nĐọc văn bản “${esc(d.tieude)}” trong sách rồi trả lời nhé. Cần thì mở sách ra đối chiếu từng chi tiết.<small>Câu hỏi bám SGK Ngữ văn 7 (KNTT). Số trang theo bản sách cô giáo nạp; nếu sách của em lệch trang, em tìm theo tên văn bản.</small></div>`;
  return `<div class="passage"><b>${esc(d.tieude)}</b>\n${esc(d.s.join(d.tho?'\n':' '))}<small>${note}</small></div>`; }
function passageHtml(it){ if(!it.pid||it.type==='evid') return ''; const d=doanOf(it); return pBox(d,'Đoạn luyện kĩ năng do trợ lý tự viết, không trích từ SGK.'); }
function evidHtml(it){ const d=doanOf(it); return `<div class="passage"><b>${esc(d.tieude)}</b><div style="margin-top:4px">${d.s.map((t,i)=>`<button class="sent" data-act="ev" data-i="${i}">${esc(t)}</button>${d.tho?'<br>':' '}`).join('')}</div><small>Chạm vào câu để gạch chân bằng chứng. Chạm lần nữa để bỏ chọn. Đoạn do trợ lý viết, không trích từ SGK.</small></div>`; }
function drawQ(){
  if(sess.idx>=sess.items.length) return endSess();
  const it=sess.items[sess.idx];
  qs={locked:false,mis:0,sel:null,done:new Set(),next:0,ev:new Set()};
  let body='', pre='';
  if(it.type==='mc'){ qs.perm=shuf(it.opts.map((_,i)=>i)); body=`<div class="opts">${qs.perm.map(k=>`<button class="opt" data-act="mc" data-k="${k}">${esc(it.opts[k])}</button>`).join('')}</div>`; }
  else if(it.type==='match'){ qs.L=shuf(it.pairs.map((_,i)=>i)); qs.R=shuf(it.pairs.map((_,i)=>i));
    body=`<p class="mut">Chạm một ô bên trái, rồi chạm ô bên phải ghép đôi với nó.</p><div class="cols"><div class="opts">${qs.L.map(i=>`<button class="pill" data-act="mL" data-i="${i}">${esc(it.pairs[i][0])}</button>`).join('')}</div><div class="opts">${qs.R.map(i=>`<button class="pill" data-act="mR" data-i="${i}">${esc(it.pairs[i][1])}</button>`).join('')}</div></div>`; }
  else if(it.type==='sort'){ qs.pool=shuf(it.items.map((_,i)=>i));
    body=`<p class="mut">Chạm một thẻ, rồi chạm vào ô nhóm mà em cho là đúng.</p><div class="bins">${it.bins.map((b,k)=>`<div class="bin" data-act="sb" data-b="${k}" role="button" tabindex="0"><h4>${esc(b)}</h4><div class="in"></div></div>`).join('')}</div><div class="pool" id="pool">${qs.pool.map(i=>`<button class="pill" data-act="sc" data-i="${i}">${esc(it.items[i][0])}</button>`).join('')}</div>`; }
  else if(it.type==='order'){ qs.pool=shuf(it.items.map((_,i)=>i));
    body=`<p class="mut">Chạm lần lượt các thẻ theo đúng thứ tự từ trên xuống.</p><div class="slots">${it.items.map((_,i)=>`<div class="slot" id="sl${i}"><b>${i+1}</b><span></span></div>`).join('')}</div><div class="pool" id="pool">${qs.pool.map(i=>`<button class="pill" data-act="oc" data-i="${i}">${esc(it.items[i])}</button>`).join('')}</div>`; }
  else if(it.type==='evid'){ pre=evidHtml(it); body=`<div class="row"><button class="btn" id="evchk" data-act="evchk" disabled>Kiểm tra bằng chứng</button><span class="mut" id="evn">Chưa chọn câu nào</span></div>`; }
  else if(it.type==='short'){ body=`<p class="hint">${esc(it.goi||'')}</p><textarea id="sh" rows="3" placeholder="Viết câu trả lời của em ở đây…"></textarea><div class="row" style="margin-top:8px"><button class="btn vang nho" id="shshow" data-act="shshow" disabled>Xem đáp án mẫu</button><span class="hint" id="shn">Viết ít nhất 6 tiếng để mở đáp án mẫu</span></div><div id="shbox"></div>`; }
  $('#app').innerHTML = `<div class="card pop"><div class="row"><span class="tagchip t-${it.tag}">${esc(TAGN[it.tag])}</span>${it.muc?`<span class="tagchip m-${it.muc}">${MUCN[it.muc]}</span>`:''}<span class="mut">${esc(sess.title)} · Câu ${sess.idx+1}/${sess.items.length}</span></div>${dotsHtml()}${pre||passageHtml(it)}<div class="q">${esc(it.q)}</div>${body}<div id="fb"></div></div>`;
}
function record(it,frac){
  const t=S.tag[it.tag]||(S.tag[it.tag]={c:0,t:0}); t.c+=frac; t.t+=1; S.xp+=Math.round(10*frac);
  if(frac>=.999){ sess.run=(sess.run||0)+1; } else sess.run=0;
  if(sess.run>=5) badge('tham-tu');
  const d=hom(); if(S.ngay!==d){ const hq=new Date(); hq.setDate(hq.getDate()-1); const hqs=hq.getFullYear()+'-'+(hq.getMonth()+1)+'-'+hq.getDate(); S.chuoi = S.ngay===hqs? S.chuoi+1 : 1; S.ngay=d; }
  if(S.chuoi>=3) badge('chuoi3');
  save(); drawTop();
}
function badge(id){ if(S.badges[id]||DEMO) return; S.badges[id]=1; const b=BADGES.find(x=>x.id===id); confetti(60); beep('win'); toast(`${b.ic} Huy hiệu mới: <b>${esc(b.ten)}</b>`); save(); }
function toast(h){ const e=document.createElement('div'); e.style.cssText='position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:70;background:#fff;border:2px solid #ffc933;border-radius:16px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-weight:700;max-width:90vw'; e.className='pop'; e.innerHTML=h; document.body.appendChild(e); setTimeout(()=>e.remove(),3200); }
function finishItem(frac, msg){
  const it=sess.items[sess.idx]; qs.locked=true; sess.fr[sess.idx]=frac; record(it,frac);
  const good=frac>=.999; beep(good?'ok':'bad'); if(good) confetti(26);
  const last = sess.idx>=sess.items.length-1;
  $('#fb').innerHTML = `<div class="fb ${good?'good':'bad'} pop">${mascot(good?'vui':'buon',64)}<div class="bubble"><b>${good?pick(KHEN):(frac>0?'Gần đúng rồi!':pick(DONG))}</b> ${msg?esc(msg)+' ':''}${it.type==='mc'&&!good?`Đáp án đúng: <b>${esc(it.opts[it.a])}</b>. `:''}${esc(it.why||'')}<div style="margin-top:10px"><button class="btn ${good?'xanh':''}" data-act="next">${last?'Xem kết quả':'Câu tiếp theo'} ➜</button></div></div></div>`;
  $('#fb').scrollIntoView({block:'nearest',behavior:CHUP?'auto':'smooth'});
}
function endSess(){
  const n=sess.items.length, tot=sess.fr.reduce((a,b)=>a+(b||0),0), pct=n?tot/n:0;
  const pk = {kt:'kt',doc:'doc',kn:'viet'}[sess.mode]; let got=false;
  if(pk && sess.bai){ const key=pk+sess.bai; S.best[key]=Math.max(S.best[key]||0,pct); if(pct>=.7 && !pil(sess.bai)[pk]){ pil(sess.bai)[pk]=1; got=true; } checkPil(sess.bai); }
  if(sess.mode==='tong' && pct>=.8) badge('tong-on');
  save(); drawTop();
  if(pct>=.7){ confetti(120); beep('win'); }
  const r=52, C=2*Math.PI*r; const mood=pct>=.7?'vui':'buon';
  const sai = sess.items.filter((_,i)=>(sess.fr[i]||0)<.999);
  const tagBad = {}; sai.forEach(it=>tagBad[it.tag]=(tagBad[it.tag]||0)+1);
  const yeu = Object.entries(tagBad).sort((a,b)=>b[1]-a[1])[0];
  const lai = sess.mode==='tong'?'luyen&mode=tong':sess.mode==='tag'?'luyen&mode=tag&tag='+sess.tag:'luyen&bai='+sess.bai+'&mode='+sess.mode;
  $('#app').innerHTML = `<div class="card pop" style="text-align:center">${mascot(mood,96)}
  <h2>${pct>=.9?'Tuyệt vời!':pct>=.7?'Giỏi lắm!':pct>=.5?'Cố gắng tốt!':'Mình thử lại nhé!'}</h2>
  <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#e3ebf3" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${pct>=.7?'#1f9d55':pct>=.5?'#f59f00':'#d6336c'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="900" fill="#10283d">${Math.round(pct*100)}%</text></svg>
  ${pk&&sess.bai?`<div class="stars" style="margin:8px 0"><div style="width:52px">${starSvg(!!pil(sess.bai)[pk],PIL[pk].mau)}</div></div><p class="mut">${got?`Em vừa nhận sao <b>${PIL[pk].ten}</b> của Bài ${sess.bai}!`:pil(sess.bai)[pk]?`Em đã có sao ${PIL[pk].ten}. Kỉ lục: ${Math.round(S.best[pk+sess.bai]*100)}%`:`Cần đạt từ 70% để nhận sao ${PIL[pk].ten}.`}</p>`:''}
  <p>Em trả lời đúng hoàn toàn <b>${sess.fr.filter(f=>f>=.999).length}/${n}</b> câu.${yeu?` Cần luyện thêm: <span class="tagchip t-${yeu[0]}">${esc(TAGN[yeu[0]])}</span>`:''}</p>
  <div class="row" style="justify-content:center">
   <button class="btn vang" data-go="${lai}">Làm lại 🔁</button>
   ${yeu?`<button class="btn phu" data-go="luyen&mode=tag&tag=${yeu[0]}">Luyện đúng chỗ yếu</button>`:''}
   <button class="btn phu" data-go="${sess.bai?'chang&bai='+sess.bai:'ban-do'}">Về chặng</button></div></div>`;
}
function checkPil(n){ const s=sao(n); if(s>=1) badge('chang'+n); if(s>=3) badge('sao-vang'); if(D.bai.filter(b=>(S.pil[b.n]||{}).doc).length>=3) badge('doc-gia'); }

/* ---------- bấm trong câu hỏi ---------- */
function actMc(k){
  if(qs.locked) return; const it=sess.items[sess.idx]; const ok = k===it.a;
  $$('.opt').forEach(b=>{const kk=+b.dataset.k; b.disabled=true; if(kk===it.a) b.classList.add('ok'); else if(kk===k) b.classList.add('bad')});
  if(!ok) $$('.opt').find(b=>+b.dataset.k===k).classList.add('shake');
  finishItem(ok?1:0, ok?'':(it.wrong&&it.wrong[k])||'');
}
function actML(i){ if(qs.locked||qs.done.has(i)) return; qs.sel=i; $$('[data-act=mL]').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i)); }
function actMR(i){ if(qs.locked||qs.done.has(i)) return; const it=sess.items[sess.idx]; const bR=$$('[data-act=mR]').find(b=>+b.dataset.i===i);
  if(qs.sel===null){ bR.classList.add('shake'); setTimeout(()=>bR.classList.remove('shake'),400); return; }
  const bL=$$('[data-act=mL]').find(b=>+b.dataset.i===qs.sel);
  if(qs.sel===i){ qs.done.add(i); bL.classList.remove('sel'); bL.classList.add('ok'); bR.classList.add('ok'); beep('ok'); qs.sel=null;
    if(qs.done.size===it.pairs.length) finishItem(Math.max(0,1-qs.mis/it.pairs.length), qs.mis?`Em ghép nhầm ${qs.mis} lần.`:''); }
  else { qs.mis++; beep('bad'); [bL,bR].forEach(b=>{b.classList.add('bad','shake')}); setTimeout(()=>[bL,bR].forEach(b=>b.classList.remove('bad','shake')),500); bL.classList.remove('sel'); qs.sel=null; }
}
function actSC(i){ if(qs.locked) return; qs.sel=i; $$('[data-act=sc]').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i)); $$('.bin').forEach(b=>b.classList.add('hot')); }
function actSB(bi){ if(qs.locked) return; if(qs.sel===null){ toast('Chạm một thẻ ở dưới trước nhé'); return; }
  const it=sess.items[sess.idx]; const chip=$$('[data-act=sc]').find(b=>+b.dataset.i===qs.sel); const binEl=$$('.bin').find(b=>+b.dataset.b===bi);
  if(it.items[qs.sel][1]===bi){ const s=document.createElement('span'); s.className='chip2 pop'; s.textContent=it.items[qs.sel][0]; $('.in',binEl).appendChild(s); chip.remove(); qs.sel=null; beep('ok'); $$('.bin').forEach(b=>b.classList.remove('hot'));
    if(!$$('[data-act=sc]').length) finishItem(Math.max(0,1-qs.mis/it.items.length), qs.mis?`Em xếp nhầm ${qs.mis} lần.`:''); }
  else { qs.mis++; beep('bad'); binEl.classList.add('bad','shake'); chip.classList.add('bad','shake'); setTimeout(()=>{binEl.classList.remove('bad','shake'); chip.classList.remove('bad','shake')},500); }
}
function actOC(i){ if(qs.locked) return; const it=sess.items[sess.idx]; const chip=$$('[data-act=oc]').find(b=>+b.dataset.i===i);
  if(i===qs.next){ const sl=$('#sl'+i); sl.classList.add('fill','pop'); $('span',sl).textContent=it.items[i]; chip.remove(); qs.next++; beep('ok');
    if(qs.next===it.items.length) finishItem(Math.max(0,1-qs.mis/it.items.length), qs.mis?`Em chọn nhầm thứ tự ${qs.mis} lần.`:''); }
  else { qs.mis++; beep('bad'); chip.classList.add('bad','shake'); setTimeout(()=>chip.classList.remove('bad','shake'),500); }
}
function actEv(i){ if(qs.locked) return; if(qs.ev.has(i)) qs.ev.delete(i); else qs.ev.add(i);
  $$('.sent').forEach(b=>b.classList.toggle('on',qs.ev.has(+b.dataset.i))); $('#evchk').disabled=!qs.ev.size; $('#evn').textContent=qs.ev.size?`Đã chọn ${qs.ev.size} câu`:'Chưa chọn câu nào'; }
function actEvChk(){ if(qs.locked||!qs.ev.size) return; const it=sess.items[sess.idx]; const ans=new Set(it.ans); let inter=0, thua=0;
  const uni=new Set([...ans,...qs.ev]);
  $$('.sent').forEach(b=>{const i=+b.dataset.i; b.classList.remove('on'); if(ans.has(i)&&qs.ev.has(i)){b.classList.add('ok');inter++} else if(qs.ev.has(i)){b.classList.add('bad');thua++} else if(ans.has(i)) b.classList.add('miss'); b.disabled=true});
  $('#evchk').disabled=true;
  finishItem(inter/uni.size, inter===ans.size&&!thua?'':`Em tìm đúng ${inter}/${ans.size} câu bằng chứng${thua?`, chọn thừa ${thua} câu`:''} (ô viền xanh là câu còn thiếu).`); }
function actShShow(){ const it=sess.items[sess.idx]; const ta=$('#sh'); ta.readOnly=true; $('#shshow').disabled=true;
  $('#shbox').innerHTML=`<div class="mau"><b>Đáp án mẫu</b> (em đối chiếu rồi sửa lại bài của mình nhé):<br>${esc(it.mau)}</div><div class="ychk"><b>Tự chấm: bài của em đã có những ý nào?</b>${it.y.map((t,i)=>`<label><input type="checkbox" data-yc="${i}"><span>${esc(t)}</span></label>`).join('')}</div><button class="btn xanh" data-act="shdone" style="margin-top:8px">Em chấm xong rồi ✔</button><p class="hint">Hãy chấm trung thực. Mực Nhí tin em!</p>`; }
function actShDone(){ if(qs.locked) return; const it=sess.items[sess.idx]; const k=$$('[data-yc]:checked').length; $$('[data-yc]').forEach(c=>c.disabled=true); $('[data-act=shdone]').remove();
  finishItem(k/it.y.length, `Em tự chấm được ${k}/${it.y.length} ý.`); }

/* ---------- Xưởng viết ---------- */
const NOI=['trước hết','đầu tiên','sau đó','tiếp theo','sau cùng','cuối cùng','vì vậy','do đó','bên cạnh đó','ngoài ra','tuy nhiên','nhưng','đồng thời','hơn nữa','như vậy','thế rồi','mở đầu','kết thúc'];

 4:{tk:'Xem bài tham khảo “Chơi chuyền” trong SGK (tr.91–93).',

 5:{tk:'Xem bài tham khảo “Hoàng tử bé: trò chuyện để thấu hiểu và yêu thương” trong SGK (tr.113–114).',

function chips(arr){ return `<div class="gchips">${arr.map(x=>`<button type="button" class="chip" data-act="chen" data-t="${esc(x)}">➕ ${esc(x)}</button>`).join('')}</div>`; }
function goiHtml(n,t){ const G=GOI[n]; if(!G) return ''; const tr=D.bai[n-1].trviet||'';
  if(t===0) return `<div class="card goi"><h3>🧭 Các bước làm theo sách <small>(SGK ${esc(tr)})</small></h3><ol>${G.buoc.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="hint">${esc(G.tk)}</p></div>`;
  if(t===1) return `<div class="card goi"><h3>💡 Gợi ý để em bắt đầu</h3><p class="hint">Mẫu để em bắt chước cách nghĩ, đừng chép nguyên. Bấm vào câu mở bên dưới để chèn vào ô em đang viết.</p><table>${G.mau.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table><b style="display:block;margin-top:10px">Câu mở gợi ý</b>${chips(G.mo)}</div>`;
  if(t===2) return `<div class="card goi"><h3>🔗 Gợi ý khi viết</h3><b>Câu mở gợi ý</b>${chips(G.mo)}<b>Từ nối giữa các ý</b>${chips(G.noi)}${G.van?`<b>Cặp vần để thử (thơ)</b>${chips(G.van)}`:''}<b>⚠️ Bài này hay sai ở chỗ</b><ul>${G.loi.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  return `<div class="card goi"><h3>⚠️ Soát nhanh những lỗi hay gặp</h3><ul>${G.loi.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; }
const TRAM=['Chuẩn bị','Tìm ý','Viết','Chỉnh sửa'];
const LOI=['Em đã đọc lại bài thành tiếng','Đầu câu viết hoa, cuối câu có dấu','Không lặp một từ nhiều lần liền nhau','Đã soát chính tả (s/x, ch/tr, d/gi, l/n…)','Có câu mở đầu và câu kết rõ ràng'];
function curN(){const r=$('#vietroot'); return r? +r.dataset.n : 0}
function vViet(q){
  const n=+q.bai||1, V=VIET[n], b=D.bai[n-1]; const st=S.viet[n]||(S.viet[n]={f:{},txt:'',r:[0,0,0,0],poem:'',dv:4,tram:0,c:[0,0,0,0,0]});
  if(q.tram!==undefined) st.tram=+q.tram;
  const t=st.tram||0; let body='';
  if(t===0){
    body=`<div class="card"><h3>🎯 Đề bài</h3><p>${esc(V.yc)}</p><h3>📌 Em cần nhớ</h3><ul style="margin:0;padding-left:22px">${V.tip.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="card"><h3>🧱 Khung bài viết</h3><div class="khung">${V.khung.map(k=>`<div style="background:${k[2]}">${esc(k[0])}${k[1]?`<small>${esc(k[1])}</small>`:''}</div>`).join('')}</div></div>`;
  } else if(t===1){
    body=`<div class="card"><h3>💡 Tìm ý, lập dàn ý</h3><p class="hint">Điền vào từng ô. Viết ngắn gọn, ý chính thôi. ⚠️ Nội dung lưu trong máy này, đừng ghi họ tên thật, số điện thoại hay địa chỉ nhà.</p>
    ${V.f.map(([id,lb,h])=>`<label class="f" for="f_${id}">${esc(lb)}</label>${V.ta.includes(id)?`<textarea id="f_${id}" rows="2" data-f="${id}" placeholder="${esc(h)}">${esc(st.f[id]||'')}</textarea>`:`<input type="text" id="f_${id}" data-f="${id}" placeholder="${esc(h)}" value="${esc(st.f[id]||'')}">`}`).join('')}
    ${V.compose?`<div class="row" style="margin-top:12px"><button class="btn vang nho" data-act="ghep">⚙️ Ghép thành bản nháp</button><span class="hint">Mực Nhí ghép các ô thành bản nháp để em chuyển sang trạm Viết.</span></div>`:''}</div>`;
  } else if(t===2){
    let extra='';
    if(V.poem) extra=`<div class="card"><h3>🌱 Xưởng thơ</h3><div class="tabs row" id="dvtabs"><button class="btn nho ${st.dv===4?'':'phu'}" data-act="dv" data-v="4">Thơ bốn chữ</button><button class="btn nho ${st.dv===5?'':'phu'}" data-act="dv" data-v="5">Thơ năm chữ</button></div>
      <textarea id="poem" rows="6" placeholder="Viết mỗi dòng thơ trên một dòng…" style="margin-top:10px">${esc(st.poem)}</textarea><div id="pcount"></div><p class="hint">Thử gieo vần ở cuối dòng 2 và dòng 4 nhé! Máy đếm số tiếng mỗi dòng giúp em.</p></div>`;
    if(V.tt) body=`<div class="card"><h3>📄 Bản tường trình của em</h3><div class="paper" id="paper"></div><p class="hint">Bản này tự ghép từ các ô ở trạm Tìm ý. Muốn sửa thì quay lại trạm 2.</p></div><div class="card soi" id="soi"></div>`;
    else body=`${extra}<div class="card"><h3>✍️ Bài của em</h3><textarea id="txt" rows="9" placeholder="Viết hoặc chỉnh sửa bản nháp ở đây…">${esc(st.txt)}</textarea><p class="hint">Gợi ý độ dài: ${V.min}–${V.max} tiếng.</p></div><div class="card soi" id="soi"></div>`;
  } else {
    body=`<div class="card rub"><h3>✅ Tự chấm theo tiêu chí</h3>${V.rub.map((x,i)=>`<label><input type="checkbox" data-r="${i}" ${st.r[i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}<p class="hint" id="rmsg"></p></div>
    <div class="card rub"><h3>🔧 Soát lỗi hay gặp</h3>${LOI.map((x,i)=>`<label><input type="checkbox" data-c="${i}" ${st.c[i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div>
    <div class="card"><div class="row"><button class="btn xanh nho" data-act="copy">📋 Sao chép bài</button><button class="btn phu nho" data-act="txt">⬇️ Tải về (.txt)</button><button class="btn phu nho" data-go="chang&bai=${n}">Về chặng</button></div></div>`;
  }
  { const gh=goiHtml(n,t); body = (t===1? gh+body : body+gh); }
  $('#app').innerHTML = `<div id="vietroot" data-n="${n}"><div class="card"><div class="row"><span class="tagchip t-viet">Xưởng viết</span><span class="mut">Bài ${BS(n)}: ${esc(b.ten)}</span></div><h2 style="margin-top:8px">${esc(b.viet)}</h2>
  <div class="steps" style="margin:12px 0 0">${TRAM.map((x,i)=>`<button data-act="tram" data-t="${i}" class="${i===t?'on':''} ${i<t?'done':''}"><b>${i<t?'✓':i+1}</b>${x}</button>`).join('')}</div></div>
  ${body}
  <div class="row" style="justify-content:space-between;margin-bottom:16px"><button class="btn phu nho" data-act="tram" data-t="${Math.max(0,t-1)}" ${t===0?'disabled':''}>⬅ Trạm trước</button><button class="btn nho" data-act="tram" data-t="${Math.min(3,t+1)}" ${t===3?'disabled':''}>Trạm sau ➜</button></div></div>`;
  updViet(n);
}
function vietText(n){ const V=VIET[n], st=S.viet[n];
  if(V.tt){ const f=st.f; return `CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM\nĐộc lập – Tự do – Hạnh phúc\n\n${f.dd||'……'}, ${f.nt||'ngày … tháng … năm …'}\n\nBẢN TƯỜNG TRÌNH\n\nKính gửi: ${f.kg||'……'}\n\nEm tên là: ${f.nguoi||'……'}\nXin tường trình sự việc như sau:\n${f.sv||'……'}\n\nNguyên nhân và trách nhiệm: ${f.nn||'……'}\n${f.dn?'\nĐề nghị: '+f.dn+'\n':''}\nEm xin cam đoan những điều trên là đúng sự thật.\n\nNgười tường trình\n(Kí và ghi rõ họ tên)`; }
  return (V.poem && st.poem? 'THƠ CỦA EM\n'+st.poem+'\n\n':'') + (st.txt||''); }
function soi(txt,V,n){
  const t=txt.trim(); if(!t) return null;
  const sents=t.replace(/([.!?…]+)\s+/g,'$1\u0001').split(/\u0001|\n+/).map(x=>x.trim()).filter(Boolean);
  const toks=t.split(/\s+/).filter(Boolean); const nW=toks.length;
  const lens=sents.map(s=>s.split(/\s+/).length); const avg=Math.round(lens.reduce((a,b)=>a+b,0)/lens.length); const mx=Math.max(...lens);
  const low=' '+t.toLowerCase().replace(/[“”"(),;:.!?…]/g,' ').replace(/\s+/g,' ')+' ';
  const noi=NOI.filter(w=>low.includes(' '+w+' '));
  const fr={}; low.trim().split(' ').forEach(w=>{ if(w.length>=2&&!STOP.has(w)) fr[w]=(fr[w]||0)+1 });
  const lap=Object.entries(fr).filter(([w,c])=>c>=4).sort((a,b)=>b[1]-a[1])[0];
  const thap=sents.filter(s=>{const c=s.replace(/^[“"\-–\s]+/,'')[0]; return c&&c!==c.toLocaleUpperCase('vi')}).length;
  const tips=[];
  tips.push(nW<V.min?{k:'warn',t:`📏 Mới ${nW} tiếng, gợi ý từ ${V.min} tiếng. Thử thêm ý hoặc dẫn chứng.`}: nW>V.max?{k:'warn',t:`📏 Đã ${nW} tiếng, hơi dài so với gợi ý (${V.min}–${V.max}). Thử bỏ ý phụ.`}:{k:'ok',t:`✅ Độ dài ${nW} tiếng, phù hợp gợi ý (${V.min}–${V.max}).`});
  tips.push(mx>35?{k:'warn',t:`✂️ Có câu dài ${mx} tiếng, thử tách thành hai câu cho dễ đọc.`}:{k:'ok',t:`✅ Câu dài vừa phải (trung bình ${avg} tiếng).`});
  tips.push(noi.length>=2?{k:'ok',t:`✅ Có từ nối: ${noi.slice(0,4).join(', ')}.`}:{k:'warn',t:'🔗 Thử thêm từ nối (trước hết, sau đó, bên cạnh đó, cuối cùng…) để các ý liền mạch.'});
  tips.push(lap?{k:'warn',t:`🔁 Từ “${lap[0]}” xuất hiện ${lap[1]} lần. Thử thay bằng từ khác.`}:{k:'ok',t:'✅ Chưa thấy từ nào lặp quá nhiều.'});
  if(thap) tips.push({k:'warn',t:`🔤 Có ${thap} câu chưa viết hoa chữ cái đầu.`});
  if(!/[.!?…”"]$/.test(t)) tips.push({k:'warn',t:'🔚 Cuối bài chưa có dấu chấm câu.'});
  if(V.chk.includes('hinh')) tips.push(/(^|\s)(như|tựa|giống như|chẳng khác gì)(\s|$)/i.test(t)?{k:'ok',t:'✅ Có hình ảnh so sánh (như, tựa…).'}:{k:'i',t:'🎨 Chưa thấy so sánh “như/tựa”. Thử thêm một hình ảnh cho câu văn sinh động.'});
  if(V.chk.includes('camxuc')) tips.push(/(yêu|thương|nhớ|xúc động|tự hào|biết ơn|bồi hồi|nao nao|ấm áp|vui|buồn|xao xuyến)/i.test(t)?{k:'ok',t:'✅ Có từ ngữ bộc lộ cảm xúc.'}:{k:'warn',t:'💗 Chưa thấy từ chỉ cảm xúc (yêu thương, nhớ, xúc động, tự hào…).'});
  if(V.chk.includes('trich')) tips.push(/[“"]/.test(t)?{k:'ok',t:'✅ Có trích dẫn trong dấu ngoặc kép.'}:{k:'i',t:'📌 Thử trích một chi tiết trong “dấu ngoặc kép” làm dẫn chứng.'});
  const EXTRA={
   tanthanh:[/(tán thành|đồng tình|đồng ý|hoàn toàn có lí|hoàn toàn đúng)/i,'✅ Có câu nói rõ thái độ tán thành.','🙋 Chưa thấy câu nêu rõ em tán thành (VD: “Em hoàn toàn tán thành ý kiến này”).'],
   phandoi:[/(không đồng tình|phản đối|không tán thành|không thể chấp nhận|khó chấp nhận|không đúng)/i,'✅ Có câu nói rõ thái độ phản đối.','🙋 Chưa thấy câu nêu rõ em phản đối (VD: “Em không đồng tình với quan niệm này”).'],
   lile:[/(vì|bởi|do đó|vì vậy|cho nên)/i,'✅ Có từ ngữ nêu lí lẽ (vì, bởi, do đó…).','🧠 Thử thêm lí lẽ: vì sao em nghĩ vậy? (dùng vì, bởi vì, do đó…).'],

  <div class="card"><h3>Mẹo nhỏ</h3><ul class="mut" style="margin:0;padding-left:20px"><li>Học đều mỗi ngày thì chuỗi lửa 🔥 sẽ dài hơn.</li><li>Đọc kĩ lời giải của Mực Nhí, đó là cách nhớ lâu nhất.</li><li>Rủ bạn vào <b>Đấu đôi</b> để ôn mà vẫn vui.</li><li>Bài viết và kết quả chỉ lưu trên máy này, nhớ <b>Xuất kết quả</b> gửi cô nhé.</li></ul>
  <div class="row" style="margin-top:12px"><button class="btn vang" data-go="ban-do">Bắt đầu học!</button></div></div>`;
}

/* ---------- sự kiện chung ---------- */
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-act]'); const g=e.target.closest('[data-go]');
  if(a){ const act=a.dataset.act; const A={
    am:()=>{S.tamam=!S.tamam;save();drawTop()},
    luuma:()=>{const v=($('#ma').value||'').trim().replace(/[<>]/g,''); if(!v){$('#ma').classList.add('shake');return} S.ma=v; save(); mo(''); if(!S.tour){S.tour=true;save();go('huong-dan')} else route(); },
    mc:()=>actMc(+a.dataset.k), mL:()=>actML(+a.dataset.i), mR:()=>actMR(+a.dataset.i), sc:()=>actSC(+a.dataset.i), sb:()=>actSB(+a.dataset.b), oc:()=>actOC(+a.dataset.i),
    ev:()=>actEv(+a.dataset.i), evchk:actEvChk, shshow:actShShow, shdone:actShDone,
    next:()=>{sess.idx++; drawQ(); window.scrollTo(0,0)},
    tram:()=>{const n=curN(); S.viet[n].tram=+a.dataset.t; save(); vViet({bai:n}); window.scrollTo(0,0)},
    chen:()=>{ let el=window._lf; if(!el||!document.body.contains(el)) el=$('#txt')||$('#poem')||$('textarea'); if(!el) return; const tx=a.dataset.t; const p0=el.selectionStart==null?el.value.length:el.selectionStart, p1=el.selectionEnd==null?p0:el.selectionEnd; const pre=el.value.slice(0,p0), post=el.value.slice(p1); const sep=(pre&&!/[\s]$/.test(pre))?' ':''; el.value=pre+sep+tx+' '+post; const pos=(pre+sep+tx+' ').length; el.focus(); try{el.setSelectionRange(pos,pos)}catch(_){} el.dispatchEvent(new Event('input',{bubbles:true})); },
    ghep:()=>{const n=curN(); const st=S.viet[n]; const t=VIET[n].compose(st.f); if(st.txt && st.txt.trim() && st.txt.trim()!==t.trim() && !confirm('Bản nháp mới sẽ thay thế bài đang viết. Em đồng ý không?')) return; st.txt=t; st.tram=2; save(); vViet({bai:n}); toast('Đã ghép xong. Em hãy sửa lại bằng lời của mình nhé!')},
    dv:()=>{const n=curN(); S.viet[n].dv=+a.dataset.v; save(); vViet({bai:n})},
    copy:()=>{const n=curN(); const t=vietText(n); (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Đã sao chép!')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép!')}catch(_){toast('Em hãy bôi đen và sao chép thủ công nhé')}ta.remove()})},
    txt:()=>{const n=curN(); taiFile('Van7_Bai'+n+'_'+(S.ma||'HS')+'.txt',vietText(n),'text/plain')},
    batdau:()=>{ const pool=D.cau.filter(c=>c.type==='mc'); const n=+$('#dn').value; duel={n:[($('#p1').value||'Người 1').trim(),($('#p2').value||'Người 2').trim()],items:shuf(pool).slice(0,n),idx:0,sc:[0,0],turn:0,done:false}; vDoi(); },
    dk:()=>actDk(+a.dataset.k), dnext:()=>{duel.idx++; duel.turn=1-duel.turn; drawDuel(); window.scrollTo(0,0)}, doilai:()=>{duel=null; vDoi()},
    xjson:()=>taiFile('Van7_KetQua_'+(S.ma||'HS')+'.json',JSON.stringify(exportObj(),null,1)),
    doima:()=>{S.ma=''; save(); askMa()},
    xoa:()=>{ if(confirm('Xoá toàn bộ kết quả trên máy này?')){ try{localStorage.removeItem(KEY)}catch(_){} S=mac(); route() } },
    motat:()=>{S.moTat=!S.moTat;save();vLop()},
    xcsv:()=>{ const head=['ma','xp','sao_tong',...TAGK.map(k=>TAGN[k])]; const rows=LOP.map(o=>[o.ma,o.xp,Object.values(o.stars||{}).reduce((x,y)=>x+y,0),...TAGK.map(k=>{const t=(o.tag||{})[k];return t&&t.t?pc(t.c,t.t):''})]); taiFile('Van7_KetQua_Lop.csv','﻿'+[head,...rows].map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv') }
  }; if(A[act]) { A[act](); return; } }
  if(g){ if(g.dataset.lock==='1'){ toast('🔒 Hãy được ít nhất 1 sao ở chặng trước nhé!'); beep('bad'); return; } if(!g.dataset.go) return; go(g.dataset.go); }
});
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('.bin,.node')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter' && e.target.id==='ma'){ $('[data-act=luuma]').click(); } });
document.addEventListener('focusin', e=>{ const t=e.target; if(t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type==='text'))&&t.closest&&t.closest('#vietroot')) window._lf=t; });
document.addEventListener('input', e=>{ const t=e.target;
  if(t.id==='sh'){ const w=t.value.trim().split(/\s+/).filter(Boolean).length; const b=$('#shshow'); if(b) b.disabled=w<6; const nn=$('#shn'); if(nn) nn.textContent=w<6?`Mới ${w} tiếng, viết ít nhất 6 tiếng để mở đáp án mẫu`:`${w} tiếng. Em có thể xem đáp án mẫu rồi!`; return; }
  const n=curN(); if(!n) return; const st=S.viet[n];
  if(t.dataset.f){ st.f[t.dataset.f]=t.value; updViet(n); } else if(t.id==='txt'){ st.txt=t.value; updViet(n); } else if(t.id==='poem'){ st.poem=t.value; updViet(n); } });
document.addEventListener('change', e=>{ const t=e.target; const n=curN();
  if(n && t.dataset.r!==undefined){ S.viet[n].r[+t.dataset.r]=t.checked?1:0; updViet(n); }
  if(n && t.dataset.c!==undefined){ S.viet[n].c[+t.dataset.c]=t.checked?1:0; save(); }
  if(t.id==='imp'){ const f=t.files[0]; if(!f) return; f.text().then(x=>{ try{ const o=JSON.parse(x); if(o.app!=='van7-hk2') throw 0; S.ma=o.ma||S.ma; S.xp=o.xp||0; S.chuoi=o.chuoi||0; S.pil=o.pil||{}; S.best=o.best||{}; S.tag=o.tag||{}; S.badges={}; (o.badges||[]).forEach(b=>S.badges[b]=1); S.vietDone={}; (o.vietDone||[]).forEach(b=>S.vietDone[b]=1); save(); route(); toast('Đã nhập kết quả!') }catch(_){ toast('File này không đúng định dạng.') } }); }
  if(t.id==='gop'){ LOP=[]; Promise.all([...t.files].map(f=>f.text().then(x=>{try{const o=JSON.parse(x); if(o.app==='van7-hk2') LOP.push(o)}catch(_){}}))).then(drawBang); } });

route();
</script>
