<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Văn 7 cùng em</title>
<meta name="description" content="Ôn luyện Ngữ văn 7 (Kết nối tri thức) học kì I: đọc hiểu, viết văn, đấu cặp đôi và huy hiệu cùng Mực Nhí.">
<meta name="theme-color" content="#0b8f7a">
<meta property="og:title" content="Văn 7 cùng em">
<meta property="og:description" content="Học Văn vui hơn: thám tử văn bản, xưởng viết và đấu cặp đôi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 12C50 12 15 52 15 74a35 35 0 0 0 70 0C85 52 50 12 50 12z' fill='%231a73e8'/%3E%3Cpath d='M52 14C70 2 86 4 92 8 84 12 80 20 68 24 62 26 56 22 52 14z' fill='%23ffc933'/%3E%3C/svg%3E">
<style>
/* ✅ BẢN NHÁP — thầy/cô duyệt trước khi dùng. Một file, không cần mạng, không thư viện ngoài. */
:root{
  --nen1:#e3faf1;--nen2:#fff1da;--nen3:#e2eeff;
  --chu:#10283d;--chu2:#47607a;--mat:#fff;--vien:#d3e3ee;
  --muc:#0a756f;--muc2:#0f9a8d;--muc-d:#065753;
  --sky:#1a73e8;--tim:#6f42c1;--vang:#ffc933;--vang-d:#b87900;
  --dung:#1f9d55;--dung-n:#ddf7e8;--sai:#d6336c;--sai-n:#ffe3ee;
  --tg:#6f42c1;--tg-n:#ece5fd;--doc:#1a65c8;--doc-n:#dfeaff;--tv:#b45309;--tv-n:#ffefd2;--viet:#15803d;--viet-n:#dcf5e5;--noi:#be185d;--noi-n:#ffe2ee;
  --kt:#7c5cff;--r:22px;--bong:0 10px 28px rgba(11,95,120,.14),0 2px 6px rgba(16,40,61,.08);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--chu);font-size:17px;line-height:1.5;background:
  radial-gradient(700px 420px at 0% -4%,var(--nen1),transparent 62%),
  radial-gradient(700px 420px at 100% 6%,var(--nen2),transparent 62%),
  radial-gradient(900px 500px at 50% 110%,var(--nen3),transparent 60%),#fbfffe;background-attachment:fixed;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--vang);outline-offset:2px}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--vien)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;border:0;background:none;padding:0}
.logo span{white-space:nowrap;background:linear-gradient(90deg,#0a8f80,#1a73e8 60%,#6f42c1);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;background:#fff;border:1px solid var(--vien)}
.chip.xp{background:linear-gradient(90deg,#fff3bf,#ffe3b3);border-color:#ffd27a;color:#7a4a00}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--vien);background:#fff;display:grid;place-items:center}
main{max-width:780px;margin:0 auto;padding:16px}
.card{background:var(--mat);border:1px solid var(--vien);border-radius:var(--r);box-shadow:var(--bong);padding:18px;margin-bottom:16px}
h1,h2,h3{line-height:1.25;margin:0 0 8px}
h1{font-size:26px}h2{font-size:22px}h3{font-size:18px}
.mut{color:var(--chu2);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:16px;border:0;font-weight:800;color:#fff;background:linear-gradient(180deg,#0f9a8d,#0a756f);box-shadow:0 4px 0 var(--muc-d),0 8px 16px rgba(10,117,111,.25);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--muc-d)}
.btn.vang{background:linear-gradient(180deg,#ffe066,#ffc233);color:#4b3200;box-shadow:0 4px 0 var(--vang-d),0 8px 16px rgba(255,194,51,.35)}
.btn.xanh{background:linear-gradient(180deg,#2fbf71,#1f9d55);box-shadow:0 4px 0 #14703c,0 8px 16px rgba(31,157,85,.25)}
.btn.sky{background:linear-gradient(180deg,#4d9bff,#1a65c8);box-shadow:0 4px 0 #124b94,0 8px 16px rgba(26,101,200,.25)}
.btn.phu{background:#fff;color:var(--muc);border:2px solid var(--muc2);box-shadow:none}
.btn.nho{min-height:40px;padding:6px 14px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tagchip{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px}
.t-tg{background:var(--tg-n);color:var(--tg)}.t-doc{background:var(--doc-n);color:var(--doc)}.t-tv{background:var(--tv-n);color:var(--tv)}.t-viet{background:var(--viet-n);color:var(--viet)}.t-noi{background:var(--noi-n);color:var(--noi)}
.m-biet{background:#e8eef5;color:#385068}.m-hieu{background:#fff0c2;color:#7a5300}.m-vd{background:#ffd9e6;color:#9d1b50}
.draft{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:15;text-align:center;font-size:12.5px;color:#7a4a00;background:#fff3bf;border-top:1px solid #ffe066;padding:3px 8px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--vien)}
#nav button{flex:1;max-width:150px;min-height:54px;border:0;background:none;border-radius:14px;font-size:13px;font-weight:700;color:var(--chu2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#nav button.on{background:#d9f5ef;color:var(--muc)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;color:#fff;padding:22px 20px;margin-bottom:16px;background:linear-gradient(135deg,#0b8f7a 0%,#1a73e8 58%,#6f42c1 100%);box-shadow:0 14px 34px rgba(26,115,232,.28)}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%)}
.hero:after{content:"";position:absolute;left:-40px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,51,.35),transparent 68%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:30px;margin:0 0 4px}
.hero p{margin:0 0 12px;opacity:.95}
.hero .pil{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.hero .pil span{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.hero-row{display:flex;gap:14px;align-items:center}
.mapwrap{position:relative;margin:0 auto;max-width:470px;background:linear-gradient(180deg,#d9f1ff,#e6fbef 52%,#fff1da);overflow:hidden}
.mapwrap svg{width:100%;height:auto;display:block}
.node{cursor:pointer}.node:hover .nd{transform:translateY(-3px)}
.nd{transition:transform .15s}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.bubble{position:relative;background:#fff;border:2px solid var(--vien);border-radius:18px;padding:10px 14px;font-weight:600;box-shadow:var(--bong)}
.bubble:before{content:"";position:absolute;left:-10px;top:22px;border:8px solid transparent;border-right-color:var(--vien);border-left:0}
.hello{display:flex;gap:12px;align-items:center;margin-bottom:12px}
/* trạm */
.st{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;border-left-width:8px}
.st .ico{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px}
.st h3{margin:0 0 2px}.st p{margin:0}
.st.doc{border-left-color:var(--doc)}.st.doc .ico{background:var(--doc-n)}
.st.kt{border-left-color:var(--kt)}.st.kt .ico{background:var(--tg-n)}
.st.viet{border-left-color:#22b573}.st.viet .ico{background:var(--viet-n)}
.st.xv{border-left-color:#f59f00}.st.xv .ico{background:#fff0c2}
.pilrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pilbox{border-radius:16px;padding:8px;text-align:center;font-weight:800;font-size:13px;border:2px solid transparent}
.pilbox svg{width:34px;height:34px;display:block;margin:0 auto 2px}
details.bk{background:#f4fbf9;border:2px dashed #9fd9cf;border-radius:16px;padding:10px 14px;margin-bottom:10px}
details.bk summary{font-weight:800;cursor:pointer;min-height:32px}
details.bk ol,details.bk ul{margin:8px 0 0;padding-left:22px}
/* câu hỏi */
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:14px;height:14px;border-radius:50%;background:#dfe9f2;border:2px solid #fff;box-shadow:0 0 0 1px var(--vien)}
.dot.ok{background:var(--dung)}.dot.mid{background:#f59f00}.dot.bad{background:var(--sai)}.dot.cur{box-shadow:0 0 0 3px var(--muc2)}
.q{font-size:20px;font-weight:800;margin:6px 0 14px}
.passage{background:linear-gradient(180deg,#fffef6,#fff6d6);border:2px dashed #f0cf63;border-radius:16px;padding:12px 16px;margin-bottom:14px;font-size:18px;line-height:1.7;white-space:pre-line}
.passage.sgk{background:linear-gradient(180deg,#f0fbf9,#e0f5f2);border-color:#38b2a6}
.gchips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.gchips button.chip{cursor:pointer;white-space:normal;text-align:left;background:#eefaf8;border-color:#0f9a8d;color:#0a5a55;font-weight:600}
.gchips button.chip:hover{background:#d9f3ef}
.goi table{width:100%;border-collapse:collapse;font-size:15px}.goi td{border:1px solid var(--vien);padding:6px 8px;vertical-align:top}.goi td:first-child{width:28%;font-weight:700;background:#fff8dc}
.goi ol,.goi ul{margin:6px 0;padding-left:22px}
.passage small{display:block;color:var(--chu2);font-size:12.5px;margin-top:6px;white-space:normal}
.sent{display:inline;font:inherit;line-height:1.9;text-align:left;border:0;background:none;border-bottom:2px dotted #c9a73d;border-radius:4px;padding:2px 3px;margin:0 1px;cursor:pointer;color:inherit}
.sent:hover{background:#fff0a8}
.sent.on{background:#ffe066;border-bottom-color:#b87900;box-shadow:0 0 0 2px #ffd43b}
.sent.ok{background:var(--dung-n);border-bottom:2px solid var(--dung);box-shadow:none}
.sent.bad{background:var(--sai-n);border-bottom:2px solid var(--sai);box-shadow:none}
.sent.miss{background:#fff;border:2px dashed var(--dung)}
.opts{display:grid;gap:10px}
.opt{text-align:left;min-height:52px;padding:12px 16px;border-radius:16px;border:2px solid var(--vien);background:#fff;font-weight:600;transition:transform .08s,background .15s}
.opt:hover{border-color:var(--muc2);background:#effaf8}.opt:active{transform:scale(.99)}
.opt.ok{background:var(--dung-n);border-color:var(--dung)}.opt.bad{background:var(--sai-n);border-color:var(--sai)}
.opt[disabled]{cursor:default}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{min-height:48px;padding:10px 12px;border-radius:14px;border:2px solid var(--vien);background:#fff;text-align:left;font-weight:600;font-size:16px}
.pill.sel{border-color:var(--muc2);background:#dff6f2;box-shadow:0 0 0 3px #aee6dd}
.pill.ok{background:var(--dung-n);border-color:var(--dung);pointer-events:none}
.pill.bad{background:var(--sai-n);border-color:var(--sai)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.bin{border:3px dashed #8fd0c6;border-radius:16px;background:#f0fbf9;padding:8px;min-height:92px;text-align:center;cursor:pointer}
.bin h4{margin:0 0 6px;font-size:15px;color:var(--muc-d)}
.bin.hot{background:#dff6f2;border-color:var(--muc2)}
.bin.bad{background:var(--sai-n);border-color:var(--sai)}
.bin .chip2{display:block;margin:4px 0;padding:6px 8px;border-radius:10px;background:var(--dung-n);border:1px solid var(--dung);font-size:15px;font-weight:600;text-align:left}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.slots{display:grid;gap:6px;margin-bottom:12px}
.slot{display:flex;gap:10px;align-items:flex-start;min-height:44px;border:2px dashed #8fd0c6;border-radius:12px;padding:8px 10px;background:#f0fbf9}
.slot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--muc);color:#fff;display:grid;place-items:center;font-size:14px}
.slot.fill{border-style:solid;border-color:var(--dung);background:var(--dung-n)}
.fb{margin-top:14px;display:flex;gap:12px;align-items:flex-start}
.fb .bubble{flex:1}
.fb.good .bubble{border-color:var(--dung);background:var(--dung-n)}.fb.good .bubble:before{border-right-color:var(--dung)}
.fb.bad .bubble{border-color:var(--sai);background:var(--sai-n)}.fb.bad .bubble:before{border-right-color:var(--sai)}
.mau{background:#f3f8ff;border:2px solid #b9d4ff;border-radius:14px;padding:10px 14px;margin:10px 0}
.ychk label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:2px solid var(--vien);border-radius:12px;margin:6px 0;background:#fff;cursor:pointer}
.ychk input,.rub input{width:22px;height:22px;margin-top:2px;flex:none}
/* tổng kết */
.ring{width:150px;height:150px;margin:0 auto;display:block}
.stars{display:flex;justify-content:center;gap:8px}
.badge{display:flex;gap:10px;align-items:center;border:1px solid var(--vien);border-radius:16px;padding:10px;background:#fff}
.badge .ic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:linear-gradient(180deg,#ffe8a3,#ffc233)}
.badge.lock{filter:grayscale(1);opacity:.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.bar{height:16px;border-radius:999px;background:#e5eef5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .6s}
/* viết */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.steps button{border:2px solid var(--vien);background:#fff;border-radius:16px;padding:8px 4px;font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px}
.steps button b{width:26px;height:26px;border-radius:50%;background:#dfe9f2;display:grid;place-items:center;font-size:14px}
.steps button.on{border-color:var(--muc2);background:#dff6f2}.steps button.on b{background:var(--muc);color:#fff}
.steps button.done b{background:var(--dung);color:#fff}
.khung{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.khung div{flex:1 1 130px;border-radius:14px;padding:10px;font-weight:800;text-align:center;border:2px solid rgba(16,40,61,.12)}
.khung small{display:block;font-weight:600;color:var(--chu2)}
label.f{display:block;font-weight:800;margin:12px 0 4px}
input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--vien);background:#fff;color:var(--chu)}
textarea{min-height:130px;resize:vertical;line-height:1.6}
.hint{font-size:14px;color:var(--chu2);margin:2px 0 0}
.line{display:flex;gap:8px;align-items:center;margin:6px 0}
.cnt{flex:none;min-width:70px;text-align:center;border-radius:10px;padding:6px;font-weight:800;font-size:14px;background:#eee}
.cnt.ok{background:var(--dung-n);color:#14703c}.cnt.bad{background:var(--sai-n);color:var(--sai)}
.rub label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;border:2px solid var(--vien);margin:6px 0;background:#fff;cursor:pointer}
.paper{background:#fffef8;border:1px solid #e7dfc3;border-radius:6px;padding:20px 18px;font-family:"Times New Roman",serif;font-size:17px;line-height:1.6;white-space:pre-wrap;box-shadow:inset 0 0 0 4px #fffef8,inset 0 0 0 5px #efe6c4}
.soi{background:linear-gradient(180deg,#f2fbff,#fff);border:2px solid #b9e0f5}
.tip{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;margin:6px 0;font-weight:600}
.tip.ok{background:var(--dung-n)}.tip.warn{background:#fff3cf}.tip.i{background:#eef3f8}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.stat span{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(16,40,61,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;border-radius:24px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ribbon{position:fixed;top:64px;right:-40px;transform:rotate(35deg);background:#e03131;color:#fff;font-weight:800;font-size:12px;padding:4px 50px;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.3)}
canvas#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--vien);padding:6px 8px;text-align:center}
th{background:#e7f5f2}
.scroll{overflow-x:auto}
body.chup *{animation:none!important;transition:none!important}
@media (max-width:520px){.chip.xp{font-size:13px;padding:4px 9px}.q{font-size:19px}h1{font-size:23px}.hero h1{font-size:25px}.logo{font-size:16px}.steps button{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gMuc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ad1bd"/><stop offset="1" stop-color="#1a73e8"/></linearGradient>
  <linearGradient id="gVang" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffb800"/></linearGradient>
  <linearGradient id="gXam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce4ee"/><stop offset="1" stop-color="#aab6c8"/></linearGradient>
  <linearGradient id="gLa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7be495"/><stop offset="1" stop-color="#25a35a"/></linearGradient>
  <linearGradient id="gHong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ab8"/><stop offset="1" stop-color="#d6336c"/></linearGradient>
  <radialGradient id="gGiot" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#7fd6ff"/><stop offset="1" stop-color="#1a65c8"/></radialGradient>
</defs></svg>
<header id="top"></header>
<main id="app"></main>
<div class="draft">✅ BẢN NHÁP — thầy/cô duyệt trước khi dùng · đã đối chiếu SGK Ngữ văn 7 (KNTT) tập một · nhờ giáo viên Ngữ văn soát lần cuối</div>
<nav id="nav"></nav>
<canvas id="cf"></canvas>
<div id="modal"></div>
<div id="ribbon"></div>

<script>
"use strict";

g Nam)","Đoàn Giỏi"],["Ngàn sao làm việc","Võ Quảng"],["Ngôi nhà trên cây (trích Tốt-tô-chan bên cửa sổ)","Cư-rô-ya-na-gi Tê-su-cô"]],"why":"Đây là các văn bản đọc và văn bản Thực hành đọc của Bài 1 – Bầu trời tuổi thơ (SGK tr.11, 18, 25, 33)."},{"id":"1b","bai":1,"tag":"tg","type":"mc","q":"Văn bản “Đi lấy mật” được trích từ tác phẩm nào?","opts":["Đất rừng phương Nam","Tốt-tô-chan bên cửa sổ","Những ngày thơ ấu","Hai vạn dặm dưới biển"],"a":0,"why":"“Đi lấy mật” trích từ truyện Đất rừng phương Nam của Đoàn Giỏi.","wrong":[null,"Đây là tác phẩm có đoạn trích “Ngôi nhà trên cây”.","Đây là tập hồi kí của Nguyên Hồng, học ở Bài 3.","Đây là tác phẩm của Giuyn Véc-nơ, học ở Bài 7."]},{"id":"1c","bai":1,"tag":"doc","type":"mc","q":"Trong Bài 1, văn bản nào là bài THƠ?","opts":["Ngàn sao làm việc","Bầy chim chìa vôi","Đi lấy mật","Ngôi nhà trên cây"],"a":0,"why":"Bầy chim chìa vôi, Đi lấy mật, Ngôi nhà trên cây là truyện (hoặc đoạn trích truyện). Ngàn sao làm việc của Võ Quảng là bài thơ kết nối chủ đề.","wrong":[null,"Đây là truyện của Nguyễn Quang Thiều.","Đây là đoạn trích tiểu thuyết Đất rừng phương Nam.","Đây là đoạn trích tự truyện Tốt-tô-chan bên cửa sổ."]},{"id":"1d","bai":1,"tag":"tv","type":"mc","q":"Theo SGK, trạng ngữ của câu có thể là:","opts":["Một từ hoặc một cụm từ","Chỉ có thể là một từ","Chỉ có thể là một câu","Chỉ có thể là một tiếng"],"a":0,"why":"Trạng ngữ có thể là một từ (Đêm, trời mưa…) hoặc một cụm từ (Đêm hôm đó, trời mưa…). Trạng ngữ là cụm từ cho thông tin cụ thể hơn.","wrong":[null,"Trạng ngữ không bị giới hạn ở một từ.","Trạng ngữ chỉ là một thành phần của câu, không phải là cả câu.","Tiếng là đơn vị nhỏ hơn từ; trạng ngữ có thể dài hơn thế."]},{"id":"1e","bai":1,"tag":"tv","type":"mc","q":"Câu: “Sáng sớm tinh mơ, bọn trẻ rủ nhau ra bờ sông.” Trạng ngữ của câu là gì?","opts":["Sáng sớm tinh mơ (chỉ thời gian)","Bọn trẻ (chỉ người)","Ra bờ sông (chỉ nơi chốn)","Rủ nhau ra bờ sông"],"a":0,"why":"“Sáng sớm tinh mơ” đứng đầu câu, ngăn cách bằng d cụ thể và kém cảm xúc.","wrong":[null,"Gạch ngang đầu dòng mới đánh dấu lời thoại.","Nối các tiếng là dấu gạch nối, không phải gạch ngang.","Kết thúc câu là dấu chấm."]},{"id":"5f","bai":5,"tag":"viet","type":"sort","q":"Xác định loại văn bản cho từng tình huống.","bins":["Đơn","Biên bản","Tường trình"],"items":[["Xin phép nghỉ học một buổi",0],["Ghi lại diễn biến và kết luận cuộc họp lớp",1],["Trình bày lại việc làm vỡ kính cửa sổ lớp, nguyên nhân và trách nhiệm",2],["Đề nghị nhà trường cho mượn phòng học",0],["Ghi nhận việc bàn giao tài sản của lớp",1]],"why":"Đơn: đề nghị, xin phép. Biên bản: ghi lại sự việc đang diễn ra. Tường trình: trình bày lại sự việc đã xảy ra, nêu rõ trách nhiệm của người viết."},{"id":"5g","bai":5,"tag":"viet","type":"order","q":"Sắp xếp các phần của văn bản tường trình theo thứ tự thường gặp.","items":["Quốc hiệu và tiêu ngữ","Tên văn bản: BẢN TƯỜNG TRÌNH","Kính gửi: (người/cơ quan nhận)","Người viết tự giới thiệu (họ tên, lớp…)","Nội dung sự việc: thời gian, địa điểm, diễn biến, nguyên nhân, trách nhiệm","Lời cam đoan; ngày tháng; chữ kí"],"why":"Cần soát lại với mẫu trong SGK Ngữ văn 7 KNTT."},{"id":"5h","bai":5,"tag":"viet","type":"mc","q":"Mục đích của văn bản tường trình là gì?","opts":["Trình bày lại sự việc đã xảy ra, nêu rõ trách nhiệm của người viết","Xin phép làm một việc gì đó","Ghi lại diễn biến một cuộc họp","Kể chuyện tưởng tượng"],"a":0,"why":"Tường trình khác đơn (xin phép) và khác biên bản (ghi lại cuộc họp/sự việc).","wrong":[null,"Đó là mục đích của đơn.","Đó là mục đích của biên bản.","Tường trình phải nói sự thật, không hư cấu."]},{"id":"5i","bai":5,"tag":"noi","type":"mc","q":"Khi trình bày ý kiến về văn hoá truyền thống trong xã hội hiện đại, em nên:","opts":["Nêu ý kiến, lí lẽ và ví dụ cụ thể về việc gìn giữ giá trị truyền thống","Chỉ nói “truyền thống rất hay”","Đọc lại bài tản văn","Chỉ phê phán người khác"],"a":0,"why":"Cần ý kiến rõ, lí lẽ và ví dụ để người nghe tin.","wrong":[null,"Nói chung chung thì thiếu sức thuyết phục.","Chỉ đọc lại bài không phải là trình bày ý kiến.","Mục đích là trao đổi xây dựng, không phải phê phán."]},{"id":"5p1","bai":5,"tag":"doc","type":"mc","pid":"d5","q":"Đoạn văn gần với thể loại nào nhất?","opts":["Tản văn","Truyện ngắn","Thơ bốn chữ","Biên bản"],"a":0,"why":"Người viết xưng “tôi”, bộc lộ cảm xúc, hồi tưởng, không có cốt truyện chặt chẽ: gần với tản văn.","wrong":[null,"Truyện ngắn có cốt truyện, nhân vật, xung đột.","Đoạn văn không chia dòng, không có vần.","Biên bản là văn bản hành chính."],"muc":"biet"},{"id":"5p2","bai":5,"tag":"doc","type":"mc","pid":"d5","q":"Cảm xúc chủ đạo của người viết là gì?","opts":["Nhớ nhung, hoài niệm về Tết xưa","Tức giận","Lo sợ","Hồi hộp chờ đợi"],"a":0,"why":"“Lòng nao nao nhớ cái Tết ngày bé” cho thấy nỗi nhớ, hoài niệm.","wrong":[null,"Không có chi tiết nào thể hiện sự tức giận.","Không có chi tiết nào thể hiện nỗi lo sợ.","Đoạn văn không nói về sự chờ đợi."],"muc":"hieu"},{"id":"5p3","bai":5,"tag":"tv","type":"mc","pid":"d5","q":"Từ nào trong đoạn văn là từ láy?","opts":["nao nao","chợ hoa","bếp lửa","hương nếp"],"a":0,"why":"“Nao nao” láy toàn bộ, gợi cảm giác bồi hồi, xao xuyến.","wrong":[null,"“Chợ hoa” là cụm danh từ.","“Bếp lửa” là cụm danh từ.","“Hương nếp” là cụm danh từ."],"muc":"biet"},{"id":"1p4","bai":1,"tag":"doc","type":"evid","pid":"d1","muc":"hieu","q":"Gạch chân (chạm vào) những câu cho thấy Na LO LẮNG cho các tổ chim.","ans":[1,2],"why":"Câu 2 có từ “lo lắng”, câu 3 là lời thì thầm cầu mong mưa đừng to: cả hai cho thấy Na lo cho tổ chim."},{"id":"1p5","bai":1,"tag":"doc","type":"short","pid":"d1","muc":"vd","q":"Em hãy nêu tính cách của bé Na và một chi tiết giúp em nhận ra điều đó (1–2 câu).","goi":"Gợi ý: Bé Na là cô bé … Em nhận ra qua chi tiết …","mau":"Bé Na là cô bé giàu lòng thương yêu loài vật. Em nhận ra điều đó qua việc Na lo lắng nhìn tổ chim, thì thầm cầu mong mưa đừng to và chạy ra lấy nón lá che cho tổ chim.","y":["Nêu đúng tính cách (giàu tình thương, tốt bụng…)","Dẫn ít nhất một chi tiết trong đoạn văn","Câu văn đủ chủ ngữ – vị ngữ, rõ ràng"]},{"id":"2p4","bai":2,"tag":"doc","type":"evid","pid":"d2","muc":"hieu","q":"Chạm vào dòng thơ có dùng NHÂN HOÁ.","ans":[1],"why":"“Ru” là việc của người (ru em ngủ) được gán cho gió."},{"id":"2p5","bai":2,"tag":"doc","type":"short","pid":"d2","muc":"vd","q":"Qua bài thơ, em cảm nhận đêm quê như thế nào? Nêu một hình ảnh em thích và vì sao (1–2 câu).","goi":"Gợi ý: Đêm quê hiện lên … Em thích hình ảnh … vì …","mau":"Đêm quê hiện lên yên ả, êm đềm. Em thích hình ảnh “Gió ru vườn cau” vì gió như đang hát ru cho cả khu vườn ngủ, nghe thật dịu dàng.","y":["Nêu đúng không khí: yên bình, êm đềm","Chọn một hình ảnh hoặc từ ngữ trong bài","Giải thích vì sao em thích (cảm xúc của em)"]},{"id":"3p4","bai":3,"tag":"doc","type":"evid","pid":"d3","muc":"hieu","q":"Chạm vào những câu cho thấy nhân vật “tôi” PHÂN VÂN giữa việc muốn đi chơi và việc trông em.","ans":[1,2],"why":"Câu 2 cho thấy lòng muốn chạy đi chơi; câu 3 cho thấy cuối cùng “tôi” vẫn ngồi xuống dỗ em."},{"id":"3p5","bai":3,"tag":"doc","type":"short","pid":"d3","muc":"vd","q":"Nhân vật “tôi” là người anh (chị) như thế nào? Vì sao em nghĩ vậy? (1–2 câu)","goi":"Gợi ý: Nhân vật “tôi” là người … Điều đó thể hiện qua …","mau":"Nhân vật “tôi” là người anh (chị) có trách nhiệm và thương em. Dù nôn nao muốn đi chơi, “tôi” vẫn ngồi xuống vỗ về em ngủ cho đến khi mẹ về.","y":["Nêu đúng đặc điểm: trách nhiệm, yêu thương em","Có dẫn chứng từ đoạn văn","Nêu được sự giằng co giữa muốn chơi và trông em (nếu có)"]},{"id":"4p4","bai":4,"tag":"doc","type":"evid","pid":"d4","muc":"hieu","q":"Chạm vào câu BỘC LỘ TRỰC TIẾP cảm xúc của người viết.","ans":[2],"why":"“Em yêu bà biết bao!” nói thẳng tình cảm bằng từ “yêu” và dấu chấm than."},{"id":"4p5","bai":4,"tag":"doc","type":"short","pid":"d4","muc":"vd","q":"Hình ảnh “đôi bàn tay chai sạn” giúp người viết nói lên điều gì về bà? Viết 1–2 câu.","goi":"Gợi ý: Hình ảnh ấy cho thấy bà … và tình cảm của em là …","mau":"Hình ảnh đôi bàn tay chai sạn cho thấy bà đã vất vả, tần tảo nuôi cháu lớn khôn. Từ đó, người viết thêm thương và biết ơn bà.","y":["Nêu được sự vất vả, tần tảo của bà","Nêu tình cảm của người viết (thương, biết ơn…)","Viết thành câu đầy đủ, rõ ý"]},{"id":"5p4","bai":5,"tag":"doc","type":"evid","pid":"d5","muc":"hieu","q":"Chạm vào những câu cho thấy “cái tôi” người viết đang BỘC LỘ NỖI NHỚ.","ans":[1,2],"why":"Hai câu cuối có “lòng nao nao nhớ” và “vẫn thơm trong kí ức tôi”: cảm xúc, hồi tưởng của người viết."},{"id":"5p5","bai":5,"tag":"doc","type":"short","pid":"d5","muc":"vd","q":"Vì sao hương nếp mới “đến giờ vẫn thơm trong kí ức” của người viết? Viết 1–2 câu.","goi":"Gợi ý: Vì hương nếp gắn với … nên …","mau":"Hương nếp mới gắn với kỉ niệm Tết ngày bé, khi bà ngồi gói bánh bên bếp lửa. Vì thế, mùi hương ấy trở thành kí ức ấm áp luôn theo người viết.","y":["Nêu được hương nếp gắn với kỉ niệm Tết ngày bé và hình ảnh bà","Nêu cảm xúc: ấm áp, nhớ nhung","Diễn đạt bằng lời của em"]},{"id":"1v1","bai":1,"tag":"viet","type":"mc","muc":"hieu","q":"Đoạn văn “Cơn mưa đầu mùa” cần tóm tắt trong 2 câu. Bản nào đạt yêu cầu?","opts":["Bé Na lo cho tổ chim khi mưa đến, bèn chạy ra lấy nón lá che cho tổ chim.","Cơn mưa đầu mùa kéo đến khi chiều chưa tắt nắng. Bé Na đứng ở hiên, lo lắng nhìn mấy cái tổ chim trên cây ổi.","Bé Na rất ngoan và học giỏi nhất lớp.","Mưa to."],"a":0,"why":"Bản đầu giữ sự việc chính (lo cho tổ chim → che nón), ngắn gọn, bằng lời của em.","wrong":[null,"Bản này chép lại nguyên văn, chưa phải tóm tắt.","Bản này thêm chi tiết đoạn văn không có.","Bản này quá ngắn, thiếu nhân vật và sự việc."]},{"id":"1v2","bai":1,"tag":"viet","type":"order","muc":"hieu","q":"Sắp xếp các câu thành đoạn tóm tắt đúng trình tự.","items":["Trời đổ mưa đầu mùa khi chiều chưa tắt nắng.","Bé Na lo lắng cho mấy cái tổ chim trên cây ổi.","Gió nổi lên làm cành ổi rung mạnh.","Na chạy ra sân, lấy nón lá che cho tổ chim."],"why":"Tóm tắt theo đúng trình tự sự việc: mưa đến → lo lắng → gió nổi → hành động che chở."},{"id":"2v1","bai":2,"tag":"viet","type":"mc","muc":"hieu","q":"Câu nào bày tỏ cảm xúc về bài thơ “Đêm quê” hay hơn?","opts":["Bài thơ hay.","Đọc bài thơ, em thấy lòng êm dịu như được gió ru, nhất là hình ảnh “Gió ru vườn cau”.","Bài thơ có bốn dòng.","Tác giả viết bài thơ rất giỏi."],"a":1,"why":"Câu hay vì có cảm xúc thật của em, có hình ảnh cụ thể và liên hệ với chính bài thơ.","wrong":["“Hay” chung chung, chưa nói vì sao.",null,"Câu chỉ nêu số dòng, chưa có cảm xúc.","Câu khen tác giả nhưng chưa nêu cảm xúc của em."]},{"id":"2v2","bai":2,"tag":"viet","type":"order","muc":"hieu","q":"Sắp xếp các câu thành đoạn văn ghi lại cảm xúc sau khi đọc thơ.","items":["Bài thơ “Đêm quê” cho em cảm giác yên bình.","Em thích nhất hình ảnh “Gió ru vườn cau”.","Gió được viết như một người mẹ đang hát ru, làm cả khu vườn thêm êm đềm.","Đọc xong, em muốn về quê để được nghe tiếng gió ru dưới trăng."],"why":"Đoạn cảm xúc đi từ cảm nhận chung → hình ảnh ấn tượng → giải thích → ước muốn của em."},{"id":"3v1","bai":3,"tag":"viet","type":"mc","muc":"hieu","q":"Câu nào nêu đặc điểm nhân vật KÈM dẫn chứng đúng cách?","opts":["Nhân vật “tôi” có trách nhiệm: dù nôn nao muốn đi chơi, tôi vẫn ngồi xuống vỗ về em ngủ.","Nhân vật “tôi” rất tốt.","Tôi vỗ về em ngủ.","Mẹ dặn tôi ở nhà trông em."],"a":0,"why":"Câu đúng vừa nêu đặc điểm (có trách nhiệm) vừa dẫn chứng (ngồi xuống vỗ về em).","wrong":[null,"Thiếu dẫn chứng.","Chỉ chép chi tiết, chưa nêu đặc điểm.","Đây là lời mẹ dặn, không phải đặc điểm của nhân vật."]},{"id":"3v2","bai":3,"tag":"viet","type":"mc","muc":"vd","q":"Từ nối nào phù hợp để chuyển sang đặc điểm thứ hai (cùng mức quan trọng) của nhân vật?","opts":["Bên cạnh đó,","Vì vậy mà,","Mặc dù thế,","Hôm qua,"],"a":0,"why":"Thêm một đặc điểm ngang hàng thì dùng “Bên cạnh đó”, “Ngoài ra”.","wrong":[null,"“Vì vậy” chỉ kết quả, không dùng để thêm ý ngang hàng.","“Mặc dù” chỉ sự nhượng bộ.","“Hôm qua” chỉ thời gian."]},{"id":"4v1","bai":4,"tag":"viet","type":"mc","muc":"hieu","q":"Câu nào biểu cảm tốt hơn?","opts":["Em rất yêu bà.","Mỗi lần ngồi bên bà nhặt rau, em thấy lòng ấm áp như có nắng ngoài hiên.","Bà em sáu mươi tuổi.","Bà làm việc nhà."],"a":1,"why":"Câu biểu cảm tốt gắn cảm xúc với một khoảnh khắc cụ thể và có hình ảnh so sánh.","wrong":["Câu nói được tình cảm nhưng chung chung.",null,"Câu chỉ cung cấp thông tin.","Câu chỉ kể việc."]},{"id":"4v2","bai":4,"tag":"viet","type":"sort","muc":"hieu","q":"Phân loại câu theo cách biểu đạt.","bins":["Kể","Tả","Biểu cảm"],"items":[["Hôm qua, bà đưa em đi chợ.",0],["Chiều nay em sang nhà bà chơi.",0],["Mái tóc bà bạc như sương.",1],["Bà ngồi bên hiên, tay thoăn thoắt nhặt rau.",1],["Em thương bà biết bao!",2],["Nhớ bà, lòng em chợt thắt lại.",2]],"why":"Kể: nêu việc đã xảy ra. Tả: vẽ lại hình dáng, hoạt động. Biểu cảm: bày tỏ tình cảm, cảm xúc."},{"id":"5v1","bai":5,"tag":"viet","type":"mc","muc":"hieu","q":"Câu nào KHÔNG nên có trong bản tường trình?","opts":["Em xin cam đoan những điều trên là đúng sự thật.","Do em không cẩn thận nên quả bóng bay vào cửa kính.","Chắc là do bạn A nghịch, em đoán vậy.","Em xin nhận trách nhiệm về phần của mình."],"a":2,"why":"Tường trình phải nói đúng sự việc em biết, rõ trách nhiệm của mình, không suy đoán hay đổ lỗi.","wrong":["Câu cam đoan là phần cần có.","Câu nêu nguyên nhân và trách nhiệm là phù hợp.",null,"Nhận trách nhiệm là nội dung phù hợp."]},{"id":"5v2","bai":5,"tag":"viet","type":"mc","muc":"biet","q":"Phần “Kính gửi” trong bản tường trình dùng để làm gì?","opts":["Nêu người hoặc cơ quan nhận bản tường trình","Nêu nguyên nhân sự việc","Ghi ngày tháng viết","Giới thiệu sở thích của người viết"],"a":0,"why":"“Kính gửi” cho biết bản tường trình viết cho ai (ví dụ cô giáo chủ nhiệm).","wrong":[null,"Nguyên nhân nằm ở phần nội dung sự việc.","Ngày tháng nằm ở đầu hoặc cuối văn bản.","Tường trình không giới thiệu sở thích."]},{"id":"1t1","bai":1,"tag":"tv","type":"mc","q":"Mở rộng thành phần chính và trạng ngữ của câu bằng cụm từ có tác dụng gì?","opts":["Giúp câu cung cấp nhiều thông tin hơn cho người đọc, người nghe","Làm câu ngắn lại cho dễ đọc","Làm mất thành phần chính của câu","Chỉ để câu dài ra, không thêm thông tin"],"a":0,"why":"Theo SGK (tr.11): mở rộng bằng cụm từ giúp câu cung cấp nhiều thông tin hơn.","wrong":[null,"Mở rộng làm câu dài hơn chứ không ngắn lại.","Thành phần chính vẫn còn, chỉ được mở rộng.","Phần mở rộng có thêm thông tin cụ thể."]},{"id":"1t2","bai":1,"tag":"tv","type":"mc","q":"Thành phần chính và trạng ngữ thường được mở rộng bằng loại cụm từ nào?","opts":["Cụm danh từ, cụm động từ, cụm tính từ","Cụm từ nối câu","Cụm thán từ","Cụm dấu câu"],"a":0,"why":"Đó là các cụm từ chính phụ: cụm danh từ, cụm động từ, cụm tính từ (SGK tr.11).","wrong":[null,"Không có loại “cụm từ nối câu” trong bài này.","Cụm thán từ không dùng để mở rộng thành phần chính.","Dấu câu không phải là cụm từ."]},{"id":"1t3","bai":1,"tag":"doc","type":"mc","q":"Đề tài của một tác phẩm văn học là gì?","opts":["Phạm vi đời sống được thể hiện trong tác phẩm","Tên của tác giả","Số trang của tác phẩm","Nhân vật phụ của tác phẩm"],"a":0,"why":"Đề tài là phạm vi đời sống được thể hiện trong tác phẩm (SGK, Tri thức ngữ văn). Có thể dựa vào sự kiện, không gian hoặc nhân vật trung tâm để xác định.","wrong":[null,"Tên tác giả không phải là đề tài.","Số trang không nói gì về nội dung.","Nhân vật phụ chưa quyết định đề tài."]},{"id":"1t4","bai":1,"tag":"doc","type":"mc","q":"Tính cách nhân vật được bộc lộ qua những điều nào?","opts":["Hành động, cách ứng xử, cảm xúc, suy nghĩ, qua các mối quan hệ và lời kể của người khác","Chỉ qua tên của nhân vật","Chỉ qua số lần nhân vật xuất hiện","Chỉ qua nhan đề của văn bản"],"a":0,"why":"Theo SGK: tính cách là đặc điểm riêng tương đối ổn định, bộc lộ qua hành động, cách ứng xử, cảm xúc, suy nghĩ, quan hệ và lời kể của nhân vật khác.","wrong":[null,"Tên không cho biết tính cách.","Số lần xuất hiện không nói lên tính cách.","Nhan đề chỉ gợi ý, chưa đủ để nêu tính cách."]},{"id":"1t5","bai":1,"tag":"viet","type":"mc","q":"Theo SGK, văn bản tóm tắt phải đảm bảo điều gì?","opts":["Phản ánh trung thành nội dung cơ bản của văn bản gốc","Thêm nhiều ý kiến riêng của người tóm tắt","Dài hơn văn bản gốc","Đổi hết tên nhân vật"],"a":0,"why":"Văn bản tóm tắt tuy ngắn nhưng vẫn phản ánh trung thành nội dung cơ bản của văn bản gốc (SGK tr.11, 27).","wrong":[null,"Ý kiến bình luận nên lược bỏ khi tóm tắt.","Tóm tắt phải ngắn hơn văn bản gốc.","Không đổi tên nhân vật."]},{"id":"1t6","bai":1,"tag":"viet","type":"mc","q":"Khi tóm tắt văn bản tự sự, em cần quan tâm đến những yếu tố nào (theo sơ đồ trong SGK)?","opts":["Bối cảnh, nhân vật và các sự việc tiêu biểu","Chỉ màu sắc của bìa sách","Chỉ lời bình của người khác","Chỉ năm xuất bản"],"a":0,"why":"SGK tr.28 gợi ý sơ đồ: bối cảnh (ở đâu, khi nào), nhân vật, sự việc 1 – 2 – 3.","wrong":[null,"Bìa sách không thuộc nội dung cần tóm tắt.","Lời bình không phải nội dung của văn bản gốc.","Năm xuất bản không giúp tóm tắt nội dung."]},{"id":"1s1","bai":1,"tag":"doc","type":"mc","q":"Trong “Bầy chim chìa vôi”, đêm mưa to, hai anh em Mên và Mon lo lắng điều gì?","opts":["Bãi cát giữa sông sắp ngập, bầy chim chìa vôi non có thể bị chết đuối","Nhà bị dột và hết chỗ ngủ","Bố sẽ mắng vì mất cá","Đò của ông Hảo bị trôi"],"a":0,"why":"Mon nói “Em sợ những con chim chìa vôi non bị chết đuối mất”, và cả hai lo bãi cát giữa sông sắp ngập (SGK tr.11–12).","wrong":[null,"Truyện không nói nhà bị dột.","Chuyện con cá bống chỉ là một chi tiết nhỏ, không phải nỗi lo chính.","Hai anh em còn dùng đò của ông Hảo để ra bãi."],"pid":"s1a","muc":"biet"},{"id":"1s2","bai":1,"tag":"doc","type":"mc","q":"Tóm tắt trong SGK (tr.28) cho biết hai anh em Mên, Mon đã làm gì?","opts":["Đi đò ra bãi cát giữa sông để cứu tổ chim sắp bị ngập nước","Đi đánh cá giúp bố","Ra sông tắm mưa","Đi tìm đò của ông Hảo để bán"],"a":0,"why":"SGK tóm tắt: hai anh em đi đò ra bãi cát giữa sông để cứu tổ chim sắp bị ngập nước và xúc động khi thấy đàn chim non bay lên.","wrong":[null,"Hai anh em không đi đánh cá.","Họ không đi tắm mưa mà lo cho chim.","Đò chỉ là phương tiện để ra bãi cát."],"pid":"s1a","muc":"hieu"},{"id":"1s3","bai":1,"tag":"doc","type":"mc","q":"Đoạn kết truyện: khi thấy bầy chim non bay lên, Mên và Mon thế nào?","opts":["Xúc động đến mức khóc mà không hiểu vì sao","Giận dỗi nhau rồi bỏ về","Vui mừng reo hò ầm ĩ","Chẳng quan tâm vì quá buồn ngủ"],"a":0,"why":"Hai anh em đứng không nhúc nhích, rồi nhận ra mình đã khóc từ lúc nào; Mon còn nói “Em không biết” khi anh hỏi vì sao khóc (tr.17).","wrong":[null,"Họ không giận nhau, chỉ cười ngượng nghịu.","Họ “không kêu lên được một tiếng nào” chứ không reo hò.","Họ không hề buồn ngủ."],"pid":"s1a","muc":"hieu"},{"id":"1s4","bai":1,"tag":"doc","type":"mc","q":"Truyện “Bầy chim chìa vôi” được kể bằng ngôi nào?","opts":["Ngôi thứ ba","Ngôi thứ nhất","Ngôi thứ hai","Không có người kể chuyện"],"a":0,"why":"Người kể gọi các nhân vật là “nó”, “thằng Mên”, “thằng Mon” nên đây là ngôi thứ ba.","wrong":[null,"Người kể không xưng “tôi”.","Người kể không gọi người đọc là “bạn” (ngôi thứ hai).","Truyện luôn có người kể chuyện."],"pid":"s1a","muc":"hieu"},{"id":"1s5","bai":1,"tag":"doc","type":"mc","q":"Trong “Đi lấy mật”, ai cùng đi lấy mật với An?","opts":["Tía nuôi và thằng Cò","Má nuôi và con Luốc","Thầy giáo và bạn cùng lớp","Chỉ một mình An"],"a":0,"why":"An đi cùng tía nuôi và Cò (con trai của tía nuôi); con Luốc là chú chó đi theo (tr.18–19).","wrong":[null,"Má nuôi ở nhà, chỉ kể cách gác kèo ong.","Thầy giáo chỉ được nhắc đến trong lời kể của An.","An không đi một mình."],"pid":"s1b","muc":"biet"},{"id":"1s6","bai":1,"tag":"doc","type":"mc","q":"Cảnh sắc rừng U Minh trong đoạn trích được kể qua cái nhìn của ai?","opts":["Nhân vật An (xưng “tôi”)","Thằng Cò","Tía nuôi","Con chó Luốc"],"a":0,"why":"Đoạn trích kể ở ngôi thứ nhất, qua cái nhìn của cậu bé An – người lần đầu theo tía nuôi đi “ăn ong”.","wrong":[null,"Cò là người chỉ cho An nhìn, nhưng người “thấy” và kể là An.","Tía nuôi là nhân vật được An kể về.","Con chó không phải người kể."],"pid":"s1b","muc":"hieu"},{"id":"1s7","bai":1,"tag":"doc","type":"mc","q":"Theo lời má nuôi, để gác kèo ong, người ta phải làm gì?","opts":["Chọn vùng rừng tốt, xem hướng gió và tính đường bay của ong mật","Chặt hết cây quanh tổ ong","Chỉ cần mang gùi vào rừng","Gác kèo ở chỗ râm mát nhất"],"a":0,"why":"Má nuôi nói phải xem hướng gió, tính đường bay của ong mật, chọn chỗ “ấm”, cây dày (tr.21).","wrong":[null,"Chỉ “rửa” bớt nhánh quanh kèo, không chặt hết cây.","Nhiều người có nghề lâu năm vẫn “gùi không trở về” vì định sai chỗ.","Con ong không thích đóng chỗ rợp."],"pid":"s1b","muc":"hieu"},{"id":"1s8","bai":1,"tag":"doc","type":"mc","q":"Bài thơ “Ngàn sao làm việc” viết theo thể thơ nào?","opts":["Năm chữ","Bốn chữ","Sáu chữ","Lục bát"],"a":0,"why":"Mỗi dòng có 5 tiếng, ví dụ: “Bóng chiều toả ra nhanh”.","wrong":[null,"Mỗi dòng có 5 tiếng, nhiều hơn bốn chữ.","Mỗi dòng có 5 tiếng, ít hơn sáu chữ.","Lục bát xen dòng 6 và 8 tiếng, bài này đều 5 tiếng."],"pid":"s1c","muc":"biet"},{"id":"1s9","bai":1,"tag":"doc","type":"mc","q":"Các hình ảnh so sánh bầu trời đêm trong bài (chiếc vó, chiếc nơm, đuốc soi cá, gàu tát nước…) có điểm chung nào?","opts":["Đều là những vật dụng, công việc quen thuộc của người dân quê","Đều là đồ chơi hiện đại","Đều là loài vật trong rừng","Đều là máy móc công nghiệp"],"a":0,"why":"Nhà thơ nhìn ngàn sao qua con mắt em bé chăn trâu nên liên tưởng tới vó, nơm, đuốc soi cá, gàu tát nước – cảnh làm việc ở làng quê.","wrong":[null,"Vó, nơm, gàu là dụng cụ lao động, không phải đồ chơi hiện đại.","Đó là dụng cụ, không phải loài vật.","Đó là dụng cụ thủ công, không phải máy móc."],"pid":"s1c","muc":"vd"},{"id":"1s10","bai":1,"tag":"doc","type":"short","pid":"s1a","muc":"vd","q":"Em hãy nêu tính cách của Mon (hoặc Mên) và một chi tiết giúp em nhận ra điều đó (1–2 câu).","goi":"Gợi ý: Mon là cậu bé … Em nhận ra qua chi tiết …","mau":"Mon là cậu bé giàu tình thương loài vật và nhạy cảm. Em nhận ra qua chi tiết Mon lo bầy chim chìa vôi non sẽ bị chết đuối và là người đề nghị mang chúng vào bờ.","y":["Nêu đúng tính cách (thương yêu loài vật, nhạy cảm, tốt bụng…)","Dẫn ít nhất một chi tiết trong truyện","Câu văn rõ ràng, đủ chủ ngữ – vị ngữ"]},{"id":"1s11","bai":1,"tag":"doc","type":"short","pid":"s1b","muc":"vd","q":"Đọc “Đi lấy mật”, em có ấn tượng như thế nào về rừng U Minh hoặc con người nơi đây (1–2 câu)?","goi":"Gợi ý: Em ấn tượng với … vì …","mau":"Em ấn tượng với rừng U Minh yên tĩnh mà đầy sự sống (ong, chim, kì nhông…) và với những người dân Nam Bộ thạo nghề rừng như tía nuôi, má nuôi, Cò.","y":["Nêu đúng một ấn tượng về rừng hoặc con người","Có chi tiết minh hoạ trong đoạn trích","Diễn đạt rõ ràng"]},{"id":"2t1","bai":2,"tag":"tv","type":"mc","q":"Hai dòng thơ “Một ngày hoà bình / Anh không về nữa” dùng biện pháp tu từ nào?","opts":["Nói giảm nói tránh","Nhân hoá","So sánh","Hoán dụ"],"a":0,"why":"Nhà thơ nói “không về nữa” thay cho “đã hi sinh” để tránh gây cảm giác đau thương, mất mát (SGK tr.42).","wrong":[null,"Không có sự vật nào được gán hành động của người ở hai dòng này.","Không có từ “như” hay “là” để so sánh.","Câu không gọi tên sự vật bằng một sự vật khác."]},{"id":"2t2","bai":2,"tag":"tv","type":"mc","q":"Nói giảm nói tránh là biện pháp tu từ như thế nào?","opts":["Dùng cách nói giảm nhẹ hoặc tránh nói trực tiếp để đỡ đau buồn, ghê sợ hay giữ phép lịch sự","Nhắc lại một từ nhiều lần để nhấn mạnh","So sánh hai sự vật có nét giống nhau","Gọi sự vật bằng tên của sự vật khác"],"a":0,"why":"Đó là định nghĩa trong SGK (tr.39). Nhắc lại từ là điệp ngữ; so sánh và hoán dụ là các biện pháp khác.","wrong":[null,"Đó là điệp ngữ.","Đó là so sánh.","Đó là ẩn dụ/hoán dụ."]},{"id":"2t3","bai":2,"tag":"tv","type":"sort","q":"Xếp mỗi cách nói vào đúng nhóm (theo ví dụ trong SGK).","bins":["Nói giảm nói tránh","Nói trực tiếp"],"items":[["Cụ ấy đã quy tiên.",0],["Cụ ấy chết rồi.",1],["Bông hoa này không đẹp lắm.",0],["Bông hoa này xấu lắm.",1],["Kết quả học tập của con dạo này kém lắm.",1],["Con cần cố gắng nhiều hơn nữa.",0]],"why":"Nói giảm nói tránh dùng từ Hán Việt hoặc cách nói vòng, nói phủ định để lời nói nhẹ nhàng, lịch sự hơn."},{"id":"2t4","bai":2,"tag":"doc","type":"mc","q":"Khi vần được gieo ở các dòng liền nhau, ta gọi là vần gì?","opts":["Vần liền","Vần cách","Vần hỗn hợp","Vần lưng"],"a":0,"why":"Theo SGK (tr.39): vần có thể gieo liên tiếp (vần liền) hoặc cách quãng (vần cách), hoặc phối hợp nhiều kiểu (vần hỗn hợp).","wrong":[null,"Vần cách là gieo cách quãng.","Vần hỗn hợp là phối hợp nhiều kiểu.","Vần lưng không phải là cách gọi trong bài học này."]},{"id":"2t5","bai":2,"tag":"doc","type":"mc","q":"Bài “Đồng dao mùa xuân” và bài “Gặp lá cơm nếp” lần lượt thuộc thể thơ nào?","opts":["Bốn chữ và năm chữ","Năm chữ và bốn chữ","Cả hai đều bốn chữ","Cả hai đều lục bát"],"a":0,"why":"“Có một người lính” có 4 tiếng; “Xa nhà đã mấy năm” có 5 tiếng.","wrong":[null,"Đồng dao mùa xuân có 4 tiếng mỗi dòng.","Cả hai bài không cùng thể thơ.","Hai bài không phải lục bát."]},{"id":"2t6","bai":2,"tag":"doc","type":"mc","q":"Văn bản “Trở gió” của Nguyễn Ngọc Tư viết về điều gì?","opts":["Gió chướng và nỗi nhớ, tình cảm của tác giả với quê nhà","Một trận bão ở miền Trung","Cơn gió mùa hạ ở thành phố","Cuộc thi thả diều"],"a":0,"why":"Tác giả viết về gió chướng (cách gọi gió mùa đông bắc của người Nam Bộ), gắn với mùa thu hoạch và nỗi nhớ quê (tr.44–46).","wrong":[null,"Gió chướng là gió mùa đông bắc ở Nam Bộ.","Văn bản không nói về mùa hạ ở thành phố.","Không có cuộc thi thả diều."]},{"id":"2s1","bai":2,"tag":"doc","type":"mc","q":"Người lính trong “Đồng dao mùa xuân” hiện lên qua những hình ảnh nào?","opts":["Ba lô con cóc, tấm áo màu xanh, làn da sốt rét, cái cười hiền lành","Bộ quân phục sáng bóng và chiếc huân chương lớn","Con ngựa chiến và thanh gươm","Chiếc máy bay và lá cờ"],"a":0,"why":"Đó là các hình ảnh bình dị, thân quen về anh bộ đội (SGK tr.41).","wrong":[null,"Bài thơ không nhắc tới huân chương.","Không có ngựa chiến, gươm trong bài.","Không có máy bay trong bài."],"pid":"s2a","muc":"biet"},{"id":"2s2","bai":2,"tag":"doc","type":"mc","q":"Nhan đề “Đồng dao mùa xuân” gợi cho em điều gì?","opts":["Giọng điệu tươi trẻ như khúc đồng dao và sức sống của mùa xuân, tuổi xuân","Một bài hát buồn thảm","Câu chuyện về mùa đông giá rét","Một bài học khoa học"],"a":0,"why":"SGK (bài tham khảo tr.51) nhận xét nhan đề cùng thể thơ bốn chữ mang giọng điệu tươi trẻ của khúc đồng dao, tiếp nối sức sống bất diệt của mùa xuân.","wrong":[null,"Bài thơ không để lại cảm giác bi thương, nặng nề.","Nhan đề nhắc tới mùa xuân.","Đây là bài thơ, không phải bài khoa học."],"pid":"s2a","muc":"hieu"},{"id":"2s3","bai":2,"tag":"doc","type":"mc","q":"Điều gì gợi người con nhớ về mẹ trong “Gặp lá cơm nếp”?","opts":["Bát xôi mùa gặt, mùi xôi và lá cơm nếp","Tiếng chuông trường","Một chuyến tàu đêm","Cơn mưa rào"],"a":0,"why":"Xa nhà đã mấy năm, người con gặp bát xôi, mùi xôi và lá cơm nếp nên nhớ mẹ nhặt lá về đun bếp thổi xôi (tr.43).","wrong":[null,"Bài thơ không nhắc tiếng chuông trường.","Không có chuyến tàu đêm trong bài.","Không có cơn mưa rào trong bài."],"pid":"s2b","muc":"hieu"},{"id":"2s4","bai":2,"tag":"doc","type":"mc","q":"Khi gió chướng về, tâm trạng của nhân vật “tôi” trong “Trở gió” như thế nào?","opts":["Lộn xộn, ngổn ngang: vừa mừng vừa bực, vừa buồn","Hoàn toàn bình thản","Chỉ có sợ hãi","Chỉ có giận dữ"],"a":0,"why":"Tác giả viết “Tôi thường đón gió chướng về với một tâm trạng lộn xộn, ngổn ngang. Mừng đó rồi bực đó” (tr.45).","wrong":[null,"Nhân vật “tôi” có nhiều cảm xúc, không bình thản.","Không chỉ có sợ hãi.","Không chỉ có giận dữ."],"pid":"s2c","muc":"hieu"},{"id":"2s5","bai":2,"tag":"doc","type":"mc","q":"Vì sao tác giả nói mùa gió chướng cũng là mùa thu hoạch?","opts":["Gió về lúc lúa chín, mía già, trái cây chín… nên rất đáng chờ đợi","Vì gió làm mát nhà cửa","Vì gió đưa cá vào sông","Vì gió dùng để đi biển"],"a":0,"why":"Văn bản kể lúa vừa chín tới, liếp mía già, vú sữa chín, dưa hấu… đúng vào mùa gió chướng (tr.46).","wrong":[null,"Đó không phải lí do tác giả nêu.","Văn bản không nói tới cá.","Văn bản không nói về đi biển."],"pid":"s2c","muc":"hieu"},{"id":"2s6","bai":2,"tag":"doc","type":"short","pid":"s2b","muc":"vd","q":"Theo em, tình cảm của người con dành cho mẹ và quê hương trong “Gặp lá cơm nếp” là gì? Nêu một hình ảnh em thích (1–2 câu).","goi":"Gợi ý: Người con nhớ thương … Em thích hình ảnh … vì …","mau":"Người con nhớ thương mẹ và gắn bó với quê hương; nỗi nhớ mẹ hoà vào tình yêu đất nước. Em thích hình ảnh mùi xôi, lá cơm nếp vì nó làm người con nhớ tới mẹ.","y":["Nêu đúng tình cảm (nhớ thương mẹ, yêu quê hương)","Chọn một hình ảnh cụ thể trong bài","Giải thích ngắn gọn vì sao em thích"]},{"id":"3t1","bai":3,"tag":"tv","type":"mc","q":"Phó từ là gì?","opts":["Những từ đi kèm để bổ sung ý nghĩa cho danh từ, động từ, tính từ","Những từ chỉ tên riêng","Những từ chỉ số lượng và thứ tự","Những từ biểu thị cảm xúc"],"a":0,"why":"Theo SGK (tr.59): phó từ là những từ chuyên đi kèm để bổ sung ý nghĩa cho danh từ, động từ, tính từ.","wrong":[null,"Tên riêng không phải phó từ.","Từ chỉ số lượng, thứ tự là số từ.","Từ biểu thị cảm xúc là thán từ."]},{"id":"3t2","bai":3,"tag":"tv","type":"sort","q":"Xếp các phó từ vào đúng nhóm.","bins":["Đi kèm danh từ","Đi kèm động từ, tính từ"],"items":[["những",0],["các",0],["mọi",0],["hãy",1],["lắm",1],["đã",1]],"why":"Phó từ đi kèm danh từ: những, các, mọi, mỗi, từng… Phó từ đi kèm động từ, tính từ: đã, vẫn, hãy, lắm… (SGK tr.72)."},{"id":"3t3","bai":3,"tag":"tv","type":"mc","q":"Từ nào dưới đây là số từ chỉ số lượng ước chừng?","opts":["dăm ba","thứ nhất","bốn mươi hai","đầu tiên"],"a":0,"why":"“Dăm ba” chỉ số lượng ước chừng (như vài, dăm, mươi…). “Bốn mươi hai” là số lượng xác định; “thứ nhất” chỉ thứ tự.","wrong":[null,"“Thứ nhất” chỉ thứ tự.","“Bốn mươi hai” là số lượng xác định.","“Đầu tiên” chỉ thứ tự."]},{"id":"3t4","bai":3,"tag":"doc","type":"mc","q":"Việc thay đổi kiểu người kể chuyện trong một truyện có tác dụng gì?","opts":["Soi chiếu câu chuyện từ nhiều chiều, làm truyện phong phú, hấp dẫn hơn","Làm truyện ngắn đi","Làm mất nhân vật chính","Chỉ để đổi tên tác giả"],"a":0,"why":"Theo SGK (tr.59): sự thay đổi kiểu người kể chuyện thể hiện ý đồ nghệ thuật, mỗi ngôi kể mang một cách nhìn riêng.","wrong":[null,"Mục đích không phải rút ngắn.","Nhân vật chính vẫn còn.","Tác giả không đổi."]},{"id":"3t5","bai":3,"tag":"doc","type":"mc","q":"Trong bài thơ “Quê hương”, quê của tác giả là làng như thế nào?","opts":["Làng chài ven biển","Làng làm nghề gốm","Làng miền núi trồng chè","Phố cổ đông đúc"],"a":0,"why":"“Làng tôi ở vốn làm nghề chài lưới” – dân trai tráng bơi thuyền đi đánh cá (tr.73).","wrong":[null,"Bài thơ không nói tới nghề gốm.","Bài thơ không nói tới trồng chè.","Đó không phải phố cổ."]},{"id":"3s1","bai":3,"tag":"doc","type":"mc","q":"Trong “Vừa nhắm mắt vừa mở cửa sổ”, người bố dạy “tôi” nhận ra các loài hoa bằng cách nào?","opts":["Nhắm mắt, dùng tay chạm vào từng bông hoa rồi đoán tên","Đọc sách về các loài hoa","Nhìn ảnh trong tờ lịch","Hỏi người hàng xóm"],"a":0,"why":"Bố bảo “tôi” nhắm mắt lại rồi dẫn đi chạm từng bông hoa, hỏi “Đố con hoa gì?” (tr.60).","wrong":[null,"Truyện không nói tới sách về hoa.","Không có ảnh trong tờ lịch.","Không hỏi hàng xóm."],"pid":"s3a","muc":"biet"},{"id":"3s2","bai":3,"tag":"doc","type":"mc","q":"Nhân vật người bố chủ yếu được miêu tả qua lời kể của ai?","opts":["Nhân vật “tôi” – người con (ngôi thứ nhất)","Một người hàng xóm","Chính người bố","Thằng Tí"],"a":0,"why":"Truyện kể ở ngôi thứ nhất, “tôi” kể về bố bằng cái nhìn và tình cảm của con.","wrong":[null,"Người hàng xóm không phải người kể.","Bố được kể, không phải người kể.","Tí là bạn của “tôi”, không phải người kể."],"pid":"s3a","muc":"hieu"},{"id":"3s3","bai":3,"tag":"doc","type":"short","pid":"s3a","muc":"vd","q":"Nêu một nét tính cách của người bố và một chi tiết cho thấy điều đó (1–2 câu).","goi":"Gợi ý: Người bố là người … Em nhận ra qua chi tiết …","mau":"Người bố yêu con, kiên nhẫn và tinh tế. Em nhận ra qua chi tiết bố dẫn con ra vườn mỗi chiều, bảo con nhắm mắt chạm từng bông hoa để đoán tên và cười khen khi con tiến bộ.","y":["Nêu đúng tính cách (yêu con, kiên nhẫn, tinh tế…)","Dẫn một chi tiết trong truyện","Câu văn rõ ràng, đủ ý"]},{"id":"3s4","bai":3,"tag":"doc","type":"mc","q":"Trong “Người thầy đầu tiên”, thầy Đuy-sen được người kể chuyện nhận xét là người như thế nào?","opts":["Có tấm lòng nhân từ, có những ý nghĩ tốt lành, mơ ước tốt đẹp cho học trò","Nghiêm khắc, lạnh lùng","Hay quên và cẩu thả","Chỉ thích chơi"],"a":0,"why":"SGK tr.78 trích lời người kể: học sinh yêu mến thầy vì tấm lòng nhân từ, ý nghĩ tốt lành, ước mơ về tương lai của các em.","wrong":[null,"Thầy được yêu mến, không lạnh lùng.","Thầy lo từng việc cho lớp học, không cẩu thả.","Thầy hết lòng với học trò, không chỉ thích chơi."],"pid":"s3b","muc":"hieu"},{"id":"3s5","bai":3,"tag":"doc","type":"mc","q":"Từ “hãy” được lặp lại nhiều lần trong phần (4) (“Hãy nhìn đi, hãy nghiên cứu, chọn lọc…”) là phó từ chỉ ý nghĩa gì?","opts":["Sự cầu khiến, mệnh lệnh – như lời tự nhắc, thúc giục người hoạ sĩ","Thời gian đã qua","Mức độ cao","Sự phủ định"],"a":0,"why":"Phó từ “hãy” đứng trước động từ, chỉ sự cầu khiến; lặp lại nhiều lần tạo nhịp điệu thúc giục (SGK tr.72).","wrong":[null,"Chỉ thời gian đã qua là “đã”.","Chỉ mức độ là “lắm, rất”.","Chỉ phủ định là “không, chưa”."],"pid":"s3b","muc":"vd"},{"id":"3s6","bai":3,"tag":"doc","type":"mc","q":"Hình ảnh “Cánh buồm giương to như mảnh hồn làng” dùng biện pháp tu từ nào?","opts":["So sánh","Nói giảm nói tránh","Điệp ngữ","Liệt kê"],"a":0,"why":"Có từ “như” nối cánh buồm với mảnh hồn làng nên đây là so sánh, làm cánh buồm trở nên thiêng liêng, gắn với làng chài.","wrong":[null,"Không có cách nói nhẹ đi để tránh đau buồn.","Không có từ ngữ nào lặp lại để nhấn mạnh.","Câu không liệt kê nhiều sự vật."],"pid":"s3c","muc":"hieu"},{"id":"4t1","bai":4,"tag":"doc","type":"mc","q":"Hình ảnh trong thơ có đặc điểm gì?","opts":["Có nguồn gốc từ đời sống nhưng mang dấu ấn tưởng tượng và tình cảm của nhà thơ","Chỉ là sao chép nguyên cảnh thật","Không liên quan đến cảm xúc","Chỉ gồm các con số"],"a":0,"why":"Theo SGK (tr.89): hình ảnh có nguồn gốc từ đời sống nhưng luôn mang dấu ấn hư cấu, tưởng tượng, in đậm tình cảm, cảm xúc chủ quan của nhà thơ.","wrong":[null,"Thơ không chép nguyên cảnh thật.","Hình ảnh là phương tiện để bộc lộ cảm xúc.","Thơ không chỉ gồm con số."]},{"id":"4t2","bai":4,"tag":"doc","type":"mc","q":"Người đọc nhận biết nhịp thơ qua điều gì?","opts":["Các điểm ngắt, ngừng trên dòng thơ hoặc giữa các dòng thơ","Màu sắc của trang giấy","Số trang của bài thơ","Tên nhà xuất bản"],"a":0,"why":"Theo SGK: nhịp thơ nhận biết qua hệ thống điểm ngắt, ngừng, chịu chi phối bởi cảm xúc và quy định của từng thể thơ.","wrong":[null,"Màu giấy không liên quan.","Số trang không liên quan.","Tên nhà xuất bản không liên quan."]},{"id":"4s1","bai":4,"tag":"doc","type":"mc","q":"Ở khổ thơ đầu của “Mùa xuân nho nhỏ”, nhà thơ miêu tả mùa xuân qua hình ảnh nào?","opts":["Dòng sông xanh, bông hoa tím biếc, chim chiền chiện hót vang","Cánh đồng lúa chín và tiếng trống hội","Tuyết trắng và cây thông","Ngọn lửa trại và tiếng đàn"],"a":0,"why":"Mở đầu bài thơ là dòng sông xanh, bông hoa tím biếc và tiếng chim chiền chiện “hót chi mà vang trời” (tr.90–91).","wrong":[null,"Đó không phải cảnh ở khổ đầu.","Bài thơ không nhắc tới tuyết.","Đó không phải cảnh ở khổ đầu."],"pid":"s4a","muc":"biet"},{"id":"4s2","bai":4,"tag":"doc","type":"mc","q":"Nhà thơ muốn làm “con chim”, “một cành hoa”, “một nốt trầm”. Điều đó thể hiện ước nguyện gì?","opts":["Muốn đem sự sống nhỏ bé của mình góp vào cuộc đời chung, đất nước","Muốn trở thành người nổi tiếng","Muốn rời xa mọi người","Muốn nghỉ ngơi một mình"],"a":0,"why":"Những hình ảnh nhỏ bé, đẹp đẽ gửi gắm ước nguyện cống hiến thầm lặng cho đất nước, cho mùa xuân chung.","wrong":[null,"Bài thơ không nói đến danh tiếng.","Nhà thơ hoà vào cuộc đời chung, không rời xa.","Bài thơ nói về sự cống hiến, không phải nghỉ ngơi."],"pid":"s4a","muc":"vd"},{"id":"4s3","bai":4,"tag":"doc","type":"mc","q":"Phần đầu bài thơ tác giả xưng “tôi”, về sau xưng “ta”. Cách đổi này có ý nghĩa gì?","opts":["Từ cái riêng của cá nhân mở rộng thành cái chung của cộng đồng, đất nước","Do tác giả viết nhầm","Do hai người khác nhau viết","Không có ý nghĩa gì"],"a":0,"why":"Đây là câu hỏi 6 trong SGK (tr.92). Cách xưng “ta” thể hiện cái tôi riêng hoà vào ước nguyện chung của cả cộng đồng.","wrong":[null,"Đây là chủ ý nghệ thuật, không phải viết nhầm.","Bài thơ của một tác giả.","Sự thay đổi xưng hô có ý nghĩa nghệ thuật."],"pid":"s4a","muc":"vd"},{"id":"4s4","bai":4,"tag":"doc","type":"mc","q":"Câu thơ “Ao làng trăng tắm, mây bơi” dùng biện pháp tu từ nào?","opts":["Nhân hoá","So sánh","Nói giảm nói tránh","Điệp ngữ"],"a":0,"why":"Trăng “tắm”, mây “bơi” là hành động của con người gán cho sự vật nên cảnh làng quê trở nên sinh động, có hồn (tr.95).","wrong":[null,"Câu không có từ “như” để so sánh.","Không có cách nói tránh trực tiếp.","Không có từ nào lặp lại."],"pid":"s4b","muc":"hieu"},{"id":"4s5","bai":4,"tag":"doc","type":"mc","q":"“Nước trong như nước mắt người tôi yêu” là phép so sánh. Hiệu quả của nó là gì?","opts":["Làm nổi bật vẻ trong trẻo của nước và tình cảm trìu mến của nhà thơ","Làm câu thơ dài hơn","Gây cảm giác sợ hãi","Không có tác dụng gì"],"a":0,"why":"So sánh nước ao với “nước mắt người tôi yêu” vừa gợi độ trong, vừa gửi gắm tình thương.","wrong":[null,"Mục đích không phải kéo dài câu.","Bài thơ nhẹ nhàng, không gây sợ hãi.","Biện pháp tu từ luôn có tác dụng biểu đạt."],"pid":"s4b","muc":"vd"},{"id":"4s6","bai":4,"tag":"doc","type":"mc","q":"Văn bản 3 “Bài thơ Đường núi của Nguyễn Đình Thi” do ai viết, thuộc dạng nào?","opts":["Vũ Quần Phương – bài viết cảm nhận về bài thơ “Đường núi”","Nguyễn Đình Thi – chính bài thơ “Đường núi”","Thanh Hải – bài thơ về mùa xuân","Lò Ngân Sủn – bài thơ biên giới"],"a":0,"why":"Theo mục lục SGK, đây là bài viết của Vũ Quần Phương về bài thơ “Đường núi” của Nguyễn Đình Thi.","wrong":[null,"Nguyễn Đình Thi là tác giả bài thơ được bàn tới, không phải người viết bài này.","Thanh Hải là tác giả “Mùa xuân nho nhỏ”.","Lò Ngân Sủn là tác giả “Chiều biên giới”."],"pid":"s4c","muc":"biet"},{"id":"5t1","bai":5,"tag":"doc","type":"mc","q":"Tuỳ bút là thể loại văn xuôi thuộc loại hình nào, điểm tựa của nó là gì?","opts":["Loại hình kí; điểm tựa là cái tôi của tác giả","Loại hình kịch; điểm tựa là xung đột","Loại hình thơ; điểm tựa là vần","Loại hình truyện; điểm tựa là cốt truyện"],"a":0,"why":"Theo SGK (tr.106): tuỳ bút thuộc loại hình kí, điểm tựa là cái tôi của tác giả, thiên về trữ tình.","wrong":[null,"Tuỳ bút không phải kịch.","Tuỳ bút là văn xuôi, không phải thơ.","Tuỳ bút không nhất thiết có cốt truyện."]},{"id":"5t2","bai":5,"tag":"tv","type":"mc","q":"Ngôn ngữ vùng miền (phương ngữ) là gì?","opts":["Biến thể theo mỗi địa phương của một ngôn ngữ, thể hiện chủ yếu ở ngữ âm và từ vựng","Ngôn ngữ của người nước ngoài","Một thể thơ","Cách viết hoa tên riêng"],"a":0,"why":"Ví dụ: cá quả – cá tràu – cá lóc; lợn – heo; ngã – bổ – té (SGK tr.106).","wrong":[null,"Đó không phải ngoại ngữ.","Đó không phải thể thơ.","Đó không phải quy tắc viết hoa."]},{"id":"5t3","bai":5,"tag":"viet","type":"mc","q":"Trong một bản tường trình, phần nào ghi ngay dưới quốc hiệu, tiêu ngữ?","opts":["Địa điểm, thời gian viết; rồi tên văn bản “BẢN TƯỜNG TRÌNH” và dòng “Về việc…”","Chữ kí của người viết","Lời cam đoan","Nội dung vụ việc"],"a":0,"why":"Thể thức (SGK tr.120): quốc hiệu, tiêu ngữ → địa điểm, thời gian → tên văn bản → Kính gửi → thông tin người viết → nội dung → cam đoan, đề nghị → kí tên.","wrong":[null,"Chữ kí ở cuối.","Cam đoan nằm gần cuối.","Nội dung nằm sau phần Kính gửi và thông tin người viết."]},{"id":"5t4","bai":5,"tag":"viet","type":"mc","q":"Người viết bản tường trình là ai?","opts":["Người có liên quan đến vụ việc, có trách nhiệm cung cấp thông tin trung thực","Bất kì ai không biết gì về vụ việc","Người nhận bản tường trình","Chỉ giáo viên"],"a":0,"why":"Theo SGK: người viết tường trình là người có liên quan đến vụ việc và phải cung cấp thông tin xác thực theo phạm vi quan sát của mình.","wrong":[null,"Người không biết vụ việc không thể tường trình.","Người nhận là cá nhân/cơ quan xử lí vụ việc.","Học sinh cũng có thể viết khi có liên quan."]},{"id":"5t5","bai":5,"tag":"viet","type":"mc","q":"Ở cuối bản tường trình cần có gì?","opts":["Lời cam đoan trung thực, lời hứa hoặc đề nghị, chữ kí và họ tên đầy đủ","Chỉ cần chữ kí","Hình vẽ minh hoạ","Danh sách bạn bè"],"a":0,"why":"SGK (tr.120): ghi lời cam đoan về sự khách quan, trung thực cùng lời hứa/đề nghị, sau cùng kí và ghi đầy đủ họ tên.","wrong":[null,"Cần cả cam đoan và họ tên.","Không cần hình vẽ.","Không cần danh sách bạn bè."]},{"id":"5s1","bai":5,"tag":"doc","type":"mc","q":"“Mùa xuân của tôi”, “mùa xuân của Hà Nội thân yêu” trong bài của Vũ Bằng cho thấy điều gì về người viết?","opts":["Tình cảm riêng, gắn bó sâu nặng với mùa xuân và Hà Nội – đúng với “cái tôi” của tuỳ bút","Người viết không thích mùa xuân","Người viết chỉ kể sự kiện lịch sử","Người viết không có cảm xúc riêng"],"a":0,"why":"Đây là câu hỏi 5 trong SGK. Cách viết “của tôi” bộc lộ cái tôi và tình cảm riêng của tác giả.","wrong":[null,"Tác giả yêu nhất mùa xuân.","Đây là văn trữ tình, không phải ghi sự kiện lịch sử.","Cảm xúc riêng là điểm tựa của tuỳ bút."],"pid":"s5a","muc":"hieu"},{"id":"5s2","bai":5,"tag":"doc","type":"mc","q":"Tác giả cho rằng “một món ăn đặc sản cũng giống như…” cái gì?","opts":["Một di tích văn hoá","Một bộ đồ chơi","Một tờ báo","Một trận đấu"],"a":0,"why":"Đây là ý trong câu hỏi 4 của SGK (tr.116): món ăn đặc sản mang giá trị văn hoá, cần gìn giữ.","wrong":[null,"Không so sánh với đồ chơi.","Không so sánh với tờ báo.","Không so sánh với trận đấu."],"pid":"s5b","muc":"hieu"},{"id":"5s3","bai":5,"tag":"doc","type":"mc","q":"Từ ngữ let AC=null;
function beep(kind){
  if(!S.tamam||CHUP) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime; const seq = kind==='ok'?[[660,0],[880,.11],[1175,.22]]: kind==='bad'?[[220,0],[170,.12]] : [[784,0],[988,.12],[1319,.24],[1568,.36]];
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='bad'?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.2);o.connect(g).connect(AC.destination);o.start(t+d);o.stop(t+d+.22)});
  }catch(e){}
}
let CF=[];
function confetti(n=90){
  if(CHUP||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#cf'); c.width=innerWidth; c.height=innerHeight; const x=c.getContext('2d');
  const cols=['#ffc933','#d6336c','#1a73e8','#1f9d55','#7c5cff','#2ad1bd'];
  for(let i=0;i<n;i++) CF.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.4,vx:(Math.random()-.5)*9,vy:-Math.random()*10-3,r:Math.random()*6+3,c:pick(cols),a:Math.random()*6,life:0});
  (function step(){ x.clearRect(0,0,c.width,c.height); CF.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.life++;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    CF=CF.filter(p=>p.life<110&&p.y<innerHeight+20); if(CF.length) requestAnimationFrame(step); else x.clearRect(0,0,c.width,c.height); })();
}

/* ---------- phiên luyện ---------- */
const RANK={biet:0,hieu:1,vd:2};
function vLuyen(q){
  const mode=q.mode||'kt', n=+q.bai||0; let items=[], title='';
  if(mode==='tong'){ items=shuf(D.cau).slice(0,15); title='Tổng ôn học kì I'; }
  else if(mode==='tag'){ items=shuf(D.cau.filter(c=>c.tag===q.tag)).slice(0,10); title='Luyện: '+TAGN[q.tag]; }
  else if(mode==='doc'){ items=D.cau.filter(c=>c.bai===n&&isDoc(c)).sort((a,b)=>(RANK[a.muc]-RANK[b.muc])||((a.type==='mc'?0:1)-(b.type==='mc'?0:1))); title='Thám tử văn bản · Bài '+n; }
  else if(mode==='kn'){ items=shuf(D.cau.filter(c=>c.bai===n&&isViet(c))); title='Xây đoạn văn · Bài '+n; }
  else { items=shuf(D.cau.filter(c=>c.bai===n&&isKT(c))).slice(0,10); title='Phòng kiến thức · Bài '+n; }
  sess={mode,bai:n,tag:q.tag,items,idx:0,fr:[],run:0,title};
  if(q.i!==undefined) sess.idx=Math.min(+q.i,items.length-1);
  if(q.end) { sess.fr=items.map((_,i)=>i%4===3?.5:1); sess.idx=items.length; }
  drawQ();
}
function dotsHtml(){ return '<div class="dots">'+sess.items.map((_,i)=>{const f=sess.fr[i];return `<span class="dot ${f===undefined?(i===sess.idx?'cur':''):f>=.999?'ok':f>0?'mid':'bad'}"></span>`}).join('')+'</div>'; }
function doanOf(it){return D.doan.find(x=>x.id===it.pid)}
function pBox(d,note){ if(d.sgk) return `<div class="passage sgk"><b>📖 Mở sách Ngữ văn 7, tập một, ${esc(d.tr)}</b>\nĐọc văn bản “${esc(d.tieude)}” trong sách rồi trả lời nhé. Cần thì mở sách ra đối chiếu từng chi tiết.<small>Câu hỏi bám SGK Ngữ văn 7 (KNTT). Số trang theo bản sách cô giáo nạp; nếu sách của em lệch trang, em tìm theo tên văn bản.</small></div>`;
  return `<div class="passage"><b>${esc(d.tieude)}</b>\n${esc(d.s.join(d.tho?'\n':' '))}<small>${note}</small></div>`; }
function passageHtml(it){ if(!it.pid||it.type==='evid') return ''; const d=doanOf(it); return pBox(d,'Đoạn luyện kĩ năng do trợ lý tự viết, không trích từ SGK.'); }
function evidHtml(it){ const d=doanOf(it); return `<div class="passage"><b>${esc(d.tieude)}</b><div style="margin-top:4px">${d.s.map((t,i)=>`<button class="sent" data-act="ev" data-i="${i}">${esc(t)}</button>${d.tho?'<br>':' '}`).join('')}</div><small>Chạm vào câu để gạch chân bằng chứng. Chạm lần nữa để bỏ chọn. Đoạn do trợ lý viết, không trích từ SGK.</small></div>`; }
function drawQ(){
  if(sess.idx>=sess.items.length) return endSess();
  const it=sess.items[sess.idx];
  qs={locked:false,mis:0,sel:null,done:new Set(),next:0,ev:new Set()};
  let body='', pre='';
  if(it.type==='mc'){ qs.perm=shuf(it.opts.map((_,i)=>i)); body=`<div class="opts">${qs.perm.map(k=>`<button class="opt" data-act="mc" data-k="${k}">${esc(it.opts[k])}</button>`).join('')}</div>`; }
  else if(it.type==='match'){ qs.L=shuf(it.pairs.map((_,i)=>i)); qs.R=shuf(it.pairs.map((_,i)=>i));
    body=`<p class="mut">Chạm một ô bên trái, rồi chạm ô bên phải ghép đôi với nó.</p><div class="cols"><div class="opts">${qs.L.map(i=>`<button class="pill" data-act="mL" data-i="${i}">${esc(it.pairs[i][0])}</button>`).join('')}</div><div class="opts">${qs.R.map(i=>`<button class="pill" data-act="mR" data-i="${i}">${esc(it.pairs[i][1])}</button>`).join('')}</div></div>`; }
  else if(it.type==='sort'){ qs.pool=shuf(it.items.map((_,i)=>i));
    body=`<p class="mut">Chạm một thẻ, rồi chạm vào ô nhóm mà em cho là đúng.</p><div class="bins">${it.bins.map((b,k)=>`<div class="bin" data-act="sb" data-b="${k}" role="button" tabindex="0"><h4>${esc(b)}</h4><div class="in"></div></div>`).join('')}</div><div class="pool" id="pool">${qs.pool.map(i=>`<button class="pill" data-act="sc" data-i="${i}">${esc(it.items[i][0])}</button>`).join('')}</div>`; }
  else if(it.type==='order'){ qs.pool=shuf(it.items.map((_,i)=>i));
    body=`<p class="mut">Chạm lần lượt các thẻ theo đúng thứ tự từ trên xuống.</p><div class="slots">${it.items.map((_,i)=>`<div class="slot" id="sl${i}"><b>${i+1}</b><span></span></div>`).join('')}</div><div class="pool" id="pool">${qs.pool.map(i=>`<button class="pill" data-act="oc" data-i="${i}">${esc(it.items[i])}</button>`).join('')}</div>`; }
  else if(it.type==='evid'){ pre=evidHtml(it); body=`<div class="row"><button class="btn" id="evchk" data-act="evchk" disabled>Kiểm tra bằng chứng</button><span class="mut" id="evn">Chưa chọn câu nào</span></div>`; }
  else if(it.type==='short'){ body=`<p class="hint">${esc(it.goi||'')}</p><textarea id="sh" rows="3" placeholder="Viết câu trả lời của em ở đây…"></textarea><div class="row" style="margin-top:8px"><button class="btn vang nho" id="shshow" data-act="shshow" disabled>Xem đáp án mẫu</button><span class="hint" id="shn">Viết ít nhất 6 tiếng để mở đáp án mẫu</span></div><div id="shbox"></div>`; }
  $('#app').innerHTML = `<div class="card pop"><div class="row"><span class="tagchip t-${it.tag}">${esc(TAGN[it.tag])}</span>${it.muc?`<span class="tagchip m-${it.muc}">${MUCN[it.muc]}</span>`:''}<span class="mut">${esc(sess.title)} · Câu ${sess.idx+1}/${sess.items.length}</span></div>${dotsHtml()}${pre||passageHtml(it)}<div class="q">${esc(it.q)}</div>${body}<div id="fb"></div></div>`;
}
function record(it,frac){
  const t=S.tag[it.tag]||(S.tag[it.tag]={c:0,t:0}); t.c+=frac; t.t+=1; S.xp+=Math.round(10*frac);
  if(frac>=.999){ sess.run=(sess.run||0)+1; } else sess.run=0;
  if(sess.run>=5) badge('tham-tu');
  const d=hom(); if(S.ngay!==d){ const hq=new Date(); hq.setDate(hq.getDate()-1); const hqs=hq.getFullYear()+'-'+(hq.getMonth()+1)+'-'+hq.getDate(); S.chuoi = S.ngay===hqs? S.chuoi+1 : 1; S.ngay=d; }
  if(S.chuoi>=3) badge('chuoi3');
  save(); drawTop();
}
function badge(id){ if(S.badges[id]||DEMO) return; S.badges[id]=1; const b=BADGES.find(x=>x.id===id); confetti(60); beep('win'); toast(`${b.ic} Huy hiệu mới: <b>${esc(b.ten)}</b>`); save(); }
function toast(h){ const e=document.createElement('div'); e.style.cssText='position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:70;background:#fff;border:2px solid #ffc933;border-radius:16px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-weight:700;max-width:90vw'; e.className='pop'; e.innerHTML=h; document.body.appendChild(e); setTimeout(()=>e.remove(),3200); }
function finishItem(frac, msg){
  const it=sess.items[sess.idx]; qs.locked=true; sess.fr[sess.idx]=frac; record(it,frac);
  const good=frac>=.999; beep(good?'ok':'bad'); if(good) confetti(26);
  const last = sess.idx>=sess.items.length-1;
  $('#fb').innerHTML = `<div class="fb ${good?'good':'bad'} pop">${mascot(good?'vui':'buon',64)}<div class="bubble"><b>${good?pick(KHEN):(frac>0?'Gần đúng rồi!':pick(DONG))}</b> ${msg?esc(msg)+' ':''}${it.type==='mc'&&!good?`Đáp án đúng: <b>${esc(it.opts[it.a])}</b>. `:''}${esc(it.why||'')}<div style="margin-top:10px"><button class="btn ${good?'xanh':''}" data-act="next">${last?'Xem kết quả':'Câu tiếp theo'} ➜</button></div></div></div>`;
  $('#fb').scrollIntoView({block:'nearest',behavior:CHUP?'auto':'smooth'});
}
function endSess(){
  const n=sess.items.length, tot=sess.fr.reduce((a,b)=>a+(b||0),0), pct=n?tot/n:0;
  const pk = {kt:'kt',doc:'doc',kn:'viet'}[sess.mode]; let got=false;
  if(pk && sess.bai){ const key=pk+sess.bai; S.best[key]=Math.max(S.best[key]||0,pct); if(pct>=.7 && !pil(sess.bai)[pk]){ pil(sess.bai)[pk]=1; got=true; } checkPil(sess.bai); }
  if(sess.mode==='tong' && pct>=.8) badge('tong-on');
  save(); drawTop();
  if(pct>=.7){ confetti(120); beep('win'); }
  const r=52, C=2*Math.PI*r; const mood=pct>=.7?'vui':'buon';
  const sai = sess.items.filter((_,i)=>(sess.fr[i]||0)<.999);
  const tagBad = {}; sai.forEach(it=>tagBad[it.tag]=(tagBad[it.tag]||0)+1);
  const yeu = Object.entries(tagBad).sort((a,b)=>b[1]-a[1])[0];
  const lai = sess.mode==='tong'?'luyen&mode=tong':sess.mode==='tag'?'luyen&mode=tag&tag='+sess.tag:'luyen&bai='+sess.bai+'&mode='+sess.mode;
  $('#app').innerHTML = `<div class="card pop" style="text-align:center">${mascot(mood,96)}
  <h2>${pct>=.9?'Tuyệt vời!':pct>=.7?'Giỏi lắm!':pct>=.5?'Cố gắng tốt!':'Mình thử lại nhé!'}</h2>
  <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#e3ebf3" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${pct>=.7?'#1f9d55':pct>=.5?'#f59f00':'#d6336c'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="900" fill="#10283d">${Math.round(pct*100)}%</text></svg>
  ${pk&&sess.bai?`<div class="stars" style="margin:8px 0"><div style="width:52px">${starSvg(!!pil(sess.bai)[pk],PIL[pk].mau)}</div></div><p class="mut">${got?`Em vừa nhận sao <b>${PIL[pk].ten}</b> của Bài ${sess.bai}!`:pil(sess.bai)[pk]?`Em đã có sao ${PIL[pk].ten}. Kỉ lục: ${Math.round(S.best[pk+sess.bai]*100)}%`:`Cần đạt từ 70% để nhận sao ${PIL[pk].ten}.`}</p>`:''}
  <p>Em trả lời đúng hoàn toàn <b>${sess.fr.filter(f=>f>=.999).length}/${n}</b> câu.${yeu?` Cần luyện thêm: <span class="tagchip t-${yeu[0]}">${esc(TAGN[yeu[0]])}</span>`:''}</p>
  <div class="row" style="justify-content:center">
   <button class="btn vang" data-go="${lai}">Làm lại 🔁</button>
   ${yeu?`<button class="btn phu" data-go="luyen&mode=tag&tag=${yeu[0]}">Luyện đúng chỗ yếu</button>`:''}
   <button class="btn phu" data-go="${sess.bai?'chang&bai='+sess.bai:'ban-do'}">Về chặng</button></div></div>`;
}
function checkPil(n){ const s=sao(n); if(s>=1) badge('chang'+n); if(s>=3) badge('sao-vang'); if(D.bai.filter(b=>(S.pil[b.n]||{}).doc).length>=3) badge('doc-gia'); }

function actMc(k){
  if(qs.locked) return; const it=sess.items[sess.idx]; const ok = k===it.a;
  $$('.opt').forEach(b=>{const kk=+b.dataset.k; b.disabled=true; if(kk===it.a) b.classList.add('ok'); else if(kk===k) b.classList.add('bad')});
  if(!ok) $$('.opt').find(b=>+b.dataset.k===k).classList.add('shake');
  finishItem(ok?1:0, ok?'':(it.wrong&&it.wrong[k])||'');
}
function actML(i){ if(qs.locked||qs.done.has(i)) return; qs.sel=i; $$('[data-act=mL]').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i)); }
function actMR(i){ if(qs.locked||qs.done.has(i)) return; const it=sess.items[sess.idx]; const bR=$$('[data-act=mR]').find(b=>+b.dataset.i===i);
  if(qs.sel===null){ bR.classList.add('shake'); setTimeout(()=>bR.classList.remove('shake'),400); return; }
  const bL=$$('[data-act=mL]').find(b=>+b.dataset.i===qs.sel);
  if(qs.sel===i){ qs.done.add(i); bL.classList.remove('sel'); bL.classList.add('ok'); bR.classList.add('ok'); beep('ok'); qs.sel=null;
    if(qs.done.size===it.pairs.length) finishItem(Math.max(0,1-qs.mis/it.pairs.length), qs.mis?`Em ghép nhầm ${qs.mis} lần.`:''); }
  else { qs.mis++; beep('bad'); [bL,bR].forEach(b=>{b.classList.add('bad','shake')}); setTimeout(()=>[bL,bR].forEach(b=>b.classList.remove('bad','shake')),500); bL.classList.remove('sel'); qs.sel=null; }
}
function actSC(i){ if(qs.locked) return; qs.sel=i; $$('[data-act=sc]').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i)); $$('.bin').forEach(b=>b.classList.add('hot')); }
function actSB(bi){ if(qs.locked) return; if(qs.sel===null){ toast('Chạm một thẻ ở dưới trước nhé'); return; }
  const it=sess.items[sess.idx]; const chip=$$('[data-act=sc]').find(b=>+b.dataset.i===qs.sel); const binEl=$$('.bin').find(b=>+b.dataset.b===bi);
  if(it.items[qs.sel][1]===bi){ const s=document.createElement('span'); s.className='chip2 pop'; s.textContent=it.items[qs.sel][0]; $('.in',binEl).appendChild(s); chip.remove(); qs.sel=null; beep('ok'); $$('.bin').forEach(b=>b.classList.remove('hot'));
    if(!$$('[data-act=sc]').length) finishItem(Math.max(0,1-qs.mis/it.items.length), qs.mis?`Em xếp nhầm ${qs.mis} lần.`:''); }
  else { qs.mis++; beep('bad'); binEl.classList.add('bad','shake'); chip.classList.add('bad','shake'); setTimeout(()=>{binEl.classList.remove('bad','shake'); chip.classList.remove('bad','shake')},500); }
}
function actOC(i){ if(qs.locked) return; const it=sess.items[sess.idx]; const chip=$$('[data-act=oc]').find(b=>+b.dataset.i===i);
  if(i===qs.next){ const sl=$('#sl'+i); sl.classList.add('fill','pop'); $('span',sl).textContent=it.items[i]; chip.remove(); qs.next++; beep('ok');
    if(qs.next===it.items.length) finishItem(Math.max(0,1-qs.mis/it.items.length), qs.mis?`Em chọn nhầm thứ tự ${qs.mis} lần.`:''); }
  else { qs.mis++; beep('bad'); chip.classList.add('bad','shake'); setTimeout(()=>chip.classList.remove('bad','shake'),500); }
}
function actEv(i){ if(qs.locked) return; if(qs.ev.has(i)) qs.ev.delete(i); else qs.ev.add(i);
  $$('.sent').forEach(b=>b.classList.toggle('on',qs.ev.has(+b.dataset.i))); $('#evchk').disabled=!qs.ev.size; $('#evn').textContent=qs.ev.size?`Đã chọn ${qs.ev.size} câu`:'Chưa chọn câu nào'; }
function actEvChk(){ if(qs.locked||!qs.ev.size) return; const it=sess.items[sess.idx]; const ans=new Set(it.ans); let inter=0, thua=0;
  const uni=new Set([...ans,...qs.ev]);
  $$('.sent').forEach(b=>{const i=+b.dataset.i; b.classList.remove('on'); if(ans.has(i)&&qs.ev.has(i)){b.classList.add('ok');inter++} else if(qs.ev.has(i)){b.classList.add('bad');thua++} else if(ans.has(i)) b.classList.add('miss'); b.disabled=true});
  $('#evchk').disabled=true;
  finishItem(inter/uni.size, inter===ans.size&&!thua?'':`Em tìm đúng ${inter}/${ans.size} câu bằng chứng${thua?`, chọn thừa ${thua} câu`:''} (ô viền xanh là câu còn thiếu).`); }
function actShShow(){ const it=sess.items[sess.idx]; const ta=$('#sh'); ta.readOnly=true; $('#shshow').disabled=true;
  $('#shbox').innerHTML=`<div class="mau"><b>Đáp án mẫu</b> (em đối chiếu rồi sửa lại bài của mình nhé):<br>${esc(it.mau)}</div><div class="ychk"><b>Tự chấm: bài của em đã có những ý nào?</b>${it.y.map((t,i)=>`<label><input type="checkbox" data-yc="${i}"><span>${esc(t)}</span></label>`).join('')}</div><button class="btn xanh" data-act="shdone" style="margin-top:8px">Em chấm xong rồi ✔</button><p class="hint">Hãy chấm trung thực. Mực Nhí tin em!</p>`; }
function actShDone(){ if(qs.locked) return; const it=sess.items[sess.idx]; const k=$$('[data-yc]:checked').length; $$('[data-yc]').forEach(c=>c.disabled=true); $('[data-act=shdone]').remove();
  finishItem(k/it.y.length, `Em tự chấm được ${k}/${it.y.length} ý.`); }

function vietText(n){ const V=VIET[n], st=S.viet[n];

function soi(txt,V,n){
  const t=txt.trim(); if(!t) return null;
  const sents=t.replace(/([.!?…]+)\s+/g,'$1\u0001').split(/\u0001|\n+/).map(x=>x.trim()).filter(Boolean);
  const toks=t.split(/\s+/).filter(Boolean); const nW=toks.length;
  const lens=sents.map(s=>s.split(/\s+/).length); const avg=Math.round(lens.reduce((a,b)=>a+b,0)/lens.length); const mx=Math.max(...lens);
  const low=' '+t.toLowerCase().replace(/[“”"(),;:.!?…]/g,' ').replace(/\s+/g,' ')+' ';
  const noi=NOI.filter(w=>low.includes(' '+w+' '));
  const fr={}; low.trim().split(' ').forEach(w=>{ if(w.length>=2&&!STOP.has(w)) fr[w]=(fr[w]||0)+1 });
  const lap=Object.entries(fr).filter(([w,c])=>c>=4).sort((a,b)=>b[1]-a[1])[0];
  const thap=sents.filter(s=>{const c=s.replace(/^[“"\-–\s]+/,'')[0]; return c&&c!==c.toLocaleUpperCase('vi')}).length;
  const tips=[];
  tips.push(nW<V.min?{k:'warn',t:`📏 Mới ${nW} tiếng, gợi ý từ ${V.min} tiếng. Thử thêm ý hoặc dẫn chứng.`}: nW>V.max?{k:'warn',t:`📏 Đã ${nW} tiếng, hơi dài so với gợi ý (${V.min}–${V.max}). Thử bỏ ý phụ.`}:{k:'ok',t:`✅ Độ dài ${nW} tiếng, phù hợp gợi ý (${V.min}–${V.max}).`});
  tips.push(mx>35?{k:'warn',t:`✂️ Có câu dài ${mx} tiếng, thử tách thành hai câu cho dễ đọc.`}:{k:'ok',t:`✅ Câu dài vừa phải (trung bình ${avg} tiếng).`});
  tips.push(noi.length>=2?{k:'ok',t:`✅ Có từ nối: ${noi.slice(0,4).join(', ')}.`}:{k:'warn',t:'🔗 Thử thêm từ nối (trước hết, sau đó, bên cạnh đó, cuối cùng…) để các ý liền mạch.'});
  tips.push(lap?{k:'warn',t:`🔁 Từ “${lap[0]}” xuất hiện ${lap[1]} lần. Thử thay bằng từ khác.`}:{k:'ok',t:'✅ Chưa thấy từ nào lặp quá nhiều.'});
  if(thap) tips.push({k:'warn',t:`🔤 Có ${thap} câu chưa viết hoa chữ cái đầu.`});
  if(!/[.!?…”"]$/.test(t)) tips.push({k:'warn',t:'🔚 Cuối bài chưa có dấu chấm câu.'});
  if(V.chk.includes('hinh')) tips.push(/(^|\s)(như|tựa|giống như|chẳng khác gì)(\s|$)/i.test(t)?{k:'ok',t:'✅ Có hình ảnh so sánh (như, tựa…).'}:{k:'i',t:'🎨 Chưa thấy so sánh “như/tựa”. Thử thêm một hình ảnh cho câu văn sinh động.'});
  if(V.chk.includes('camxuc')) tips.push(/(yêu|thương|nhớ|xúc động|tự hào|biết ơn|bồi hồi|nao nao|ấm áp|vui|buồn|xao xuyến)/i.test(t)?{k:'ok',t:'✅ Có từ ngữ bộc lộ cảm xúc.'}:{k:'warn',t:'💗 Chưa thấy từ chỉ cảm xúc (yêu thương, nhớ, xúc động, tự hào…).'});
  if(V.chk.includes('trich')) tips.push(/[“"]/.test(t)?{k:'ok',t:'✅ Có trích dẫn trong dấu ngoặc kép.'}:{k:'i',t:'📌 Thử trích một chi tiết trong “dấu ngoặc kép” làm dẫn chứng.'});
  return {nW,nS:sents.length,avg,mx,tips};
}
function soiTT(st){ const V=VIET[5]; const miss=V.req.filter(k=>!(st.f[k]||'').trim()); const labels={dd:'Địa điểm',nt:'Ngày tháng',kg:'Kính gửi',nguoi:'Người viết',sv:'Nội dung sự việc',nn:'Nguyên nhân, trách nhiệm'};

  save();
