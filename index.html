  <div class="card"><h2>Lưu và chia sẻ</h2><p class="mut">Kết quả được lưu trong trình duyệt của máy này. Em bấm <b>Xuất kết quả</b> gửi file cho cô giáo, hoặc <b>Nhập</b> để mang sang máy khác.</p>
   <div class="row"><button class="btn xanh nho" data-act="xjson">⬇️ Xuất kết quả</button><label class="btn phu nho" style="cursor:pointer">⬆️ Nhập<input type="file" id="imp" accept=".json" hidden></label><button class="btn phu nho" data-act="doima">Đổi mã / biệt danh</button><button class="btn phu nho" data-act="xoa" style="color:#d6336c;border-color:#d6336c">Xoá dữ liệu</button><button class="btn phu nho" data-go="lop">Dành cho giáo viên</button></div></div>`;
}
function exportObj(){ const stars={}; D.bai.forEach(b=>stars[b.n]=sao(b.n)); return {app:'van7-hk1',ma:S.ma,ngay:new Date().toISOString().slice(0,10),xp:S.xp,chuoi:S.chuoi,stars,pil:S.pil,best:S.best,tag:S.tag,badges:Object.keys(S.badges),vietDone:Object.keys(S.vietDone)}; }
function taiFile(name,text,type='application/json'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

/* ---------- Giáo viên ---------- */
let LOP=[];
function vLop(){
  $('#app').innerHTML = `<div class="card"><h1>Dành cho giáo viên</h1><p class="mut">Gộp file kết quả (.json) mà học sinh xuất ra để xem cả lớp mạnh – yếu ở nhóm nào. Dữ liệu chỉ xử lý trên máy này, không gửi đi đâu.</p>
  <div class="row"><label class="btn nho" style="cursor:pointer">📂 Chọn các file kết quả<input type="file" id="gop" accept=".json" multiple hidden></label>
  <button class="btn phu nho" data-act="motat">${S.moTat?'🔒 Tắt mở khoá tất cả':'🔓 Mở khoá tất cả chặng'}</button><button class="btn phu nho" data-go="bao-cao">Về báo cáo</button></div></div><div id="bang"></div>
  <div class="card"><h3>Lưu ý cho giáo viên</h3><p class="mut">Các câu “Đối chiếu sách” và kiến thức Tri thức ngữ văn, Thực hành tiếng Việt, quy trình Viết đã được đối chiếu với SGK Ngữ văn 7 tập một (KNTT) do cô Phương nạp (đọc bằng OCR nên có thể sót lỗi chữ). Các đoạn “Luyện” là đoạn trợ lý tự viết để luyện kĩ năng, không trích từ SGK. Số trang tính theo bản PDF. Nên nhờ giáo viên Ngữ văn soát lần cuối trước khi cho học sinh dùng. Dữ liệu nằm trong file du-lieu.json; sửa xong chạy ghep.py để tạo lại index.html.</p></div>`;
  drawBang();
}
function drawBang(){ const el=$('#bang'); if(!el) return; if(!LOP.length){ el.innerHTML=''; return; }
  const tb = LOP.map(o=>({ma:o.ma||'?',xp:o.xp||0,sao:Object.values(o.stars||{}).reduce((a,b)=>a+b,0),p:TAGK.map(k=>{const t=(o.tag||{})[k]||{c:0,t:0};return t.t?pc(t.c,t.t):null})}));
  const avg=TAGK.map((k,i)=>{const v=tb.map(r=>r.p[i]).filter(x=>x!==null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null});
  el.innerHTML=`<div class="card scroll"><h3>Kết quả ${tb.length} học sinh</h3><table><tr><th>Mã</th><th>XP</th><th>Sao/15</th>${TAGK.map(k=>`<th>${esc(TAGN[k])}</th>`).join('')}</tr>${tb.map(r=>`<tr><td>${esc(r.ma)}</td><td>${r.xp}</td><td>${r.sao}</td>${r.p.map(x=>`<td style="${x!==null&&x<60?'background:#ffe3ee':''}">${x===null?'–':x+'%'}</td>`).join('')}</tr>`).join('')}<tr><th>TB lớp</th><th></th><th></th>${avg.map(x=>`<th>${x===null?'–':x+'%'}</th>`).join('')}</tr></table><p class="hint">Ô nền hồng: dưới 60%, nên ôn lại nhóm kiến thức đó với cả lớp.</p><button class="btn xanh nho" data-act="xcsv">⬇️ Xuất bảng (.csv)</button></div>`; }

/* ---------- Hướng dẫn ---------- */
function vHD(){
  const st=[['1','Nhập mã của em','Dùng mã học sinh hoặc biệt danh. Không ghi họ tên thật.','<circle cx="30" cy="22" r="10" fill="#1a73e8"/><path d="M10 52c2-14 10-18 20-18s18 4 20 18z" fill="#1a73e8"/>'],
   ['2','Chọn một chặng trên bản đồ','Ôn theo thứ tự Bài 1 → Bài 5. Có ít nhất 1 sao thì chặng sau mở ra.','<path d="M8 44 Q30 10 52 30" stroke="#0f9a8d" stroke-width="5" fill="none" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="10" cy="44" r="7" fill="#ffb800"/><circle cx="52" cy="30" r="7" fill="#1f9d55"/>'],
   ['3','Làm Thám tử văn bản','Đọc đoạn văn, chạm để gạch chân câu bằng chứng, trả lời 3 mức. Câu tự luận ngắn thì so với đáp án mẫu rồi tự chấm.','<rect x="8" y="10" width="44" height="6" rx="3" fill="#ffe066"/><rect x="8" y="22" width="44" height="6" rx="3" fill="#ffd43b"/><rect x="8" y="34" width="30" height="6" rx="3" fill="#cfe3ff"/><circle cx="44" cy="44" r="8" fill="none" stroke="#1a73e8" stroke-width="4"/>'],
   ['4','Vào Phòng kiến thức và Xây đoạn văn','Ghép, xếp, chọn đáp án. Mỗi câu có lời giải ngay, sai thì đọc kĩ rồi làm lại.','<rect x="6" y="14" width="22" height="14" rx="5" fill="#ffd43b"/><rect x="32" y="14" width="22" height="14" rx="5" fill="#a5d8ff"/><rect x="6" y="34" width="22" height="14" rx="5" fill="#a5d8ff"/><rect x="32" y="34" width="22" height="14" rx="5" fill="#ffd43b"/>'],
   ['5','Vào Xưởng viết 4 trạm','Chuẩn bị → Tìm ý → Viết → Chỉnh sửa. Máy soi sẽ gợi ý chỗ có thể sửa.','<path d="M12 48 L16 36 L44 8 L52 16 L24 44z" fill="#ffb800"/><path d="M12 48 L16 36 L24 44z" fill="#10283d"/>'],
   ['6','Xem báo cáo của em','Mực Nhí chỉ cho em trụ cột mạnh, nhóm kiến thức cần luyện thêm.','<path d="M10 50V30M24 50V14M38 50V24M52 50H6" stroke="#1f9d55" stroke-width="6" stroke-linecap="round"/>']];
  $('#app').innerHTML = `<div class="hero"><div class="hero-row">${mascot('vui',84)}<div><h1>Cách học cùng Mực Nhí</h1><p>6 bước, mỗi ngày chỉ cần 10 phút</p></div></div></div>
  ${st.map(s=>`<div class="card"><div class="row" style="flex-wrap:nowrap"><svg width="64" height="64" viewBox="0 0 60 60" style="flex:none;background:#eefaf7;border-radius:16px">${s[3]}</svg><div><h3 style="margin:0">Bước ${s[0]}: ${esc(s[1])}</h3><div class="mut">${esc(s[2])}</div></div></div></div>`).join('')}
  <div class="card"><h3>Mẹo nhỏ</h3><ul class="mut" style="margin:0;padding-left:20px"><li>Học đều mỗi ngày thì chuỗi lửa 🔥 sẽ dài hơn.</li><li>Đọc kĩ lời giải của Mực Nhí, đó là cách nhớ lâu nhất.</li><li>Rủ bạn vào <b>Đấu đôi</b> để ôn mà vẫn vui.</li><li>Bài viết và kết quả chỉ lưu trên máy này, nhớ <b>Xuất kết quả</b> gửi cô nhé.</li></ul>
  <div class="row" style="margin-top:12px"><button class="btn vang" data-go="ban-do">Bắt đầu học!</button></div></div>`;
}

/* ---------- sự kiện chung ---------- */
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-act]'); const g=e.target.closest('[data-go]');
  if(a){ const act=a.dataset.act; const A={
    am:()=>{S.tamam=!S.tamam;save();drawTop()},
    luuma:()=>{const v=($('#ma').value||'').trim().replace(/[<>]/g,''); if(!v){$('#ma').classList.add('shake');return} S.ma=v; save(); mo(''); if(!S.tour){S.tour=true;save();go('huong-dan')} else route(); },
    mc:()=>actMc(+a.dataset.k), mL:()=>actML(+a.dataset.i), mR:()=>actMR(+a.dataset.i), sc:()=>actSC(+a.dataset.i), sb:()=>actSB(+a.dataset.b), oc:()=>actOC(+a.dataset.i),
    ev:()=>actEv(+a.dataset.i), evchk:actEvChk, shshow:actShShow, shdone:actShDone,
    next:()=>{sess.idx++; drawQ(); window.scrollTo(0,0)},
    tram:()=>{const n=curN(); S.viet[n].tram=+a.dataset.t; save(); vViet({bai:n}); window.scrollTo(0,0)},
    chen:()=>{ let el=window._lf; if(!el||!document.body.contains(el)) el=$('#txt')||$('#poem')||$('textarea'); if(!el) return; const tx=a.dataset.t; const p0=el.selectionStart==null?el.value.length:el.selectionStart, p1=el.selectionEnd==null?p0:el.selectionEnd; const pre=el.value.slice(0,p0), post=el.value.slice(p1); const sep=(pre&&!/[\s]$/.test(pre))?' ':''; el.value=pre+sep+tx+' '+post; const pos=(pre+sep+tx+' ').length; el.focus(); try{el.setSelectionRange(pos,pos)}catch(_){} el.dispatchEvent(new Event('input',{bubbles:true})); },
    ghep:()=>{const n=curN(); const st=S.viet[n]; const t=VIET[n].compose(st.f); if(st.txt && st.txt.trim() && st.txt.trim()!==t.trim() && !confirm('Bản nháp mới sẽ thay thế bài đang viết. Em đồng ý không?')) return; st.txt=t; st.tram=2; save(); vViet({bai:n}); toast('Đã ghép xong. Em hãy sửa lại bằng lời của mình nhé!')},
    dv:()=>{const n=curN(); S.viet[n].dv=+a.dataset.v; save(); vViet({bai:n})},
    copy:()=>{const n=curN(); const t=vietText(n); (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Đã sao chép!')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép!')}catch(_){toast('Em hãy bôi đen và sao chép thủ công nhé')}ta.remove()})},
    txt:()=>{const n=curN(); taiFile('Van7_Bai'+n+'_'+(S.ma||'HS')+'.txt',vietText(n),'text/plain')},
    batdau:()=>{ const pool=D.cau.filter(c=>c.type==='mc'); const n=+$('#dn').value; duel={n:[($('#p1').value||'Người 1').trim(),($('#p2').value||'Người 2').trim()],items:shuf(pool).slice(0,n),idx:0,sc:[0,0],turn:0,done:false}; vDoi(); },
    dk:()=>actDk(+a.dataset.k), dnext:()=>{duel.idx++; duel.turn=1-duel.turn; drawDuel(); window.scrollTo(0,0)}, doilai:()=>{duel=null; vDoi()},
    xjson:()=>taiFile('Van7_KetQua_'+(S.ma||'HS')+'.json',JSON.stringify(exportObj(),null,1)),
    doima:()=>{S.ma=''; save(); askMa()},
    xoa:()=>{ if(confirm('Xoá toàn bộ kết quả trên máy này?')){ try{localStorage.removeItem(KEY)}catch(_){} S=mac(); route() } },
    motat:()=>{S.moTat=!S.moTat;save();vLop()},
    xcsv:()=>{ const head=['ma','xp','sao_tong',...TAGK.map(k=>TAGN[k])]; const rows=LOP.map(o=>[o.ma,o.xp,Object.values(o.stars||{}).reduce((x,y)=>x+y,0),...TAGK.map(k=>{const t=(o.tag||{})[k];return t&&t.t?pc(t.c,t.t):''})]); taiFile('Van7_KetQua_Lop.csv','﻿'+[head,...rows].map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv') }
  }; if(A[act]) { A[act](); return; } }
  if(g){ if(g.dataset.lock==='1'){ toast('🔒 Hãy được ít nhất 1 sao ở chặng trước nhé!'); beep('bad'); return; } if(!g.dataset.go) return; go(g.dataset.go); }
});
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('.bin,.node')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter' && e.target.id==='ma'){ $('[data-act=luuma]').click(); } });
document.addEventListener('focusin', e=>{ const t=e.target; if(t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type==='text'))&&t.closest&&t.closest('#vietroot')) window._lf=t; });
document.addEventListener('input', e=>{ const t=e.target;
  if(t.id==='sh'){ const w=t.value.trim().split(/\s+/).filter(Boolean).length; const b=$('#shshow'); if(b) b.disabled=w<6; const nn=$('#shn'); if(nn) nn.textContent=w<6?`Mới ${w} tiếng, viết ít nhất 6 tiếng để mở đáp án mẫu`:`${w} tiếng. Em có thể xem đáp án mẫu rồi!`; return; }
  const n=curN(); if(!n) return; const st=S.viet[n];
  if(t.dataset.f){ st.f[t.dataset.f]=t.value; updViet(n); } else if(t.id==='txt'){ st.txt=t.value; updViet(n); } else if(t.id==='poem'){ st.poem=t.value; updViet(n); } });
document.addEventListener('change', e=>{ const t=e.target; const n=curN();
  if(n && t.dataset.r!==undefined){ S.viet[n].r[+t.dataset.r]=t.checked?1:0; updViet(n); }
  if(n && t.dataset.c!==undefined){ S.viet[n].c[+t.dataset.c]=t.checked?1:0; save(); }
  if(t.id==='imp'){ const f=t.files[0]; if(!f) return; f.text().then(x=>{ try{ const o=JSON.parse(x); if(o.app!=='van7-hk1') throw 0; S.ma=o.ma||S.ma; S.xp=o.xp||0; S.chuoi=o.chuoi||0; S.pil=o.pil||{}; S.best=o.best||{}; S.tag=o.tag||{}; S.badges={}; (o.badges||[]).forEach(b=>S.badges[b]=1); S.vietDone={}; (o.vietDone||[]).forEach(b=>S.vietDone[b]=1); save(); route(); toast('Đã nhập kết quả!') }catch(_){ toast('File này không đúng định dạng.') } }); }
  if(t.id==='gop'){ LOP=[]; Promise.all([...t.files].map(f=>f.text().then(x=>{try{const o=JSON.parse(x); if(o.app==='van7-hk1') LOP.push(o)}catch(_){}}))).then(drawBang); } });

route();
</script>
